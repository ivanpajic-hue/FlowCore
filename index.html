/* =====================================================================
   PORUKE — kanali, direktne poruke, niti, reakcije (v2.3)
   Bezbednost je u bazi (RLS + security definer funkcije, flowcore_v2.3.sql):
   DM vide samo učesnici, poruka se piše samo u svoje ime, menja samo svoja.
   Realtime za poruke ide ZASEBNIM kanalom (inkrementalno, bez reload-a baze).
   ===================================================================== */
const CHAT = {
  /* Ko vidi zelene tačkice „online":
     "management" — samo menadžment/superadmin (iz presence_log, zaštićeno RLS-om)
     "all"        — svi (Supabase Realtime Presence) — PRE uključenja dopuniti
                    uputstvo za zaposlene, jer ono kaže da kolege ne vide prisustvo
     "off"        — niko */
  ONLINE_DOTS: "management",
  TASK_EVENTS: true,            /* objava u kanalu odeljenja kad se task kreira / završi */
  PAGE_SIZE: 200,
  GROUP_MIN: 5,                 /* uzastopne poruke istog autora unutar 5 min se grupišu */
  QUICK: ["👍","✅","👀","🙏","🔥","😂","❤️","⚠️"]
};

function normTxt(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d"); }
function reEsc(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }

const ChatService = {
  S:{ ready:false, channels:[], byId:{}, members:{}, msgs:{}, hasMore:{}, reactions:{},
      unread:{}, mentions:{}, active:null, thread:null, online:new Set(), typing:{},
      drafts:{}, newMarker:{}, rt:null, typingCh:null, presenceCh:null, onlineTimer:null,
      readTimers:{}, lastTypingSent:0 },
  me(){ return AppState.currentUser; },

  async start(){
    const S = ChatService.S;
    try{
      await ChatService.loadChannels();
      await ChatService.loadUnread();
      S.ready = true;
    }catch(e){
      console.warn("[Chat] nije dostupan — pokreni flowcore_v2.3.sql:", e);
      S.ready = false; S.error = (e&&e.message)||"greška";
    }
    ChatUI.renderNav();
    if(S.ready){ ChatService.subscribe(); ChatService.startOnline(); }
  },
  stop(){
    const S = ChatService.S;
    [S.rt, S.typingCh, S.presenceCh].forEach(ch=>{ if(ch){ try{ sb.removeChannel(ch); }catch(e){} } });
    S.rt = S.typingCh = S.presenceCh = null;
    if(S.onlineTimer){ clearInterval(S.onlineTimer); S.onlineTimer = null; }
    Object.assign(S, {ready:false, channels:[], byId:{}, members:{}, msgs:{}, hasMore:{}, reactions:{},
      unread:{}, mentions:{}, active:null, thread:null, online:new Set(), typing:{}, drafts:{}, newMarker:{}});
    document.title = "FlowCore";
  },

  /* ---------------- kanali ---------------- */
  mapChannel(r){
    const ch = {id:r.id, slug:r.slug, name:r.name, kind:r.kind, topic:r.topic||"",
      departmentId:r.department_id||null, department:(StorageService.deptById||{})[r.department_id]||"",
      createdAt:r.created_at, archived:!!r.archived};
    if(ch.kind==="dm"){
      const parts = ch.slug.split(":"), me = ChatService.me();
      ch.dmUser = parts[1]===(me&&me.id) ? parts[2] : parts[1];
    }
    return ch;
  },
  async loadChannels(){
    const S = ChatService.S;
    const r = await sb.from("channels").select("*").eq("archived", false).order("name",{ascending:true});
    if(r.error) throw r.error;
    S.channels = r.data.map(ChatService.mapChannel);
    S.byId = {}; S.channels.forEach(c=>S.byId[c.id]=c);
    const m = await sb.from("channel_members").select("*");
    if(!m.error){ S.members = {}; m.data.forEach(x=>{ S.members[x.channel_id] = {lastReadAt:x.last_read_at}; }); }
  },
  /* kanali (javni + privatni u kojima je korisnik član); DM su odvojeni */
  publicChannels(){ return ChatService.S.channels.filter(c=>c.kind!=="dm").sort((a,b)=>a.name==="opste"?-1:b.name==="opste"?1:a.name.localeCompare(b.name,"sr")); },
  dmChannels(){
    return ChatService.S.channels.filter(c=>c.kind==="dm" && TaskService.userById(c.dmUser))
      .sort((a,b)=>(ChatService.lastActivity(b.id)-ChatService.lastActivity(a.id)) || TaskService.userById(a.dmUser).name.localeCompare(TaskService.userById(b.dmUser).name,"sr"));
  },
  lastActivity(cid){ const l = ChatService.S.msgs[cid]; return l&&l.length ? +new Date(l[l.length-1].createdAt) : 0; },
  label(ch){
    if(!ch) return "";
    if(ch.kind==="dm"){ const u = TaskService.userById(ch.dmUser); return u?u.name:"Nepoznat korisnik"; }
    return "#"+ch.name;
  },
  canCreateChannel(u){ return ["superadmin","menadzment","teamlead"].includes(u.role); },
  slugify(name){ return normTxt(name).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40); },
  async createChannel(name, topic){
    const u = ChatService.me();
    if(!ChatService.canCreateChannel(u)) return {ok:false, error:"Kanale otvaraju menadžment i team lead."};
    const slug = ChatService.slugify(name);
    if(slug.length<2) return {ok:false, error:"Naziv kanala mora imati bar 2 slova ili cifre."};
    if(ChatService.S.channels.some(c=>c.slug===slug)) return {ok:false, error:"Kanal #"+slug+" već postoji."};
    const row = {id:uid(), slug, name:slug, kind:"public", topic:(topic||"").trim().slice(0,160), created_by:u.id};
    const r = await sb.from("channels").insert(row);
    if(r.error) return {ok:false, error:r.error.message||"Kanal nije napravljen."};
    const ch = ChatService.mapChannel(Object.assign({created_at:new Date().toISOString()}, row));
    ChatService.S.channels.push(ch); ChatService.S.byId[ch.id] = ch;
    AuditService.log("Novi kanal", ch.id, "#"+slug);
    return {ok:true, channel:ch};
  },
  async openDm(userId){
    const S = ChatService.S;
    const ex = S.channels.find(c=>c.kind==="dm" && c.dmUser===userId);
    if(ex) return {ok:true, channel:ex};
    const r = await sb.rpc("chat_open_dm", {other:userId});
    if(r.error) return {ok:false, error:r.error.message||"Razgovor nije otvoren."};
    await ChatService.loadChannels();
    const ch = S.byId[r.data];
    return ch ? {ok:true, channel:ch} : {ok:false, error:"Razgovor nije pronađen."};
  },

  /* ---------------- nepročitano ---------------- */
  async loadUnread(){
    const S = ChatService.S;
    const r = await sb.rpc("chat_unread");
    if(r.error){ console.warn("[Chat] chat_unread:", r.error); return; }
    S.unread = {}; S.mentions = {};
    (r.data||[]).forEach(x=>{ S.unread[x.channel_id] = Number(x.unread)||0; S.mentions[x.channel_id] = Number(x.mentions)||0; });
    ChatService.updateTitle();
  },
  badgeFor(cid){
    const S = ChatService.S, ch = S.byId[cid];
    const n = S.unread[cid]||0, m = S.mentions[cid]||0;
    if(ch && ch.kind==="dm") return n ? {n, strong:true} : null;
    if(m) return {n:m, strong:true};
    return n ? {n:0, strong:false} : null;
  },
  totalAttention(){
    const S = ChatService.S; let t = 0;
    S.channels.forEach(c=>{ t += c.kind==="dm" ? (S.unread[c.id]||0) : (S.mentions[c.id]||0); });
    return t;
  },
  updateTitle(){
    const t = ChatService.totalAttention();
    document.title = (t ? "("+t+") " : "") + "FlowCore";
    const b = document.querySelector('.bottom-nav [data-page="chatlist"] .bn-badge');
    if(b){ b.textContent = t; b.classList.toggle("hidden", !t); }
  },
  markRead(cid){
    const S = ChatService.S;
    S.unread[cid] = 0; S.mentions[cid] = 0;
    ChatService.updateTitle();
    clearTimeout(S.readTimers[cid]);
    S.readTimers[cid] = setTimeout(()=>{
      const now = new Date().toISOString();
      S.members[cid] = {lastReadAt:now};
      StorageService._enqueue(async()=>{
        const r = await sb.from("channel_members").upsert({channel_id:cid, user_id:ChatService.me().id, last_read_at:now}, {onConflict:"channel_id,user_id"});
        if(r.error) throw r.error;
      }, "pročitano", true);
    }, 1200);
  },

  /* ---------------- poruke ---------------- */
  mapMsg(r){ return {id:r.id, channelId:r.channel_id, userId:r.user_id, parentId:r.parent_id||null, kind:r.kind||"user",
    body:r.body||"", taskId:r.task_id||null, mentions:r.mentions||[], editedAt:r.edited_at||null,
    deletedAt:r.deleted_at||null, createdAt:r.created_at}; },
  async loadMessages(cid, older){
    const S = ChatService.S;
    let q = sb.from("messages").select("*").eq("channel_id", cid).order("created_at",{ascending:false}).limit(CHAT.PAGE_SIZE);
    const cur = S.msgs[cid]||[];
    if(older && cur.length) q = q.lt("created_at", cur[0].createdAt);
    const r = await q;
    if(r.error) throw r.error;
    const rows = r.data.map(ChatService.mapMsg).reverse();
    const ids = new Set(cur.map(m=>m.id));
    S.msgs[cid] = older ? rows.filter(m=>!ids.has(m.id)).concat(cur) : rows.concat(cur.filter(m=>!rows.some(x=>x.id===m.id)));
    S.msgs[cid].sort((a,b)=>a.createdAt<b.createdAt?-1:1);
    S.hasMore[cid] = r.data.length >= CHAT.PAGE_SIZE;
    if(rows.length){
      const rx = await sb.from("message_reactions").select("*").in("message_id", rows.map(m=>m.id));
      if(!rx.error) rx.data.forEach(x=>ChatService.addReactionLocal(x.message_id, x.user_id, x.emoji));
    }
    return rows.length;
  },
  find(id){
    const S = ChatService.S;
    for(const cid in S.msgs){ const m = S.msgs[cid].find(x=>x.id===id); if(m) return m; }
    return null;
  },
  replies(parentId){
    const p = ChatService.find(parentId); if(!p) return [];
    return (ChatService.S.msgs[p.channelId]||[]).filter(m=>m.parentId===parentId && !m.deletedAt);
  },
  parseMentions(body){
    const me = ChatService.me();
    return AppState.db.users.filter(u=>u.id!==me.id && body.includes("@"+u.name)).map(u=>u.id);
  },
  send(cid, body, parentId, extra){
    const S = ChatService.S, me = ChatService.me(), ch = S.byId[cid];
    extra = extra||{};
    body = String(body||"").replace(/\s+$/,"");
    if(!ch) return {ok:false, error:"Kanal ne postoji."};
    if(ch.archived) return {ok:false, error:"Kanal je arhiviran — u njega se ne piše."};
    if(!body.trim() && !extra.taskId) return {ok:false, error:"Poruka je prazna."};
    if(body.length > 4000) return {ok:false, error:"Poruka je duža od 4000 znakova."};
    const m = {id:uid(), channelId:cid, userId:me.id, parentId:parentId||null, kind:extra.kind||"user",
      body, taskId:extra.taskId||null, mentions:ChatService.parseMentions(body), editedAt:null, deletedAt:null,
      createdAt:new Date().toISOString(), pending:true};
    (S.msgs[cid] = S.msgs[cid]||[]).push(m);
    StorageService._enqueue(async()=>{
      const r = await sb.from("messages").insert({id:m.id, channel_id:cid, user_id:me.id, parent_id:m.parentId,
        kind:m.kind, body:m.body, task_id:m.taskId, mentions:m.mentions, created_at:m.createdAt});
      if(r.error){ m.pending = false; m.failed = true; ChatUI.refresh(cid); throw r.error; }
      m.pending = false; ChatUI.refresh(cid);
    }, "poruka");
    const where = ch.kind==="dm" ? "u direktnoj poruci" : "u #"+ch.name;
    m.mentions.forEach(uid_=>NotificationService.notify(uid_, "💬 "+me.name+" te je pomenuo/la "+where+": „"+body.slice(0,90)+(body.length>90?"…":"")+"“", m.taskId||null));
    S.drafts[cid] = "";
    return {ok:true, message:m};
  },
  retry(id){
    const m = ChatService.find(id); if(!m || !m.failed) return;
    const list = ChatService.S.msgs[m.channelId];
    list.splice(list.indexOf(m),1);
    ChatService.send(m.channelId, m.body, m.parentId, {kind:m.kind, taskId:m.taskId});
  },
  edit(id, body){
    const m = ChatService.find(id), me = ChatService.me();
    if(!m || m.userId!==me.id) return {ok:false, error:"Možete menjati samo svoje poruke."};
    body = String(body||"").trim();
    if(!body) return {ok:false, error:"Poruka ne može biti prazna — za brisanje koristite „Obriši“."};
    if(body===m.body) return {ok:true};
    m.body = body; m.editedAt = new Date().toISOString(); m.mentions = ChatService.parseMentions(body);
    StorageService._enqueue(async()=>{
      const r = await sb.from("messages").update({body:m.body, edited_at:m.editedAt, mentions:m.mentions}).eq("id", id);
      if(r.error) throw r.error;
    }, "izmena poruke");
    return {ok:true};
  },
  remove(id){
    const m = ChatService.find(id), me = ChatService.me();
    if(!m || m.userId!==me.id) return {ok:false, error:"Možete obrisati samo svoje poruke."};
    m.deletedAt = new Date().toISOString(); m.body = "";
    StorageService._enqueue(async()=>{
      const r = await sb.from("messages").update({deleted_at:m.deletedAt, body:""}).eq("id", id);
      if(r.error) throw r.error;
    }, "brisanje poruke");
    return {ok:true};
  },
  addReactionLocal(mid, userId, emoji){
    const R = ChatService.S.reactions, list = (R[mid] = R[mid]||[]);
    if(!list.some(x=>x.userId===userId && x.emoji===emoji)) list.push({userId, emoji});
  },
  removeReactionLocal(mid, userId, emoji){
    const R = ChatService.S.reactions;
    if(R[mid]) R[mid] = R[mid].filter(x=>!(x.userId===userId && x.emoji===emoji));
  },
  toggleReaction(mid, emoji){
    const me = ChatService.me(), list = ChatService.S.reactions[mid]||[];
    const has = list.some(x=>x.userId===me.id && x.emoji===emoji);
    if(has){
      ChatService.removeReactionLocal(mid, me.id, emoji);
      StorageService._enqueue(async()=>{
        const r = await sb.from("message_reactions").delete().eq("message_id", mid).eq("user_id", me.id).eq("emoji", emoji);
        if(r.error) throw r.error;
      }, "reakcija", true);
    }else{
      ChatService.addReactionLocal(mid, me.id, emoji);
      StorageService._enqueue(async()=>{
        const r = await sb.from("message_reactions").upsert({message_id:mid, user_id:me.id, emoji}, {onConflict:"message_id,user_id,emoji", ignoreDuplicates:true});
        if(r.error) throw r.error;
      }, "reakcija", true);
    }
    return !has;
  },
  async search(q){
    q = String(q||"").trim();
    if(q.length < 3) return [];
    const like = "%"+q.replace(/[%_\\]/g, c=>"\\"+c)+"%";
    const r = await sb.from("messages").select("*").ilike("body", like).is("deleted_at", null).order("created_at",{ascending:false}).limit(8);
    if(r.error){ console.warn("[Chat] pretraga:", r.error); return []; }
    return r.data.map(ChatService.mapMsg).filter(m=>ChatService.S.byId[m.channelId]);
  },

  /* ---------------- task ↔ kanal ---------------- */
  deptChannel(deptName){ return ChatService.S.channels.find(c=>c.kind==="public" && c.department===deptName); },
  taskEvent(kind, task){
    if(!CHAT.TASK_EVENTS || !ChatService.S.ready || !task) return;
    if(kind==="created" && ChatUI._fromMsg){
      const src = ChatService.find(ChatUI._fromMsg); ChatUI._fromMsg = null;
      if(src){ ChatService.send(src.channelId, "napravio/la je task iz ove poruke", src.parentId||src.id, {kind:"task", taskId:task.id}); return; }
    }
    const ch = ChatService.deptChannel(task.department); if(!ch) return;
    ChatService.send(ch.id, kind==="created" ? "kreirao/la je task" : "završio/la je task", null, {kind:"task", taskId:task.id});
    if(ChatService.S.active===ch.id) ChatUI.refresh(ch.id);
  },

  /* ---------------- realtime ---------------- */
  subscribe(){
    const S = ChatService.S;
    if(S.rt) return;
    try{
      const ch = sb.channel("flowcore-chat");
      ch.on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"}, p=>ChatService.onInsert(p.new));
      ch.on("postgres_changes",{event:"UPDATE",schema:"public",table:"messages"}, p=>ChatService.onUpdate(p.new));
      ch.on("postgres_changes",{event:"INSERT",schema:"public",table:"message_reactions"}, p=>ChatService.onReact(p.new, true));
      ch.on("postgres_changes",{event:"DELETE",schema:"public",table:"message_reactions"}, p=>ChatService.onReact(p.old, false));
      ch.on("postgres_changes",{event:"*",schema:"public",table:"channels"}, ()=>ChatService.onChannelsChanged());
      ch.on("postgres_changes",{event:"INSERT",schema:"public",table:"channel_members"}, p=>ChatService.onMembership(p.new, true));
      ch.on("postgres_changes",{event:"DELETE",schema:"public",table:"channel_members"}, p=>ChatService.onMembership(p.old, false));
      ch.subscribe(st=>{ if(st==="CHANNEL_ERROR") console.warn("[Chat] realtime kanal nije dostupan (flowcore_v2.3.sql?)"); });
      S.rt = ch;
      const ty = sb.channel("flowcore-typing");
      ty.on("broadcast",{event:"typing"}, msg=>ChatService.onTyping(msg && msg.payload));
      ty.subscribe();
      S.typingCh = ty;
    }catch(e){ console.warn("[Chat] realtime:", e); }
  },
  async onChannelsChanged(){
    try{ await ChatService.loadChannels(); }catch(e){ return; }
    ChatUI.renderNav();
    ChatService.leaveIfGone("Kanal više nije dostupan — arhiviran je ili obrisan.");
  },
  /* ako je otvoreni kanal arhiviran, obrisan ili je korisnik izbačen — izađi */
  leaveIfGone(msg){
    const S = ChatService.S;
    if(AppState.page==="chat" && S.active && !S.byId[S.active]){ S.active = null; S.thread = null; UI.toast(msg,"warn",6000); UI.go("dashboard"); }
  },
  async onMembership(row, added){
    const me = ChatService.me(); if(!row || !me || row.user_id!==me.id) return;
    const before = ChatService.S.byId[row.channel_id];
    try{ await ChatService.loadChannels(); }catch(e){ return; }
    ChatUI.renderNav();
    const ch = ChatService.S.byId[row.channel_id];
    if(added && ch && !before && ch.kind==="private") UI.toast("Dodati ste u privatni kanal #"+ch.name+".","ok",5000);
    if(!added) ChatService.leaveIfGone("Uklonjeni ste iz kanala"+(before&&before.name?" #"+before.name:"")+".");
  },
  async onInsert(row){
    const S = ChatService.S, me = ChatService.me();
    if(!row || !me) return;
    if(!S.byId[row.channel_id]){
      try{ await ChatService.loadChannels(); }catch(e){}
      if(!S.byId[row.channel_id]) return;
    }
    const cid = row.channel_id, list = (S.msgs[cid] = S.msgs[cid]||[]);
    const existing = list.find(m=>m.id===row.id);
    if(existing){ existing.pending = false; return; }   /* sopstvena poruka — već prikazana */
    const m = ChatService.mapMsg(row);
    list.push(m); list.sort((a,b)=>a.createdAt<b.createdAt?-1:1);
    if(m.userId===me.id) { ChatUI.refresh(cid); return; }
    if(S.typing[cid]) delete S.typing[cid][m.userId];
    const viewing = AppState.page==="chat" && S.active===cid && document.visibilityState==="visible";
    if(viewing){ ChatUI.refresh(cid, {incoming:true}); ChatService.markRead(cid); }
    else{
      if(!m.parentId) S.unread[cid] = (S.unread[cid]||0)+1;
      if(m.mentions.includes(me.id)) S.mentions[cid] = (S.mentions[cid]||0)+1;
      ChatService.updateTitle();
      ChatUI.refresh(cid);
    }
    if(S.thread && m.parentId===S.thread) ChatUI.renderThread();
    ChatUI.renderNav();
    const ch = S.byId[cid];
    if((ch.kind==="dm" || m.mentions.includes(me.id)) && (document.visibilityState!=="visible" || !viewing)) ChatUI.desktopNotify(m);
  },
  onUpdate(row){
    const m = row && ChatService.find(row.id); if(!m) return;
    Object.assign(m, ChatService.mapMsg(row));
    ChatUI.refresh(m.channelId);
    if(ChatService.S.thread && (m.id===ChatService.S.thread || m.parentId===ChatService.S.thread)) ChatUI.renderThread();
  },
  onReact(row, added){
    if(!row || !row.message_id) return;
    const me = ChatService.me(); if(row.user_id===me.id) return;   /* sopstvene su već lokalno */
    if(added) ChatService.addReactionLocal(row.message_id, row.user_id, row.emoji);
    else ChatService.removeReactionLocal(row.message_id, row.user_id, row.emoji);
    const m = ChatService.find(row.message_id);
    if(m){ ChatUI.refresh(m.channelId); if(ChatService.S.thread) ChatUI.renderThread(); }
  },
  sendTyping(cid){
    const S = ChatService.S;
    if(!S.typingCh || Date.now()-S.lastTypingSent < 2500) return;
    S.lastTypingSent = Date.now();
    try{ S.typingCh.send({type:"broadcast", event:"typing", payload:{cid, uid:ChatService.me().id}}); }catch(e){}
  },
  onTyping(p){
    const S = ChatService.S;
    if(!p || !p.cid || !p.uid || p.uid===ChatService.me().id || !S.byId[p.cid]) return;
    (S.typing[p.cid] = S.typing[p.cid]||{})[p.uid] = Date.now();
    if(S.active===p.cid) ChatUI.renderTyping();
  },

  /* ---------------- ko je online ---------------- */
  canSeeOnline(){
    const me = ChatService.me();
    if(CHAT.ONLINE_DOTS==="off") return false;
    if(CHAT.ONLINE_DOTS==="all") return true;
    return PermissionService.canUserViewPresence(me);
  },
  isOnline(userId){
    if(userId===ChatService.me().id) return true;
    return ChatService.canSeeOnline() && ChatService.S.online.has(userId);
  },
  startOnline(){
    const S = ChatService.S;
    if(!ChatService.canSeeOnline()) return;
    if(CHAT.ONLINE_DOTS==="all"){
      try{
        const me = ChatService.me();
        const ch = sb.channel("flowcore-online", {config:{presence:{key:me.id}}});
        ch.on("presence",{event:"sync"}, ()=>{ S.online = new Set(Object.keys(ch.presenceState())); ChatUI.renderNav(); });
        ch.subscribe(st=>{ if(st==="SUBSCRIBED") ch.track({at:Date.now()}); });
        S.presenceCh = ch;
      }catch(e){ console.warn("[Chat] presence:", e); }
      return;
    }
    const pull = async()=>{
      try{
        const rows = await StorageService.fetchPresence(new Date(Date.now()-6*60000).toISOString(), new Date().toISOString());
        S.online = new Set(rows.map(r=>r.user_id));
        ChatUI.renderNav();
      }catch(e){}
    };
    pull(); S.onlineTimer = setInterval(pull, 2*60000);
  }
};

const ChatUI = {
  _fromMsg:null, _editing:null, _mention:null, _typingTimer:null,
  isMobile(){ return window.matchMedia && window.matchMedia("(max-width:760px)").matches; },

  /* ---------------- sidebar ---------------- */
  renderNav(){
    const el = document.getElementById("chatNav"); if(!el) return;
    const S = ChatService.S, me = ChatService.me(); if(!me) return;
    if(!S.ready){
      el.innerHTML = UI.navSection("kanali","Kanali",
        '<div class="nav-note">Poruke još nisu uključene — superadmin treba da pokrene <b>flowcore_v2.3.sql</b>.</div>');
      return;
    }
    const item = (ch, inner)=>{
      const b = ChatService.badgeFor(ch.id);
      const act = AppState.page==="chat" && S.active===ch.id;
      return '<button class="nav-item ch-item'+(act?" active":"")+(b?" unread":"")+'" data-cid="'+ch.id+'" onclick="ChatUI.open(\''+ch.id+'\')">'+inner+
        (b&&b.n?'<span class="nav-badge'+(b.strong?" strong":"")+'">'+b.n+'</span>':"")+'</button>';
    };
    const chans = ChatService.publicChannels().map(ch=>item(ch, '<span class="ch-hash">'+(ch.kind==="private"?CI.lock:"#")+'</span><span class="ch-name">'+esc(ch.name)+'</span>')).join("");
    const dms = ChatService.dmChannels().map(ch=>{
      const u = TaskService.userById(ch.dmUser);
      return item(ch, '<span class="dm-av">'+avatarHtml(u,20)+(ChatService.canSeeOnline()?'<i class="dot'+(ChatService.isOnline(u.id)?" on":"")+'"></i>':"")+'</span><span class="ch-name">'+esc(u.name)+'</span>');
    }).join("");
    el.innerHTML =
      UI.navSection("kanali","Kanali", chans || '<div class="nav-note">Nema kanala.</div>',
        ChatService.canCreateChannel(me)?'<button class="nav-add" title="Novi kanal" aria-label="Novi kanal" onclick="ChatUI.newChannel()">'+CI.plus+'</button>':"")+
      UI.navSection("dm","Direktne poruke", dms + '<button class="nav-item nav-ghost" onclick="ChatUI.switcher(\'people\')">'+CI.plus+'<span>Nova poruka</span></button>',
        '<button class="nav-add" title="Nova direktna poruka" aria-label="Nova direktna poruka" onclick="ChatUI.switcher(\'people\')">'+CI.plus+'</button>');
    ChatService.updateTitle();
  },

  /* ---------------- otvaranje kanala ---------------- */
  async open(cid, opts){
    opts = opts||{};
    const S = ChatService.S;
    if(!S.ready){ UI.toast("Poruke nisu uključene — pokrenuti flowcore_v2.3.sql.","warn",6000); return; }
    if(!cid || !S.byId[cid]){ const o = ChatService.publicChannels()[0]; if(!o) return; cid = o.id; }
    ChatUI.saveDraft();
    const switched = S.active!==cid;
    S.active = cid; AppState.page = "chat";
    if(switched){ S.thread = null; ChatUI._editing = null; }
    S._unreadAtOpen = S.unread[cid]||0;
    document.querySelector(".main").classList.add("chat-mode");
    document.querySelectorAll(".nav-item,.bottom-nav button").forEach(b=>b.classList.remove("active"));
    const nb = document.querySelector('.bottom-nav [data-page="chatlist"]'); if(nb) nb.classList.add("active");
    $("#notifPanel").classList.add("hidden");
    ChatUI.renderHeader();
    $("#pageContent").innerHTML = ChatUI.viewHtml();
    ChatUI.bindView();
    if(!S.msgs[cid] || switched){
      $("#msgScroll").innerHTML = '<div class="chat-loading">Učitavanje poruka…</div>';
      try{ await ChatService.loadMessages(cid); }
      catch(e){ $("#msgScroll").innerHTML = '<div class="chat-empty"><b>Poruke se ne mogu učitati.</b>'+esc(e.message||"")+'</div>'; return; }
      if(S.active!==cid) return;
    }
    /* Razdelnik „Nove“ obeležava tačno onoliko poruka koliko je pokazivala značka */
    if(switched){
      const me = ChatService.me(), n = S._unreadAtOpen||0;
      const others = (S.msgs[cid]||[]).filter(m=>!m.parentId && !m.deletedAt && m.userId!==me.id);
      S.newMarker[cid] = n ? (others[Math.max(0, others.length-n)]||{}).id || null : null;
    }
    ChatUI.refresh(cid, {forceBottom:true});
    if(S.thread) ChatUI.renderThread();
    ChatService.markRead(cid);
    ChatUI.renderNav();
    if(opts.highlight) ChatUI.flash(opts.highlight);
    else if(!ChatUI.isMobile()) setTimeout(()=>{ const c = $("#composerInput"); if(c) c.focus(); }, 30);
  },
  renderHeader(){
    const S = ChatService.S, ch = S.byId[S.active]; if(!ch) return;
    const t = $("#topbarTitle");
    if(ch.kind==="dm"){
      const u = TaskService.userById(ch.dmUser);
      t.innerHTML = '<span class="tt-main">'+avatarHtml(u,22)+' '+esc(u?u.name:"")+'</span><span class="tt-sub">'+esc(u?(ROLES[u.role]||{}).label+" · "+u.department:"")+'</span>';
    }else{
      t.innerHTML = '<span class="tt-main">'+(ch.kind==="private"?'<span class="tt-lock">'+CI.lock+'</span>':'<span class="tt-hash">#</span>')+esc(ch.name)+'</span>'+(ch.topic?'<span class="tt-sub">'+esc(ch.topic)+'</span>':"");
    }
    ChatUI.headerActions();
  },
  viewHtml(){
    const S = ChatService.S, ch = S.byId[S.active];
    const ph = ch.kind==="dm" ? "Poruka za "+esc(ChatService.label(ch)) : "Poruka u #"+esc(ch.name);

      '<section class="chat-main">'+
        (canNotify?'<div class="chat-banner" id="notifBanner">'+CI.bell+'<span>Uključi obaveštenja na računaru da ne propustiš direktne poruke i pominjanja.</span><button class="btn btn-sm" data-act="notif-on">Uključi</button><button class="btn btn-sm btn-ghost" data-act="notif-later">Kasnije</button></div>':"")+
        '<div class="msg-scroll" id="msgScroll" role="log" aria-live="polite"></div>'+

  composerHtml(id, ph){
    return '<div class="composer" data-for="'+id+'">'+
      '<div class="composer-box">'+
        '<textarea id="'+id+'" rows="1" placeholder="'+ph+'" aria-label="'+ph+'"></textarea>'+
        '<div class="composer-bar"><span class="composer-hint"><b>Enter</b> šalje · <b>Shift+Enter</b> novi red · <b>@</b> pominje kolegu · *podebljano* `kod`</span>'+
        '<button class="send-btn" data-act="send" data-input="'+id+'" disabled title="Pošalji" aria-label="Pošalji">'+CI.send+'</button></div>'+
      '</div><div class="mention-pop hidden"></div></div>';
  },
  bindView(){
    const S = ChatService.S, inp = $("#composerInput");
    if(inp){ inp.value = S.drafts[S.active]||""; ChatUI.autoGrow(inp); ChatUI.syncSend(inp); }
    const sc = $("#msgScroll");

      if(ChatUI.nearBottom()) $("#jumpNew").classList.add("hidden");
      if(sc.scrollTop < 60 && S.hasMore[S.active] && !ChatUI._loadingOlder) ChatUI.loadOlder();
    });
  },
  saveDraft(){
    const S = ChatService.S, inp = $("#composerInput");
    if(inp && S.active) S.drafts[S.active] = inp.value;
  },
  async loadOlder(){
    const S = ChatService.S, cid = S.active, sc = $("#msgScroll");
    ChatUI._loadingOlder = true;
    const h0 = sc.scrollHeight;
    try{ await ChatService.loadMessages(cid, true); }catch(e){}
    ChatUI._loadingOlder = false;
    if(S.active!==cid) return;
    ChatUI.refresh(cid, {keep:true});
    sc.scrollTop = sc.scrollHeight - h0;
  },
  nearBottom(){ const sc = $("#msgScroll"); return !sc || sc.scrollHeight - sc.scrollTop - sc.clientHeight < 120; },

  /* ---------------- render poruka ---------------- */
  refresh(cid, o){
    o = o||{};
    const S = ChatService.S;
    if(AppState.page!=="chat" || S.active!==cid) return;
    const sc = $("#msgScroll"); if(!sc) return;
    const stick = o.forceBottom || ChatUI.nearBottom();
    sc.innerHTML = ChatUI.listHtml(cid);
    if(stick) sc.scrollTop = sc.scrollHeight;
    else if(o.incoming) $("#jumpNew").classList.remove("hidden");
    ChatUI.renderTyping();
  },
  listHtml(cid){
    const S = ChatService.S, ch = S.byId[cid], me = ChatService.me();
    const all = S.msgs[cid]||[];
    const top = all.filter(m=>!m.parentId && !(m.deletedAt && !ChatService.replies(m.id).length));
    let h = "";
    if(!S.hasMore[cid]) h += ChatUI.introHtml(ch);
    else h += '<div class="chat-loading small">Skroluj gore za starije poruke</div>';
    let prev = null, lastDay = null, markerDone = false;
    const marker = S.newMarker[cid];
    top.forEach(m=>{
      const day = dateInput(m.createdAt);
      if(day!==lastDay){ h += '<div class="day-div"><span>'+ChatUI.dayLabel(m.createdAt)+'</span></div>'; lastDay = day; prev = null; }
      if(marker && !markerDone && m.id===marker){ h += '<div class="new-div"><span>Nove</span></div>'; markerDone = true; prev = null; }
      h += ChatUI.msgHtml(m, prev, false);
      prev = m;
    });
    if(!top.length) h += '<div class="chat-hint">Napiši prvu poruku ili podeli task iz njegovog detalja (dugme „Podeli u kanal“).</div>';
    return h;
  },
  introHtml(ch){
    if(ch.kind==="dm"){
      const u = TaskService.userById(ch.dmUser);
      return '<div class="chat-intro">'+avatarHtml(u,56)+'<h2>'+esc(u?u.name:"")+'</h2><p>Ovo je početak vašeg razgovora. Vidite ga samo vas dvoje.</p></div>';
    }
    return '<div class="chat-intro"><div class="intro-hash">'+(ch.kind==="private"?CI.lock:"#")+'</div><h2>'+esc(ch.name)+'</h2><p>'+(ch.topic?esc(ch.topic)+". ":"")+(ch.kind==="private"?'Privatni kanal — vide ga samo članovi.':'Kanal vide svi zaposleni.')+'</p></div>';
  },
  dayLabel(iso){
    const d = startOfDay(iso), t = startOfDay(new Date()), diff = Math.round((t-d)/864e5);
    if(diff===0) return "Danas";
    if(diff===1) return "Juče";
    const W = ["nedelja","ponedeljak","utorak","sreda","četvrtak","petak","subota"];
    const M = ["januar","februar","mart","april","maj","jun","jul","avgust","septembar","oktobar","novembar","decembar"];
    const x = new Date(iso);
    return W[x.getDay()]+", "+x.getDate()+". "+M[x.getMonth()]+(x.getFullYear()!==new Date().getFullYear()?" "+x.getFullYear()+".":"");
  },
  msgHtml(m, prev, inThread){
    const me = ChatService.me(), u = TaskService.userById(m.userId);
    const grouped = prev && prev.userId===m.userId && prev.kind===m.kind && m.kind==="user" && !prev.deletedAt &&
      (new Date(m.createdAt)-new Date(prev.createdAt)) < CHAT.GROUP_MIN*60000;
    const mine = m.userId===me.id, mentioned = m.mentions.includes(me.id);
    const time = fmtTime(m.createdAt);
    if(m.kind==="task" && !m.deletedAt){
      return '<div class="msg msg-sys" id="m-'+m.id+'" data-id="'+m.id+'">'+
        '<div class="msg-gutter">'+avatarHtml(u,36)+'</div><div class="msg-body">'+
        '<div class="msg-head"><b>'+esc(u?u.name:"Bivši korisnik")+'</b><span class="sys-txt">'+esc(m.body||"je podelio/la task")+'</span><time title="'+fmtDateTime(m.createdAt)+'">'+time+'</time></div>'+
        ChatUI.taskCard(m.taskId)+ChatUI.reactsHtml(m)+(inThread?"":ChatUI.threadLink(m))+'</div>'+ChatUI.toolsHtml(m, mine, inThread)+'</div>';
    }
    const body = m.deletedAt ? '<span class="msg-deleted">Poruka je obrisana.</span>'
      : (ChatUI._editing===m.id ? ChatUI.editHtml(m) : '<div class="msg-text">'+ChatUI.fmtBody(m.body)+(m.editedAt?' <span class="edited">(izmenjeno)</span>':"")+'</div>'+(m.taskId?ChatUI.taskCard(m.taskId):""));
    return '<div class="msg'+(grouped?" grouped":"")+(mentioned?" mention-me":"")+(m.pending?" pending":"")+(m.failed?" failed":"")+'" id="m-'+m.id+'" data-id="'+m.id+'">'+
      '<div class="msg-gutter">'+(grouped?'<time class="g-time" title="'+fmtDateTime(m.createdAt)+'">'+time+'</time>':avatarHtml(u,36))+'</div>'+
      '<div class="msg-body">'+
        (grouped?"":'<div class="msg-head"><b>'+esc(u?u.name:"Bivši korisnik")+'</b><time title="'+fmtDateTime(m.createdAt)+'">'+time+'</time></div>')+
        body+
        (m.failed?'<div class="msg-failed">Nije poslato. <button class="link-btn" data-act="retry" data-id="'+m.id+'">Pošalji ponovo</button></div>':"")+
        (m.deletedAt?"":ChatUI.reactsHtml(m))+(inThread?"":ChatUI.threadLink(m))+
      '</div>'+(m.deletedAt?"":ChatUI.toolsHtml(m, mine, inThread))+'</div>';
  },
  toolsHtml(m, mine, inThread){
    const q = (e)=>'<button class="tool-q" data-act="react" data-id="'+m.id+'" data-emoji="'+e+'" title="Reaguj '+e+'">'+e+'</button>';
    return '<div class="msg-tools" role="toolbar" aria-label="Akcije poruke">'+q("👍")+q("✅")+q("👀")+
      '<button data-act="react-pick" data-id="'+m.id+'" title="Dodaj reakciju" aria-label="Dodaj reakciju">'+CI.smile+'</button>'+
      (inThread?"":'<button data-act="thread" data-id="'+m.id+'" title="Odgovori u niti" aria-label="Odgovori u niti">'+CI.reply+'</button>')+
      (m.kind==="user"?'<button data-act="mk-task" data-id="'+m.id+'" title="Napravi task iz poruke" aria-label="Napravi task iz poruke">'+CI.task+'</button>':"")+
      (mine&&m.kind==="user"?'<button data-act="edit" data-id="'+m.id+'" title="Izmeni" aria-label="Izmeni">'+CI.edit+'</button><button data-act="del" data-id="'+m.id+'" title="Obriši" aria-label="Obriši" class="t-danger">'+CI.trash+'</button>':"")+
    '</div>';
  },
  reactsHtml(m){
    const list = ChatService.S.reactions[m.id]||[]; if(!list.length) return "";
    const me = ChatService.me(), by = {};
    list.forEach(r=>{ (by[r.emoji] = by[r.emoji]||[]).push(r.userId); });
    return '<div class="reacts">'+Object.keys(by).map(e=>{
      const ids = by[e], names = ids.map(id=>{ const u = TaskService.userById(id); return id===me.id?"vi":(u?u.name.split(" ")[0]:"?"); }).join(", ");
      return '<button class="rx'+(ids.includes(me.id)?" mine":"")+'" data-act="react" data-id="'+m.id+'" data-emoji="'+e+'" title="'+esc(names)+'">'+e+'<b>'+ids.length+'</b></button>';
    }).join("")+'<button class="rx rx-add" data-act="react-pick" data-id="'+m.id+'" title="Dodaj reakciju" aria-label="Dodaj reakciju">'+CI.smile+'</button></div>';
  },
  threadLink(m){
    const rs = ChatService.replies(m.id); if(!rs.length) return "";
    const people = [...new Set(rs.map(r=>r.userId))].slice(0,4).map(id=>avatarHtml(TaskService.userById(id),20)).join("");
    return '<button class="thread-link" data-act="thread" data-id="'+m.id+'">'+people+'<b>'+rs.length+' '+ChatUI.plOdg(rs.length)+'</b><span>Poslednji '+ChatUI.relTime(rs[rs.length-1].createdAt)+'</span></button>';
  },
  plOdg(n){ return (n%10===1 && n%100!==11) ? "odgovor" : "odgovora"; },
  relTime(iso){ return dateInput(iso)===dateInput(new Date().toISOString()) ? "danas u "+fmtTime(iso) : fmtDateTime(iso); },
  taskCard(taskId){
    if(!taskId) return "";
    const t = TaskService.getTask(taskId);
    if(!t) return '<div class="tcard tcard-off">Task više ne postoji.</div>';
    if(!PermissionService.canUserAccessTask(ChatService.me(), t)) return '<div class="tcard tcard-off">🔒 Task nije dostupan vašoj ulozi.</div>';
    const d = TaskService.calculateTaskDelay(t), asg = TaskService.assigneeIds(t).map(id=>TaskService.userById(id)).filter(Boolean);
    return '<div class="tcard pri-'+normTxt(t.priority)+'" data-act="open-task" data-task="'+t.id+'" role="button" tabindex="0">'+
      '<div class="tcard-top">'+UI.statusBadge(t.status)+UI.priBadge(t.priority)+(d.late&&OPEN_STATUSES.includes(t.status)?'<span class="badge b-late">kasni +'+d.days+' d</span>':"")+'</div>'+
      '<div class="tcard-title">'+esc(t.title)+'</div>'+
      '<div class="tcard-meta"><span>'+esc(t.department)+'</span><span>rok '+fmtDate(t.dueDate)+'</span><span class="tcard-av">'+asg.slice(0,4).map(x=>avatarHtml(x,20)).join("")+'</span></div></div>';
  },
  fmtBody(text){
    const keep = [];
    const stash = html=>{ keep.push(html); return "\u0000"+(keep.length-1)+"\u0000"; };
    let h = esc(text);
    h = h.replace(/```\n?([\s\S]+?)```/g, (_,c)=>stash('<pre class="m-code">'+c+'</pre>'));
    h = h.replace(/`([^`\n]+)`/g, (_,c)=>stash('<code>'+c+'</code>'));
    h = h.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, u=>stash('<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+u+'</a>'));
    const users = AppState.db.users.slice().sort((a,b)=>b.name.length-a.name.length);
    if(users.length){
      const me = ChatService.me();
      const re = new RegExp("@("+users.map(u=>reEsc(esc(u.name))).join("|")+")(?![\\p{L}\\d])","gu");
      h = h.replace(re, (all,name)=>{ const u = users.find(x=>esc(x.name)===name); return stash('<span class="mention'+(u&&u.id===me.id?" me":"")+'">@'+name+'</span>'); });
    }
    h = h.replace(/(^|[\s(])\*([^*\n]+)\*(?=$|[\s.,!?:;)])/g, "$1<b>$2</b>");
    h = h.replace(/(^|[\s(])_([^_\n]+)_(?=$|[\s.,!?:;)])/g, "$1<i>$2</i>");
    h = h.replace(/\n/g, "<br>");
    return h.replace(/\u0000(\d+)\u0000/g, (_,i)=>keep[+i]);
  },
  editHtml(m){
    return '<div class="msg-edit"><textarea id="editInput" rows="2">'+esc(m.body)+'</textarea>'+
      '<div class="edit-bar"><span class="small muted">Enter čuva · Esc otkazuje</span><button class="btn btn-sm" data-act="edit-cancel">Otkaži</button><button class="btn btn-sm btn-primary" data-act="edit-save" data-id="'+m.id+'">Sačuvaj</button></div></div>';
  },
  renderTyping(){
    const el = $("#typingLine"), S = ChatService.S; if(!el) return;
    const t = S.typing[S.active]||{}, now = Date.now();
    const ids = Object.keys(t).filter(id=>now-t[id] < 5000);
    const names = ids.map(id=>{ const u = TaskService.userById(id); return u?u.name.split(" ")[0]:null; }).filter(Boolean);
    el.innerHTML = !names.length ? "" : '<span class="typing-dots"><i></i><i></i><i></i></span>'+
      (names.length===1 ? "<b>"+esc(names[0])+"</b> piše…" : names.length===2 ? "<b>"+esc(names[0])+"</b> i <b>"+esc(names[1])+"</b> pišu…" : "Više osoba piše…");
    clearTimeout(ChatUI._typingTimer);
    if(names.length) ChatUI._typingTimer = setTimeout(ChatUI.renderTyping, 1500);
  },
  flash(id){
    const el = document.getElementById("m-"+id);
    if(!el){ UI.toast("Poruka je starija od učitanih — skroluj gore u kanalu.","",4000); return; }
    el.scrollIntoView({block:"center"});
    el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"), 2200);
  },

  /* ---------------- nit ---------------- */
  openThread(id){
    const S = ChatService.S; S.thread = id;
    ChatUI.renderThread();
    setTimeout(()=>{ const t = $("#threadInput"); if(t && !ChatUI.isMobile()) t.focus(); }, 30);
  },
  closeThread(){
    const S = ChatService.S, p = $("#threadPanel");
    S.thread = null; if(p){ p.classList.add("hidden"); p.innerHTML = ""; }
  },
  renderThread(){
    const S = ChatService.S, p = $("#threadPanel"); if(!p || !S.thread) return;
    const parent = ChatService.find(S.thread); if(!parent){ ChatUI.closeThread(); return; }
    const draft = $("#threadInput") ? $("#threadInput").value : "";
    const rs = ChatService.replies(parent.id);
    const ch = S.byId[parent.channelId];
    let prev = null;
    p.classList.remove("hidden");
    p.innerHTML = '<div class="thread-head"><div><b>Nit</b><span>'+esc(ChatService.label(ch))+'</span></div><button class="icon-btn sm" data-act="thread-close" aria-label="Zatvori nit">'+CI.close+'</button></div>'+
      '<div class="thread-scroll" id="threadScroll">'+ChatUI.msgHtml(parent, null, true)+
      '<div class="thread-count"><span>'+rs.length+' '+ChatUI.plOdg(rs.length)+'</span></div>'+
      rs.map(r=>{ const h = ChatUI.msgHtml(r, prev, true); prev = r; return h; }).join("")+'</div>'+
      ChatUI.composerHtml("threadInput", "Odgovori u niti…");
    const ti = $("#threadInput"); ti.value = draft; ChatUI.autoGrow(ti); ChatUI.syncSend(ti);

  },

  /* ---------------- composer ---------------- */
  autoGrow(t){ t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, window.innerHeight*0.4)+"px"; },
  syncSend(t){ const b = document.querySelector('[data-act="send"][data-input="'+t.id+'"]'); if(b) b.disabled = !t.value.trim(); },
  submit(inputId){
    const S = ChatService.S, t = document.getElementById(inputId); if(!t) return;
    const parent = inputId==="threadInput" ? S.thread : null;
    const cid = parent ? ChatService.find(parent).channelId : S.active;
    const r = ChatService.send(cid, t.value, parent);
    if(!r.ok){ if(t.value.trim()) UI.toast(r.error,"warn"); return; }
    t.value = ""; ChatUI.autoGrow(t); ChatUI.syncSend(t); ChatUI.hideMention(t);
    ChatUI.refresh(cid, {forceBottom:!parent});
    if(parent) ChatUI.renderThread();
    ChatService.markRead(cid);
  },
  onKey(e){
    const t = e.target;
    if(t.id==="editInput"){
      if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); ChatUI.saveEdit(ChatUI._editing); }
      else if(e.key==="Escape"){ e.preventDefault(); ChatUI.cancelEdit(); }
      return;
    }
    if(t.id!=="composerInput" && t.id!=="threadInput") return;
    const pop = ChatUI._mention;
    if(pop && pop.input===t && pop.items.length){
      if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); pop.sel = (pop.sel + (e.key==="ArrowDown"?1:-1) + pop.items.length) % pop.items.length; ChatUI.drawMention(); return; }
      if(e.key==="Enter"||e.key==="Tab"){ e.preventDefault(); ChatUI.pickMention(pop.items[pop.sel].id); return; }
      if(e.key==="Escape"){ e.preventDefault(); ChatUI.hideMention(t); return; }
    }
    if(e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); ChatUI.submit(t.id); return; }
    if(e.key==="ArrowUp" && !t.value && t.id==="composerInput"){
      const me = ChatService.me(), list = (ChatService.S.msgs[ChatService.S.active]||[]).filter(m=>m.userId===me.id && !m.deletedAt && !m.parentId && m.kind==="user");
      if(list.length){ e.preventDefault(); ChatUI.startEdit(list[list.length-1].id); }
    }
    if(e.key==="Escape" && t.id==="threadInput"){ ChatUI.closeThread(); }
  },
  onInput(e){
    const t = e.target;
    if(t.id!=="composerInput" && t.id!=="threadInput") return;
    ChatUI.autoGrow(t); ChatUI.syncSend(t);
    if(t.value.trim()) ChatService.sendTyping(t.id==="threadInput" ? ChatService.find(ChatService.S.thread).channelId : ChatService.S.active);
    const before = t.value.slice(0, t.selectionStart);
    const mm = before.match(/(^|\s)@([\p{L}\d]*(?: [\p{L}\d]*)?)$/u);
    if(!mm){ ChatUI.hideMention(t); return; }
    const q = normTxt(mm[2]), me = ChatService.me();
    const items = AppState.db.users.filter(u=>u.id!==me.id && (!q || normTxt(u.name).split(" ").some(p=>p.startsWith(q)) || normTxt(u.name).startsWith(q))).slice(0,6);
    if(!items.length){ ChatUI.hideMention(t); return; }
    ChatUI._mention = {input:t, start:before.length - mm[2].length - 1, items, sel:0};
    ChatUI.drawMention();
  },
  drawMention(){
    const p = ChatUI._mention; if(!p) return;
    const pop = p.input.closest(".composer").querySelector(".mention-pop");
    pop.innerHTML = p.items.map((u,i)=>'<button class="mp-item'+(i===p.sel?" sel":"")+'" data-act="mention" data-uid="'+u.id+'">'+avatarHtml(u,22)+'<b>'+esc(u.name)+'</b><span>'+esc(u.department)+'</span></button>').join("");
    pop.classList.remove("hidden");
  },
  hideMention(t){
    if(ChatUI._mention && (!t || ChatUI._mention.input===t)){
      const pop = ChatUI._mention.input.closest(".composer") && ChatUI._mention.input.closest(".composer").querySelector(".mention-pop");
      if(pop) pop.classList.add("hidden");
      ChatUI._mention = null;
    }
  },
  pickMention(userId){
    const p = ChatUI._mention, u = TaskService.userById(userId); if(!p || !u) return;
    const t = p.input, v = t.value, caret = t.selectionStart;
    const ins = "@"+u.name+" ";
    t.value = v.slice(0, p.start) + ins + v.slice(caret);
    const pos = p.start + ins.length;
    t.setSelectionRange(pos, pos); t.focus();
    ChatUI.hideMention(t); ChatUI.autoGrow(t); ChatUI.syncSend(t);
  },

  /* ---------------- izmena / brisanje ---------------- */
  startEdit(id){ ChatUI._editing = id; const m = ChatService.find(id); ChatUI.refresh(m.channelId); if(ChatService.S.thread) ChatUI.renderThread();
    setTimeout(()=>{ const e = $("#editInput"); if(e){ e.focus(); e.setSelectionRange(e.value.length, e.value.length); ChatUI.autoGrow(e); } }, 20); },
  cancelEdit(){ const id = ChatUI._editing; ChatUI._editing = null; const m = id && ChatService.find(id); if(m){ ChatUI.refresh(m.channelId); if(ChatService.S.thread) ChatUI.renderThread(); } },
  saveEdit(id){
    const e = $("#editInput"); if(!e) return;
    const r = ChatService.edit(id, e.value);
    if(!r.ok){ UI.toast(r.error,"warn"); return; }
    ChatUI.cancelEdit();
  },
  askDelete(id){
    UI.confirm("Obrisati poruku? Ova radnja se ne može poništiti.", ()=>{
      const r = ChatService.remove(id); if(!r.ok){ UI.toast(r.error,"warn"); return; }
      const m = ChatService.find(id); ChatUI.refresh(m.channelId); if(ChatService.S.thread) ChatUI.renderThread();
    });
  },

  /* ---------------- reakcije ---------------- */
  reactPicker(btn, id){
    ChatUI.closePops();
    const pop = document.createElement("div");
    pop.className = "react-pop"; pop.id = "reactPop";
    pop.innerHTML = CHAT.QUICK.map(e=>'<button data-act="react" data-id="'+id+'" data-emoji="'+e+'" aria-label="Reaguj '+e+'">'+e+'</button>').join("");
    document.body.appendChild(pop);
    const r = btn.getBoundingClientRect();
    pop.style.top = Math.max(8, r.top - 50)+"px";
    pop.style.left = Math.max(8, Math.min(window.innerWidth - 300, r.left - 120))+"px";
  },
  closePops(){ const p = $("#reactPop"); if(p) p.remove(); },
  react(id, emoji){
    ChatService.toggleReaction(id, emoji);
    const m = ChatService.find(id); if(!m) return;
    ChatUI.refresh(m.channelId); if(ChatService.S.thread) ChatUI.renderThread();

  /* ---------------- task ↔ poruka ---------------- */
  taskFromMessage(id){
    const m = ChatService.find(id); if(!m) return;
    const u = TaskService.userById(m.userId), ch = ChatService.S.byId[m.channelId];
    ChatUI._fromMsg = id;
    UI.openTaskForm();
    setTimeout(()=>{
      const plain = m.body.replace(/\s+/g," ").trim();
      if($("#fTitle")) $("#fTitle").value = plain.slice(0,80) + (plain.length>80?"…":"");
      if($("#fDesc")) $("#fDesc").value = m.body + "\n\n— iz "+ChatService.label(ch)+", poruka od "+(u?u.name:"?")+" ("+fmtDateTime(m.createdAt)+")";
      if(ch && ch.department && $("#fDept")){ $("#fDept").value = ch.department; if(UI.formDeptChanged) try{ UI.formDeptChanged(); }catch(e){} }
    }, 30);
  },
  shareTask(taskId){
    const S = ChatService.S, t = TaskService.getTask(taskId);
    if(!S.ready){ UI.toast("Poruke nisu uključene — pokrenuti flowcore_v2.3.sql.","warn",6000); return; }
    if(!t) return;
    const opts = ChatService.publicChannels().concat(ChatService.dmChannels());

    UI.modal('<header><h2>Podeli task u kanal</h2><button class="btn btn-sm" onclick="UI.closeModal()">✕</button></header>'+
      '<div class="modal-body"><div class="share-task">'+ChatUI.taskCard(taskId)+'</div>'+
      '<div class="field"><label>Kanal ili osoba</label><select id="shareCh">'+opts.map(c=>'<option value="'+c.id+'"'+(dept&&dept.id===c.id?" selected":"")+'>'+esc(ChatService.label(c))+'</option>').join("")+'</select></div>'+
      '<div class="field"><label>Poruka uz task (nije obavezno)</label><textarea id="shareNote" rows="2" placeholder="npr. @Jelena možeš li ovo danas?"></textarea></div>'+
      '<p class="small muted">Kolege koje po svojoj ulozi ne vide ovaj task videće samo oznaku 🔒, ne i sadržaj.</p></div>'+
      '<footer><button class="btn" onclick="UI.closeModal()">Otkaži</button><button class="btn btn-primary" onclick="ChatUI.doShare(\''+taskId+'\')">Podeli</button></footer>');
  },
  doShare(taskId){
    const cid = $("#shareCh").value, note = $("#shareNote").value;
    const r = ChatService.send(cid, note, null, {kind:note.trim()?"user":"task", taskId});
    if(!r.ok){ UI.toast(r.error,"warn"); return; }
    UI.closeModal();
    UI.toast("Task podeljen u "+ChatService.label(ChatService.S.byId[cid])+".","ok");
    if(AppState.page==="chat" && ChatService.S.active===cid) ChatUI.refresh(cid, {forceBottom:true});
  },

  /* ---------------- novi kanal ---------------- */
  newChannel(){
    UI.modal('<header><h2>Novi kanal</h2><button class="btn btn-sm" onclick="UI.closeModal()">✕</button></header>'+
      '<div class="modal-body">'+
      '<div class="field"><label>Naziv</label><input id="chName" maxlength="40" placeholder="npr. servis-foton" oninput="document.getElementById(\'chSlug\').textContent=\'#\'+(ChatService.slugify(this.value)||\'…\')"></div>'+
      '<p class="small muted" style="margin:-6px 0 12px">Adresa kanala: <b id="chSlug">#…</b></p>'+
      '<div class="field"><label>Tema (nije obavezno)</label><input id="chTopic" maxlength="160" placeholder="O čemu se razgovara u ovom kanalu"></div>'+
      '<p class="small muted">Kanal je javan — vide ga svi zaposleni. Za razgovor u četiri oka koristite direktnu poruku.</p></div>'+
      '<footer><button class="btn" onclick="UI.closeModal()">Otkaži</button><button class="btn btn-primary" onclick="ChatUI.doNewChannel()">Napravi kanal</button></footer>');
    setTimeout(()=>$("#chName").focus(), 30);
  },
  async doNewChannel(){
    const r = await ChatService.createChannel($("#chName").value, $("#chTopic").value);
    if(!r.ok){ UI.toast(r.error,"warn",5000); return; }
    UI.closeModal(); UI.toast("Kanal #"+r.channel.name+" je napravljen.","ok");
    ChatUI.open(r.channel.id);
  },

  /* ---------------- brza pretraga (Ctrl/⌘+K) ---------------- */
  switcher(mode){
    UI.modal('<div class="qs" role="dialog" aria-label="Pretraga">'+
      '<div class="qs-in">'+CI.search+'<input id="qsInput" placeholder="'+(mode==="people"?"Kome pišeš?":"Idi na kanal, osobu, task ili stranicu — ili traži u porukama")+'" autocomplete="off"><kbd>Esc</kbd></div>'+
      '<div class="qs-list" id="qsList"></div>'+
      '<div class="qs-foot"><span><kbd>↑</kbd><kbd>↓</kbd> biraj</span><span><kbd>Enter</kbd> otvori</span><span>poruke se pretražuju od 3 slova</span></div></div>');
    document.querySelector(".modal") && document.querySelector(".modal").classList.add("modal-qs");
    ChatUI._qs = {mode:mode||"all", items:[], sel:0, seq:0};
    const inp = $("#qsInput");
    inp.addEventListener("input", ()=>ChatUI.qsSearch(inp.value));
    inp.addEventListener("keydown", e=>{
      const s = ChatUI._qs;
      if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(!s.items.length) return; s.sel = (s.sel+(e.key==="ArrowDown"?1:-1)+s.items.length)%s.items.length; ChatUI.qsDraw(); }
      else if(e.key==="Enter"){ e.preventDefault(); const it = s.items[s.sel]; if(it) ChatUI.qsRun(s.sel); }
      else if(e.key==="Escape"){ e.preventDefault(); UI.closeModal(); }
    });
    ChatUI.qsSearch("");
    setTimeout(()=>inp.focus(), 20);
  },
  qsLocal(q){
    const S = ChatService.S, me = ChatService.me(), nq = normTxt(q), out = [];
    const score = s=>{ const n = normTxt(s); if(!nq) return 1; if(n.startsWith(nq)) return 3; if(n.split(/[\s#-]+/).some(w=>w.startsWith(nq))) return 2; return n.includes(nq)?1:0; };
    const mode = ChatUI._qs.mode;
    if(mode!=="people" && S.ready) ChatService.publicChannels().forEach(c=>{ const sc = score(c.name); if(sc) out.push({g:"Kanali", sc:sc+((S.unread[c.id]||S.mentions[c.id])?.5:0), icon:'<span class="qs-ico">'+(c.kind==="private"?CI.lock:"#")+'</span>', label:c.name, sub:c.topic, run:()=>ChatUI.open(c.id)}); });
    AppState.db.users.filter(u=>u.id!==me.id).forEach(u=>{ const sc = score(u.name); if(sc) out.push({g:"Ljudi", sc, icon:avatarHtml(u,22), label:u.name, sub:(ROLES[u.role]||{}).label+" · "+u.department, run:async()=>{ if(!S.ready){ UI.toast("Poruke nisu uključene — pokrenuti flowcore_v2.3.sql.","warn"); return; } const r = await ChatService.openDm(u.id); if(r.ok) ChatUI.open(r.channel.id); else UI.toast(r.error,"err"); }}); });
    if(mode!=="people"){
      UI.visiblePages().forEach(p=>{ const sc = score(p.title); if(sc) out.push({g:"Stranice", sc:sc-.2, icon:'<span class="qs-ico">'+(ICONS[p.icon]||"")+'</span>', label:p.title, sub:p.group, run:()=>UI.go(p.id)}); });
      if(nq) AppState.db.tasks.filter(t=>!t.isArchived && PermissionService.canUserAccessTask(me,t) && normTxt(t.title).includes(nq)).slice(0,5)
        .forEach(t=>out.push({g:"Taskovi", sc:1.5, icon:'<span class="qs-ico">'+CI.task+'</span>', label:t.title, sub:t.status+" · rok "+fmtDate(t.dueDate), run:()=>UI.openTask(t.id)}));
      if(nq) out.push({g:"Taskovi", sc:0, icon:'<span class="qs-ico">'+CI.search+'</span>', label:"Svi taskovi koji sadrže „"+q+"“", sub:"otvara listu sa filterom", run:()=>{ AppState.filters.q = q; UI.go("alltasks"); }});
    }
    const order = {"Kanali":1,"Ljudi":2,"Taskovi":3,"Stranice":4,"Poruke":5};
    return out.sort((a,b)=>(order[a.g]-order[b.g]) || (b.sc-a.sc)).filter((x,i,arr)=>arr.filter(y=>y.g===x.g).indexOf(x)<(x.g==="Taskovi"?6:7));
  },
  async qsSearch(q){
    const s = ChatUI._qs; if(!s) return;
    const seq = ++s.seq;
    s.items = ChatUI.qsLocal(q); s.sel = 0; ChatUI.qsDraw();
    if(s.mode==="people" || q.trim().length<3 || !ChatService.S.ready) return;
    await new Promise(r=>setTimeout(r,220));
    if(!ChatUI._qs || seq!==ChatUI._qs.seq) return;
    const found = await ChatService.search(q);
    if(!ChatUI._qs || seq!==ChatUI._qs.seq) return;
    found.forEach(m=>{
      const u = TaskService.userById(m.userId), ch = ChatService.S.byId[m.channelId];
      s.items.push({g:"Poruke", sc:0, icon:avatarHtml(u,22), label:m.body.replace(/```|[*_`]/g,"").replace(/\s+/g," ").trim().slice(0,90), sub:(u?u.name:"?")+" · "+ChatService.label(ch)+" · "+fmtDateTime(m.createdAt),
        run:async()=>{ await ChatUI.open(m.channelId, {highlight:m.parentId||m.id}); if(m.parentId) ChatUI.openThread(m.parentId); }});
    });
    ChatUI.qsDraw();
  },
  qsDraw(){
    const s = ChatUI._qs, el = $("#qsList"); if(!s || !el) return;
    if(!s.items.length){ el.innerHTML = '<div class="qs-empty">Nema rezultata. Probaj drugi pojam ili deo imena.</div>'; return; }
    let g = null;
    el.innerHTML = s.items.map((it,i)=>{
      const head = it.g!==g ? '<div class="qs-g">'+it.g+'</div>' : ""; g = it.g;
      return head+'<button class="qs-item'+(i===s.sel?" sel":"")+'" data-qs="'+i+'">'+it.icon+'<span class="qs-t"><b>'+esc(it.label)+'</b>'+(it.sub?'<span>'+esc(it.sub)+'</span>':"")+'</span></button>';
    }).join("");
    const sel = el.querySelector(".qs-item.sel"); if(sel && sel.scrollIntoView) sel.scrollIntoView({block:"nearest"});
  },
  qsRun(i){ const it = ChatUI._qs && ChatUI._qs.items[i]; if(!it) return; ChatUI._qs = null; UI.closeModal(); it.run(); },

  /* ---------------- mobilni spisak razgovora ---------------- */
  renderList(){
    AppState.page = "chatlist";
    document.querySelector(".main").classList.remove("chat-mode");
    document.querySelectorAll(".nav-item,.bottom-nav button").forEach(b=>b.classList.toggle("active", b.dataset.page==="chatlist"));
    $("#topbarTitle").textContent = "Poruke";
    $("#pageContent").innerHTML = '<div class="chat-list-m"><button class="btn btn-block" onclick="ChatUI.switcher()">'+CI.search+' Pretraži</button><div id="chatNav"></div></div>';
    ChatUI.renderNav();
  },

  /* ---------------- desktop obaveštenja ---------------- */
  desktopNotify(m){
    if(typeof Notification==="undefined" || Notification.permission!=="granted") return;
    const u = TaskService.userById(m.userId), ch = ChatService.S.byId[m.channelId];
    try{
      const n = new Notification((u?u.name:"FlowCore")+(ch.kind==="dm"?"":" u #"+ch.name), {body:(m.body||"podelio/la task").slice(0,140), tag:"fc-"+m.channelId});
      n.onclick = ()=>{ window.focus(); ChatUI.open(m.channelId, {highlight:m.parentId||m.id}); n.close(); };
    }catch(e){}
  },

  /* ---------------- delegirani događaji ---------------- */
  onClick(e){
    const qs = e.target.closest("[data-qs]");
    if(qs){ ChatUI.qsRun(+qs.dataset.qs); return; }
    const a = e.target.closest("[data-act]");
    if(!a){ if(!e.target.closest(".react-pop")) ChatUI.closePops(); return; }
    const id = a.dataset.id, act = a.dataset.act;
    if(act!=="react-pick") ChatUI.closePops();
    switch(act){
      case "send": ChatUI.submit(a.dataset.input); break;
      case "react": ChatUI.react(id, a.dataset.emoji); break;
      case "react-pick": e.stopPropagation(); ChatUI.reactPicker(a, id); break;
      case "thread": ChatUI.openThread(id); break;
      case "thread-close": ChatUI.closeThread(); break;
      case "mk-task": ChatUI.taskFromMessage(id); break;
      case "edit": ChatUI.startEdit(id); break;
      case "edit-save": ChatUI.saveEdit(id); break;
      case "edit-cancel": ChatUI.cancelEdit(); break;
      case "del": ChatUI.askDelete(id); break;
      case "retry": ChatService.retry(id); ChatUI.refresh(ChatService.S.active); break;
      case "mention": ChatUI.pickMention(a.dataset.uid); break;
      case "open-task": UI.openTask(a.dataset.task); break;
      case "jump-bottom": { const sc = $("#msgScroll"); sc.scrollTop = sc.scrollHeight; a.classList.add("hidden"); break; }
      case "notif-on": if(typeof Notification!=="undefined") Notification.requestPermission().then(()=>{ const b = $("#notifBanner"); if(b) b.remove(); }); break;
      case "notif-later": { const b = $("#notifBanner"); if(b) b.remove(); break; }
    }
  }
};

/* Kuke: task događaji u kanalu odeljenja (posle definicije TaskService) */
(function(){
  const _create = TaskService.createTask;
  TaskService.createTask = function(data){
    const r = _create.apply(TaskService, arguments);
    if(r && r.ok) try{ ChatService.taskEvent("created", r.task); }catch(e){ console.warn("[Chat] taskEvent:", e); }
    return r;
  };
  const _update = TaskService.updateTask;
  TaskService.updateTask = function(id, upd){
    const before = (TaskService.getTask(id)||{}).status;
    const r = _update.apply(TaskService, arguments);
    if(r && r.ok && upd && upd.status==="Završeno" && before!=="Završeno") try{ ChatService.taskEvent("done", TaskService.getTask(id)); }catch(e){}
    return r;
  };
})();

});

const UI = {
  /* ---------- toast & modal ---------- */
  toast(msg, type, durationMs){
    const el = document.createElement("div");
    el.className = "toast "+(type||"");
    el.textContent = msg;
    $("#toastWrap").appendChild(el);
    setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .3s"; setTimeout(()=>el.remove(),320); }, durationMs||3200);
  },
  modal(html, opts){
    const closable = !(opts && opts.static);
    $("#modalWrap").innerHTML = '<div class="modal-overlay"'+(closable?' onclick="if(event.target===this)UI.closeModal()"':'')+'><div class="modal">'+html+'</div></div>';
  },
  closeModal(){ $("#modalWrap").innerHTML=""; if(UI._refreshAfterModal){ UI._refreshAfterModal=false; UI.go(AppState.page); } },
  confirm(text, onYes){
    UI.modal('<header><h2>Potvrda</h2><button class="btn btn-sm" onclick="UI.closeModal()">✕</button></header>'+
      '<div class="modal-body"><p>'+esc(text)+'</p></div>'+
      '<footer><button class="btn" onclick="UI.closeModal()">Otkaži</button><button class="btn btn-danger" id="confirmYes">Potvrdi</button></footer>');
    $("#confirmYes").onclick = ()=>{ UI.closeModal(); onYes(); };
  },

  /* ---------- login ---------- */
  renderLogin(){
    $("#loginScreen").classList.remove("hidden");
    $("#appShell").classList.add("hidden");
  },
  async submitLogin(){
    const btn = $("#loginBtn"), errEl = $("#loginError");
    errEl.classList.add("hidden");
    btn.disabled = true; btn.textContent = "Prijavljivanje...";
    try{
      const r = await AuthService.loginUser($("#loginEmail").value, $("#loginPass").value);
      if(!r.ok){ errEl.textContent = r.error; errEl.classList.remove("hidden"); return; }
      btn.textContent = "Učitavanje podataka...";
      await DataService.loadData();
      $("#loginPass").value = "";
      AuditService.log("Prijava", "user:"+r.user.id, r.user.name+" se prijavio/la");
      NotificationService.checkLateTasksFor(r.user);
      UI.enterApp();
    }catch(e){
      console.error(e);
      errEl.textContent = "Greška pri povezivanju sa bazom. Proveri internet konekciju.";
      errEl.classList.remove("hidden");
    }finally{
      btn.disabled = false; btn.textContent = "Prijavi se";
    }
  },
  logout(){ Personal.stop(); ThemeService.stop(); ChatService.stop(); PresenceService.stop(); RealtimeService.stop(); if(UI._autoTimer){ clearInterval(UI._autoTimer); UI._autoTimer=null; } AuthService.logoutUser(); UI.closeModal(); UI.renderLogin(); },

  enterApp(){
    $("#loginScreen").classList.add("hidden");
    $("#appShell").classList.remove("hidden");
    const u = AppState.currentUser;
    $("#meName").textContent = u.name;
    $("#meRole").textContent = ROLES[u.role].label;
    const av = $("#meAvatar"); av.textContent = initials(u.name); av.style.background = u.color;
    UI.renderNav();
    UI.refreshNotifBadge();
    /* v2.0: prisustvo, realtime i automatske provere (rokovi + podsetnici) */
    PresenceService.start();
    ChatService.start();
    ThemeService.start();
    Personal.start();
    RealtimeService.start();
    ReminderService.checkAuto();
    NotificationService.checkLateTasksFor(u);
    ScoreService.checkAutoOverdue();
    ScoreService.checkAutoNoLogin();
    UI.refreshNotifBadge();
    if(!UI._autoTimer) UI._autoTimer = setInterval(()=>{
      if(AppState.currentUser && document.visibilityState==="visible"){
        ReminderService.checkAuto();
        NotificationService.checkLateTasksFor(AppState.currentUser);
        ScoreService.checkAutoOverdue();
        UI.refreshNotifBadge();
      }
    }, 10*60*1000);
    UI.go("dashboard");
    UI.toast("Dobrodošli, "+u.name.split(" ")[0]+"!", "ok");
  },

  /* ---------- navigacija ---------- */
  visiblePages(){ return PAGES.filter(p=>p.show(AppState.currentUser)); },
  /* v2.3: sidebar sa sekcijama na sklapanje (stanje se pamti u pregledaču) */
  _navCollapsed(){ try{ return JSON.parse(localStorage.getItem("fc.nav.collapsed")||'{"analitika":false,"sistem":true}'); }catch(e){ return {}; } },
  navSection(key, title, inner, addBtn){
    const c = UI._navCollapsed()[key];
    return '<div class="nav-sec'+(c?" collapsed":"")+'" data-sec="'+key+'"><div class="nav-sec-h">'+
      '<button class="nav-sec-t" aria-expanded="'+(!c)+'" onclick="UI.toggleSec(\''+key+'\')">'+CI.caret+esc(title)+'</button>'+(addBtn||"")+'</div>'+
      '<div class="nav-sec-b">'+inner+'</div></div>';
  },
  toggleSec(key){
    const st = UI._navCollapsed(); st[key] = !st[key];
    try{ localStorage.setItem("fc.nav.collapsed", JSON.stringify(st)); }catch(e){}
    const el = document.querySelector('.nav-sec[data-sec="'+key+'"]');
    if(el){ el.classList.toggle("collapsed", !!st[key]); const b = el.querySelector(".nav-sec-t"); if(b) b.setAttribute("aria-expanded", String(!st[key])); }
  },
  renderNav(){
    const pages = UI.visiblePages();
    const item = p=>'<button class="nav-item" data-page="'+p.id+'" onclick="UI.go(\''+p.id+'\')">'+ICONS[p.icon]+'<span class="ch-name">'+esc(p.title)+'</span></button>';
    const grp = g=>pages.filter(p=>p.group===g).map(item).join("");
    const isMac = /Mac|iPhone|iPad/.test(navigator.platform||"");
    $("#sidebarNav").innerHTML =
      '<button class="side-search" onclick="ChatUI.switcher()">'+CI.search+'<span>Pretraga</span><kbd>'+(isMac?"⌘":"Ctrl")+' K</kbd></button>'+
      UI.navSection("pregled","Pregled", grp("Pregled"))+
      '<div id="chatNav"></div>'+
      (grp("Analitika")?UI.navSection("analitika","Analitika", grp("Analitika")):"")+
      UI.navSection("sistem","Sistem", grp("Sistem"));
    const tk = document.querySelector(".qs-trigger kbd"); if(tk) tk.textContent = (isMac?"⌘":"Ctrl")+" K";
    ChatUI.renderNav();
    const bottom = ["dashboard","mytasks","personal"].filter(id=>pages.some(p=>p.id===id));
    $("#bottomNav").innerHTML = bottom.map(id=>{
      const p = PAGES.find(x=>x.id===id);
      return '<button data-page="'+id+'" onclick="UI.go(\''+id+'\')">'+ICONS[p.icon]+({personal:"Lično",mytasks:"Moji"}[id]||p.title.split(" ")[0])+'</button>';
    }).join("") +
      '<button data-page="chatlist" onclick="ChatUI.renderList()">'+CI.reply+'Poruke<span class="bn-badge hidden">0</span></button>'+
      '<button onclick="UI.openTaskForm()" style="color:var(--blue)">'+ICONS.plus+'Novi</button>';
    ChatService.updateTitle();
  },

  go(page){
    if(page!=="settings" && UI._themeDraft){
      if(UI._themeDirty) ThemeService.apply(ThemeService.current||ThemeService.DEFAULT, {preview:true});
      UI._themeDraft = null; UI._themeDirty = false;
    }
    if(page==="chat"){ ChatUI.open(ChatService.S.active); return; }
    if(page==="chatlist"){ ChatUI.renderList(); return; }
    ChatUI.saveDraft(); ChatUI.closePops();
    document.querySelector(".main").classList.remove("chat-mode");
    { const ha = $("#chHeadAct"); if(ha) ha.remove(); }
    if(!UI.visiblePages().some(p=>p.id===page)) page = "dashboard";
    AppState.page = page;
    AppState.charts.forEach(c=>{ try{c.destroy();}catch(e){} }); AppState.charts = [];
    document.querySelectorAll(".nav-item,.bottom-nav button").forEach(b=>b.classList.toggle("active", b.dataset.page===page));

  /* ---------- charts (Chart.js 4 + CSS fallback) ---------- */
  chart(canvasId, type, data, opts){
    const el = document.getElementById(canvasId);
    if(!el) return;
    opts = opts||{};
    const total = data.reduce((s,d)=>s+d.value,0);
    if(!data.length || total===0){
      /* v2.3 ispravka: roditelj se uzima PRE zamene sadržaja — ranije je posle
         innerHTML platno bilo odvojeno od DOM-a, parentElement je bio null i
         renderDashboard je pucao (skor tabla i prisustvo se ne bi učitali). */
      const box = el.parentElement;
      if(!box) return;
      box.innerHTML = '<div class="empty" style="padding:30px 10px"><b>Nema podataka</b>'+(opts.emptyText||"Podaci će se pojaviti kada bude taskova.")+'</div>';
      box.style.height = "auto";
      return;
    }
    if(typeof Chart === "undefined"){ // fallback: CSS barovi (bez CDN-a / offline)
      const wrap = el.parentElement;
      const max = Math.max(1, ...data.map(d=>d.value));
      wrap.innerHTML = data.map((d,i)=>'<div class="css-bar-row"><span class="lbl">'+esc(d.label)+'</span><span class="css-bar-track"><span class="css-bar-fill" style="width:'+Math.round(d.value/max*100)+'%;background:'+((opts.colors&&opts.colors[i%opts.colors.length])||"var(--blue)")+'"></span></span><span class="val">'+d.value+'</span></div>').join("");
      wrap.style.height = "auto";
      return;
    }
    const palette = opts.colors||["#2563eb","#7c3aed","#10b981","#f59e0b","#ef4444","#0e1b33","#0369a1","#9d174d"];
    const isDonut = type==="doughnut", isLine = type==="line", isHBar = type==="hbar";
    const chartType = isHBar ? "bar" : type;
    let bg = isLine ? "var(--primary-ring)" : palette;
    if(isLine && el.getContext){
      const ctx = el.getContext("2d");
      const g = ctx.createLinearGradient(0,0,0,el.parentElement.clientHeight||240);
      g.addColorStop(0,"rgba(37,99,235,.28)"); g.addColorStop(1,"rgba(37,99,235,.02)");
      bg = g;
    }
    const centerText = isDonut ? [{
      id:"centerText",
      afterDraw(c){
        const {ctx} = c, meta = c.getDatasetMeta(0).data[0];
        if(!meta) return;
        ctx.save();
        ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.font="800 24px "+getComputedStyle(document.body).fontFamily;
        ctx.fillStyle="#1e293b";
        ctx.fillText(String(total), meta.x, meta.y-8);
        ctx.font="600 11px "+getComputedStyle(document.body).fontFamily;
        ctx.fillStyle="#64748b";
        ctx.fillText(opts.centerLabel||"ukupno", meta.x, meta.y+13);
        ctx.restore();
      }
    }] : [];
    const cfg = {
      type: chartType,
      data:{ labels:data.map(d=>d.label),
        datasets:[{ label:opts.label||"Taskovi", data:data.map(d=>d.value),
          backgroundColor: bg,
          borderColor: isLine ? "#2563eb" : (isDonut ? "#ffffff" : palette),
          borderWidth: isLine?2.5:(isDonut?2:0),
          hoverOffset: isDonut?6:undefined,
          pointRadius: isLine?3:undefined, pointBackgroundColor: isLine?"#2563eb":undefined,
          fill:isLine, tension:.35, borderRadius:isDonut?4:7,
          maxBarThickness:34 }]},
      options:{ responsive:true, maintainAspectRatio:false,
        indexAxis: isHBar ? "y" : "x",
        layout:{padding:{top:4}},
        cutout: isDonut ? "64%" : undefined,
        plugins:{
          legend:{ display:isDonut, position:"bottom", labels:{boxWidth:10, boxHeight:10, usePointStyle:true, pointStyle:"circle", padding:14, font:{size:11.5}} },
          tooltip:{ backgroundColor:"#0e1b33", padding:10, cornerRadius:8, titleFont:{size:12}, bodyFont:{size:12},
            callbacks: isDonut ? { label:c=>" "+c.label+": "+c.parsed+" ("+Math.round(c.parsed/total*100)+"%)" } : {} }
        },
        scales: isDonut ? {} : {
          y:{ beginAtZero:true, ticks:{precision:0, font:{size:11}, color:"#64748b"}, grid:{color:isHBar?"transparent":"#eef1f6"}, border:{display:false} },
          x:{ beginAtZero:true, ticks:{precision:0, font:{size:11}, color:"#64748b"}, grid:{color:isHBar?"#eef1f6":"transparent"}, border:{display:false} }
        } },
      plugins: centerText
    };
    AppState.charts.push(new Chart(el, cfg));
  },

  /* ================= v2.1: SKOR (znakovi 👍/👎) ================= */
  scoreCardShell(){
    const u = AppState.currentUser;
    const all = PermissionService.canUserViewAllScores(u);
    const r = ScoreService.monthRange();
    if(!UI._scorePeriod) UI._scorePeriod = {from:dateInput(r.from.toISOString()), to:dateInput(r.to.toISOString()), preset:"cur"};
    const P = UI._scorePeriod;
    const picker = all ?
      '<div class="score-head">'+
        '<div class="score-presets">'+
          '<button class="chip-p'+(P.preset==="cur"?" on":"")+'" onclick="UI.scorePreset(\'cur\')">Tekući mesec</button>'+
          '<button class="chip-p'+(P.preset==="prev"?" on":"")+'" onclick="UI.scorePreset(\'prev\')">Prošli mesec</button>'+
          '<button class="chip-p'+(P.preset==="y"?" on":"")+'" onclick="UI.scorePreset(\'y\')">Cela godina</button>'+
        '</div>'+
        '<span style="flex:1"></span>'+
        '<input type="date" id="scFrom" value="'+P.from+'" onchange="UI.scorePreset(\'custom\')">'+
        '<span class="small muted">—</span>'+
        '<input type="date" id="scTo" value="'+P.to+'" onchange="UI.scorePreset(\'custom\')">'+
        '<button class="btn btn-sm btn-primary" onclick="UI.loadScores()">Prikaži</button>'+
      '</div>' : "";
    return '<div class="card"><h3 style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">'+
      (all?'🏆 Skor tabla — znakovi':'🏆 Moj skor — '+ScoreService.monthLabel())+
      (all?'<span class="small muted" style="font-weight:400">(vidi samo menadžment)</span>':'')+
      '<span style="flex:1"></span>'+
      '<button class="btn btn-sm" onclick="UI.openGiveMark()">👍 / 👎 Daj znak</button></h3>'+
      picker+
      '<div id="scoreBody"><div class="small muted">Učitavanje...</div></div></div>';
  },
  scorePreset(kind){
    const P = UI._scorePeriod;
    if(kind==="cur"){ const r=ScoreService.monthRange(); P.from=dateInput(r.from.toISOString()); P.to=dateInput(r.to.toISOString()); }
    else if(kind==="prev"){ const r=ScoreService.prevMonthRange(); P.from=dateInput(r.from.toISOString()); P.to=dateInput(r.to.toISOString()); }
    else if(kind==="y"){ const y=new Date().getFullYear(); P.from=y+"-01-01"; P.to=y+"-12-31"; }
    else { P.from = $("#scFrom").value || P.from; P.to = $("#scTo").value || P.to; }
    P.preset = kind;
    if(kind!=="custom" && $("#scFrom")){ $("#scFrom").value=P.from; $("#scTo").value=P.to; }
    document.querySelectorAll(".score-presets .chip-p").forEach((b,i)=>b.classList.toggle("on", ["cur","prev","y"][i]===kind));
    UI.loadScores();
  },
  async loadScores(){
    const el = $("#scoreBody"); if(!el) return;
    const u = AppState.currentUser, all = PermissionService.canUserViewAllScores(u);
    const P = UI._scorePeriod;
    if(P.from > P.to){ el.innerHTML = '<div class="login-error">Početni datum mora biti pre završnog.</div>'; return; }
    el.innerHTML = '<div class="small muted">Učitavanje...</div>';
    try{
      const from = new Date(P.from+"T00:00:00").toISOString();
      const to = new Date(P.to+"T23:59:59").toISOString();
      const marks = await StorageService.fetchScoreMarks(from, to);
      if(!$("#scoreBody")) return;
      const agg = ScoreService.aggregate(marks);
      $("#scoreBody").innerHTML = all ? UI.scoreBoardHtml(agg, P) : UI.myScoreHtml(agg[u.id]);
    }catch(e){
      console.warn("[Skor]", e);
      if($("#scoreBody")) $("#scoreBody").innerHTML = '<div class="small muted">Skor nije dostupan — pokreni flowcore_v2.1.sql (tabela score_marks).</div>';
    }
  },
  scoreBoardHtml(agg, P){
    const list = AppState.db.users.map(x=>{
      const b = agg[x.id] || {plus:0, minus:0, net:0, marks:[]};
      return {user:x, ...b};
    }).sort((a,b)=> (b.net-a.net) || (b.plus-a.plus) || a.user.name.localeCompare(b.user.name,"sr"));
    const maxAbs = Math.max(1, ...list.map(r=>Math.max(r.plus, r.minus)));
    const tot = list.reduce((a,r)=>({p:a.p+r.plus, m:a.m+r.minus}), {p:0,m:0});
    const rows = list.map((r,i)=>{
      const netCls = r.net>0?"pos":r.net<0?"neg":"zero";
      const medal = i===0&&r.net>0 ? "🥇" : i===1&&r.net>0 ? "🥈" : i===2&&r.net>0 ? "🥉" : (i+1);
      return '<div class="sc-row" onclick="UI.openUserMarks(\''+r.user.id+'\')" title="Klik za detalje i razloge">'+
        '<span class="sc-rank'+(i<3&&r.net>0?" top":"")+'">'+medal+'</span>'+
        avatarHtml(r.user,34)+
        '<span class="sc-name"><b>'+esc(r.user.name)+'</b>'+
          '<span class="small muted">'+esc(r.user.department)+'</span>'+
          '<span class="sc-bar"><i class="p" style="width:'+(r.plus/maxAbs*50)+'%"></i><i class="m" style="width:'+(r.minus/maxAbs*50)+'%"></i></span></span>'+
        '<span class="sc-nums"><span class="sc-pill p">👍 '+r.plus+'</span><span class="sc-pill m">👎 '+r.minus+'</span>'+
          '<span class="sc-net '+netCls+'">'+(r.net>0?"+":"")+r.net+'</span></span></div>';
    }).join("");
    return '<div class="small muted" style="margin-bottom:6px">Period: <b>'+P.from.split("-").reverse().join(".")+'. — '+P.to.split("-").reverse().join(".")+'.</b> · ukupno 👍 '+tot.p+' / 👎 '+tot.m+' · klik na red otvara razloge</div>'+rows;
  },
  myScoreHtml(b){
    b = b || {plus:0, minus:0, net:0, marks:[]};
    const netCls = b.net>0?"pos":b.net<0?"neg":"zero";
    return '<div class="myscore">'+
        '<span class="sc-net big '+netCls+'">'+(b.net>0?"+":"")+b.net+'</span>'+
        '<span><span class="sc-pill p">👍 '+b.plus+'</span> <span class="sc-pill m">👎 '+b.minus+'</span>'+
        '<div class="small muted" style="margin-top:5px">Vaš skor za '+ScoreService.monthLabel()+'. Vidite samo svoj skor.</div></span>'+
      '</div>'+
      '<h3 style="margin:13px 0 4px;font-size:13px">Razlozi ('+b.marks.length+')</h3>'+
      UI.marksListHtml(b.marks, false);
  },
  marksListHtml(marks, showTarget, canAnnul){
    if(!marks.length) return '<div class="small muted">Nema znakova u izabranom periodu.</div>';
    return marks.map(m=>{
      const author = m.createdBy ? TaskService.userById(m.createdBy) : null;
      const target = showTarget ? TaskService.userById(m.userId) : null;
      const annuller = m.annulledBy ? TaskService.userById(m.annulledBy) : null;
      const off = !!m.annulledAt;
      return '<div class="mark-row'+(off?" annulled":"")+'"><span class="mark-ico">'+(m.value>0?"👍":"👎")+'</span>'+
        '<span><span class="mark-reason">'+esc(m.reason)+'</span>'+
        '<span class="mark-meta">'+(showTarget&&target?esc(target.name)+' · ':"")+
          ScoreService.kindLabel(m.kind)+(author?' · '+esc(author.name):' · automatski')+
          (m.taskId?' · <a href="javascript:void(0)" onclick="UI.closeModal();UI.openTask(\''+m.taskId+'\')">otvori task</a>':"")+
        '</span>'+
        (off?'<span class="annul-note">Ukinuto: '+esc(m.annulReason)+(annuller?' — '+esc(annuller.name.split(" ")[0]):"")+' · ne računa se u skor</span>':"")+
        '</span>'+
        '<span class="mark-when">'+fmtDateTime(m.createdAt)+
          (canAnnul&&!off&&m.value<0?'<br><button class="btn btn-sm" style="margin-top:5px;color:var(--blue)" onclick="UI.askAnnul(\''+m.id+'\')">Ukini</button>':"")+
        '</span></div>';
    }).join("");
  },
  /* v2.2: ukidanje negativnog znaka (godišnji, bolovanje, praznik, greška) */
  askAnnul(markId){
    UI.modal('<header><h2>Ukini znak</h2><button class="btn btn-sm" onclick="UI.closeModal()">✕</button></header>'+

  submitAnnul(markId){

  async openUserMarks(userId){
    const t = TaskService.userById(userId); if(!t) return;
    const P = UI._scorePeriod;
    UI.modal('<header><h2>Znakovi — '+esc(t.name)+'</h2><button class="btn btn-sm" onclick="UI.closeModal()">✕</button></header>'+
      '<div class="modal-body" id="umBody"><div class="small muted">Učitavanje...</div></div>'+
      '<footer><button class="btn" onclick="UI.closeModal()">Zatvori</button></footer>');
    try{
      const marks = await StorageService.fetchScoreMarks(new Date(P.from+"T00:00:00").toISOString(), new Date(P.to+"T23:59:59").toISOString());
      const mine = marks.filter(m=>m.userId===userId);
      const b = ScoreService.aggregate(mine)[userId] || {plus:0,minus:0,net:0,marks:[]};
      if(!$("#umBody")) return;
      $("#umBody").innerHTML = '<div class="myscore" style="margin-bottom:12px">'+avatarHtml(t,40)+
        '<span class="sc-net big '+(b.net>0?"pos":b.net<0?"neg":"zero")+'">'+(b.net>0?"+":"")+b.net+'</span>'+
        '<span><span class="sc-pill p">👍 '+b.plus+'</span> <span class="sc-pill m">👎 '+b.minus+'</span>'+
        '<div class="small muted" style="margin-top:4px">'+esc(t.department)+' · period '+P.from.split("-").reverse().join(".")+'. — '+P.to.split("-").reverse().join(".")+'.</div></span></div>'+
        UI.marksListHtml(mine.sort((a,c)=>a.createdAt<c.createdAt?1:-1), false, PermissionService.canUserAnnulMark(AppState.currentUser));
