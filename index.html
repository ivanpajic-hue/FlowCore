<script>
"use strict";
/* =====================================================================
   FLOWCORE — arhitektura u slojevima:
   AppState            — centralno stanje aplikacije u memoriji
   StorageService      — localStorage sloj (kasnije: Supabase klijent)
   DataService         — učitavanje/čuvanje + seed podaci
   AuthService         — login/logout (kasnije: Supabase Auth)
   PermissionService   — role i dozvole (canUserAccessTask itd.)
   TaskService         — CRUD nad taskovima, statusi, komentari, checklist
   ReportService       — dashboard, efikasnost, menadžment, CSV/print
   NotificationService — interne notifikacije
   AuditService        — audit log
   UI                  — router, renderovanje ekrana, modali, toast

   >>> SUPABASE (v2.0 — AKTIVNO): aplikacija radi nad online bazom.
   SUPABASE_URL i SUPABASE_ANON_KEY se unose ispod (anon key je javan
   po dizajnu; service_role ključ NIKAD ne sme u ovaj fajl):
   ===================================================================== */
const SUPABASE_URL = "https://xkswxxlifmyfvwkgnjps.supabase.co";      // <-- ovde unesi Supabase URL (produkcija)
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhrc3d4eGxpZm15ZnZ3a2duanBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5ODEzNjksImV4cCI6MjA5ODU1NzM2OX0.yNaPyrJno3TUakp4Da_qER04H4nV1gXNckAnFDKXURU"; // <-- ovde unesi Supabase anon key (produkcija)
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
/* ---------------- KONSTANTE ---------------- */
const STATUSES = ["Novo","Dodeljeno","U toku","Čeka odgovor","Blokirano","Završeno","Otkazano","Arhivirano"];
const KANBAN_STATUSES = ["Novo","Dodeljeno","U toku","Čeka odgovor","Blokirano","Završeno"];
const OPEN_STATUSES = ["Novo","Dodeljeno","U toku","Čeka odgovor","Blokirano"];
const PRIORITIES = ["Nizak","Normalan","Visok","Kritičan"];
/* v2.1 — parametri sistema znakova. Menjaju se samo ovde. */
const SCORE = {
  FROM_DATE: "2026-09-07",      /* znakovi se NE računaju za dane pre ovog datuma */
  /* Radno vreme: ako se korisnik NIJEDNOM ne prijavi u ovom intervalu
     radnim danom, dobija −1. Dan se ocenjuje tek kada se završi (posle
     END_HOUR), da se nikome ne upiše kazna dok radni dan još traje. */
  WORK_START_HOUR: 8, WORK_END_HOUR: 16,
  /* Neradni dani (praznici, kolektivni odmor) — OBAVEZNO popuniti pre
     upotrebe, inače praznik proizvodi negativne znakove svima.
     Format: "YYYY-MM-DD". Primer: ["2026-12-25","2027-01-01"] */
  HOLIDAYS: [],
  OVERDUE_HOURS: 48,            /* task neizvršen 48h posle roka = −1 (jednom po tasku) */
  EXEMPT_STATUSES: ["Blokirano","Čeka odgovor"], /* ne kažnjavaju se — zavise od trećih lica */
  REASON_MIN: 10,               /* minimalna dužina razloga za ručni znak */
  MAX_PER_DAY: 3,               /* max ručnih znakova koje jedan korisnik daje dnevno */
  LOOKBACK_DAYS: 7              /* koliko dana unazad se traže propuštene automatske provere */
};
const DEPARTMENTS = ["Dispečing","Finansije","Menadžment","Administracija","Vozni park","Dokumentacija","Komercijala","Ostalo"];
const CATEGORIES = ["Tura","Vozač","Klijent","Faktura","Naplata","Vozilo","Dokumentacija","Interno","Hitno","Ostalo"];
const ROLES = {
  superadmin:{label:"Super Admin"}, menadzment:{label:"Menadžment"},
  teamlead:{label:"Team Lead"}, dispecer:{label:"Dispečer"},
  finansije:{label:"Finansije"}, voznipark:{label:"Vozni park"}
};
const STATUS_CLASS = {"Novo":"novo","Dodeljeno":"dodeljeno","U toku":"utoku","Čeka odgovor":"ceka","Blokirano":"blokirano","Završeno":"zavrseno","Otkazano":"otkazano","Arhivirano":"arhivirano"};
const AVATAR_COLORS = ["#2563eb","#7c3aed","#0e9488","#d97706","#dc2626","#0369a1","#9d174d","#4d7c0f"];
const FIN_DEPTS = ["Finansije"];
const FIN_CATS = ["Faktura","Naplata"];

/* ---------------- HELPERS ---------------- */
const $ = s => document.querySelector(s);
const uid = () => (typeof crypto!=="undefined" && crypto.randomUUID) ? crypto.randomUUID()
  : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==="x"?r:(r&3|8)).toString(16);});
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function pad(n){ return String(n).padStart(2,"0"); }
function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso); return pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear()+"."; }
function fmtDateTime(iso){ if(!iso) return "—"; const d=new Date(iso); return fmtDate(iso)+" "+pad(d.getHours())+":"+pad(d.getMinutes()); }
function dateInput(iso){ if(!iso) return ""; const d=new Date(iso); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString(); }
function inDays(n,h){ const d=new Date(); d.setDate(d.getDate()+n); d.setHours(h==null?17:h,0,0,0); return d.toISOString(); }
function hoursBetween(a,b){ return (new Date(b)-new Date(a))/36e5; }
function initials(name){ return name.split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function fmtTime(d){ if(!d) return "\u2014"; const x=new Date(d); return pad(x.getHours())+":"+pad(x.getMinutes()); }
function fmtDur(ms){ if(!ms||ms<0) ms=0; const h=Math.floor(ms/36e5), m=Math.round(ms%36e5/6e4); return (h?h+" h ":"")+m+" min"; }
function fmtHours(h){ if(h==null||isNaN(h)) return "—"; if(h<1) return Math.round(h*60)+" min"; if(h<48) return h.toFixed(1)+" h"; return (h/24).toFixed(1)+" d"; }
function avatarHtml(user,size){ if(!user) return '<span class="avatar" style="background:#94a3b8;width:'+(size||28)+'px;height:'+(size||28)+'px">—</span>';
  return '<span class="avatar" title="'+esc(user.name)+'" style="background:'+user.color+';width:'+(size||28)+'px;height:'+(size||28)+'px;font-size:'+((size||28)*0.38)+'px">'+esc(initials(user.name))+'</span>'; }

/* ---------------- APP STATE ---------------- */
const AppState = {
  currentUser:null,
  db:null, // {users, tasks, notifications, auditLogs, meta}
  page:"dashboard",
  filters:{ q:"", status:"", priority:"", department:"", assignedTo:"", category:"", quick:"" , sortBy:"dueDate", sortDir:1},
  calMonth:null, calSelected:null,
  charts:[]
};

/* =====================================================================
   STORAGE SERVICE — Supabase sloj perzistencije (v2.0).
   Čitanje: sve tabele odjednom -> AppState.db (isti oblik kao ranije,
   camelCase + nazivi odeljenja/kategorija umesto ID-jeva).
   Upis: ciljani upiti po entitetu (saveTask, saveNotification, saveAudit).
   Upisi su optimistični: UI se odmah osvežava, greška iz baze se
   prijavljuje toast porukom i u konzoli.
   ===================================================================== */
const StorageService = {
  deptById:{}, deptByName:{}, catById:{}, catByName:{},

  _err(where, error){
    console.error("[Supabase] "+where+":", error);
    const detail = error ? [error.message, error.details, error.hint, error.code ? "kod: "+error.code : ""]
      .filter(Boolean).join(" · ") : "";
    if(typeof UI!=="undefined" && UI.toast)
      UI.toast("Greška pri čuvanju u bazi ("+where+")"+(detail ? ": "+detail : ". Osveži stranicu i pokušaj ponovo."), "err", 9000);
  },

  /* Obezbedi da sva odeljenja/kategorije iz aplikacije postoje u bazi,
     pa učitaj mape id<->naziv (aplikacija interno radi sa nazivima). */
  async ensureLookups(){
    const u1 = await sb.from("departments").upsert(DEPARTMENTS.map(name=>({name})), {onConflict:"name", ignoreDuplicates:true});
    if(u1.error) console.warn("[Supabase] departments upsert:", u1.error);
    const u2 = await sb.from("categories").upsert(CATEGORIES.map(name=>({name})), {onConflict:"name", ignoreDuplicates:true});
    if(u2.error) console.warn("[Supabase] categories upsert:", u2.error);
    const [d,c] = await Promise.all([sb.from("departments").select("*"), sb.from("categories").select("*")]);
    if(d.error||c.error) throw (d.error||c.error);
    this.deptById={}; this.deptByName={}; this.catById={}; this.catByName={};
    d.data.forEach(x=>{ this.deptById[x.id]=x.name; this.deptByName[x.name]=x.id; });
    c.data.forEach(x=>{ this.catById[x.id]=x.name; this.catByName[x.name]=x.id; });
  },

  mapUser(r){
    return {id:r.id, name:r.name, email:r.email, role:r.role,
      department:this.deptById[r.department_id]||"", color:r.color||AVATAR_COLORS[0],
      createdAt:r.created_at||null};
  },

  mapTask(r){
    return {
      id:r.id, title:r.title, description:r.description||"",
      department:this.deptById[r.department_id]||"", category:this.catById[r.category_id]||"",
      status:r.status, priority:r.priority,
      createdBy:r.created_by, assignedTo:r.assigned_to,
      participants:(r.task_participants||[]).map(p=>p.user_id),
      createdAt:r.created_at, updatedAt:r.updated_at, dueDate:r.due_date,
      startedAt:r.started_at, firstResponseAt:r.first_response_at, completedAt:r.completed_at,
      estimatedMinutes:r.estimated_minutes, actualMinutes:r.actual_minutes,
      tags:r.tags||[], blockedReason:r.blocked_reason||"", waitingFor:r.waiting_for||"",
      isArchived:!!r.is_archived,
      comments:(r.task_comments||[]).map(c=>({id:c.id, userId:c.user_id, text:c.text, internal:!!c.internal, createdAt:c.created_at}))
        .sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt)),
      checklist:(r.task_checklist||[]).slice().sort((a,b)=>(a.position||0)-(b.position||0))
        .map(k=>({id:k.id, label:k.label, done:!!k.done, required:!!k.required})),
      attachments:(r.task_attachments||[]).map(a=>({id:a.id, name:a.name, storagePath:a.storage_path||null, addedBy:a.added_by, addedAt:a.added_at}))
    };
  },

  async read(){
    await this.ensureLookups();
    const [users, tasks, notifs, audit] = await Promise.all([
      sb.from("users").select("*").order("name"),
      sb.from("tasks").select("*, task_comments(*), task_checklist(*), task_attachments(*), task_participants(user_id)").order("created_at",{ascending:false}),
      sb.from("notifications").select("*").order("created_at",{ascending:false}).limit(300),
      sb.from("audit_logs").select("*").order("at",{ascending:false}).limit(500)
    ]);
    const bad = users.error||tasks.error||notifs.error||audit.error;
    if(bad) throw bad;
    /* task_reminders je v2.0 tabela — ako SQL još nije pokrenut, aplikacija radi bez evidencije podsetnika */
    let reminders = [];
    const rem = await sb.from("task_reminders").select("*").order("sent_at",{ascending:false}).limit(1000);
    if(rem.error) console.warn("[Supabase] task_reminders (v2.0 SQL nije pokrenut?):", rem.error);
    else reminders = rem.data.map(r=>({id:r.id, taskId:r.task_id, userId:r.user_id, sentBy:r.sent_by, kind:r.kind, sentAt:r.sent_at}));
    /* v2.1: score_marks — poslednjih 800 redova, dovoljno za dedupe i dnevne limite */
    let scoreMarks = [];
    const sm = await sb.from("score_marks").select("*").order("created_at",{ascending:false}).limit(800);
    if(sm.error) console.warn("[Supabase] score_marks (v2.1 SQL nije pokrenut?):", sm.error);
    else scoreMarks = sm.data.map(StorageService.mapMark);
    return {
      users: users.data.map(u=>this.mapUser(u)),
      tasks: tasks.data.map(t=>this.mapTask(t)),
      notifications: notifs.data.map(n=>({id:n.id, userId:n.user_id, taskId:n.task_id, text:n.text, read:!!n.read, createdAt:n.created_at})),
      auditLogs: audit.data.map(a=>({id:a.id, at:a.at, userId:a.user_id, action:a.action, entity:a.entity||"", details:a.details||""})),
      reminders, scoreMarks,
      meta:{version:2, backend:"supabase"}
    };
  },

  taskRow(t){
    return {
      id:t.id, title:t.title, description:t.description||"",
      department_id:this.deptByName[t.department]||null, category_id:this.catByName[t.category]||null,
      status:t.status, priority:t.priority,
      created_by:t.createdBy||null, assigned_to:t.assignedTo||null,
      created_at:t.createdAt, updated_at:t.updatedAt, due_date:t.dueDate,
      started_at:t.startedAt||null, first_response_at:t.firstResponseAt||null, completed_at:t.completedAt||null,
      estimated_minutes:t.estimatedMinutes||null, actual_minutes:t.actualMinutes||null,
      tags:t.tags||[], blocked_reason:t.blockedReason||"", waiting_for:t.waitingFor||"",
      is_archived:!!t.isArchived
    };
  },

  /* Snimanje jednog taska + njegove dece (učesnici, komentari, checklist,
     prilozi): deca se brišu pa upisuje trenutno stanje — ID-jevi se čuvaju. */
  async saveTaskAsync(t){
    const up = await sb.from("tasks").upsert(this.taskRow(t));
    if(up.error) throw up.error;
    const del = await Promise.all([
      sb.from("task_participants").delete().eq("task_id", t.id),
      sb.from("task_comments").delete().eq("task_id", t.id),
      sb.from("task_checklist").delete().eq("task_id", t.id),
      sb.from("task_attachments").delete().eq("task_id", t.id)
    ]);
    const de = del.find(x=>x.error); if(de) throw de.error;
    const ins = await Promise.all([
      (t.participants||[]).length ? sb.from("task_participants").insert(t.participants.map(u=>({task_id:t.id, user_id:u}))) : {error:null},
      (t.comments||[]).length ? sb.from("task_comments").insert(t.comments.map(c=>({id:c.id, task_id:t.id, user_id:c.userId, text:c.text, internal:!!c.internal, created_at:c.createdAt}))) : {error:null},
      (t.checklist||[]).length ? sb.from("task_checklist").insert(t.checklist.map((k,i)=>({id:k.id, task_id:t.id, label:k.label, done:!!k.done, required:!!k.required, position:i}))) : {error:null},
      (t.attachments||[]).length ? sb.from("task_attachments").insert(t.attachments.map(a=>({id:a.id, task_id:t.id, name:a.name, storage_path:a.storagePath||null, added_by:a.addedBy||null, added_at:a.addedAt||new Date().toISOString()}))) : {error:null}
    ]);
    const ie = ins.find(x=>x.error); if(ie) throw ie.error;
  },
  saveTask(t){ StorageService._enqueue(()=>StorageService.saveTaskAsync(t), "task"); },

  /* Serijalizovan red upisa: svaki upis čeka da prethodni završi.
     Time notifikacija/audit nikad ne stigne u bazu pre taska na koji
     se odnosi (FK 23503 trka). Greška jednog upisa ne blokira sledeće. */
  _writeQueue: Promise.resolve(),
  _enqueue(job, where, warnOnly){
    const run = StorageService._writeQueue.then(job).catch(e=>{
      if(warnOnly) console.warn("[Supabase] "+where+":", e);
      else StorageService._err(where, e);
    });
    StorageService._writeQueue = run;
    return run;
  },

  saveNotification(n){
    StorageService._enqueue(async()=>{
      const r = await sb.from("notifications").insert({id:n.id, user_id:n.userId, task_id:n.taskId||null, text:n.text, read:!!n.read, created_at:n.createdAt});
      if(r.error) throw r.error;
    }, "notifikacija");
  },
  markNotificationsRead(ids){
    if(!ids || !ids.length) return;
    StorageService._enqueue(async()=>{
      const r = await sb.from("notifications").update({read:true}).in("id", ids);
      if(r.error) throw r.error;
    }, "notifikacija");
  },
  saveAudit(a){
    StorageService._enqueue(async()=>{
      const r = await sb.from("audit_logs").insert({id:a.id, at:a.at, user_id:a.userId, action:a.action, entity:a.entity||"", details:a.details||""});
      if(r.error) throw r.error;
    }, "audit", true);
  },

  /* v2.0: evidencija poslatih podsetnika */
  saveReminderRows(rows){
    if(!rows || !rows.length) return;
    StorageService._enqueue(async()=>{
      const r = await sb.from("task_reminders").insert(rows.map(x=>({id:x.id, task_id:x.taskId, user_id:x.userId, sent_by:x.sentBy||null, kind:x.kind, sent_at:x.sentAt})));
      if(r.error) throw r.error;
    }, "podsetnik");
  },
  /* v2.0: ping prisustva — tiho, bez toast-a (da ne smeta u radu) */
  logPresence(userId){
    StorageService._enqueue(async()=>{
      const r = await sb.from("presence_log").insert({user_id:userId, seen_at:new Date().toISOString()});
      if(r.error) throw r.error;
    }, "prisustvo", true);
  },
  /* v2.1: upis znakova. Automatski znakovi idu kroz upsert na ref_key sa
     ignoreDuplicates — dva klijenta mogu istovremeno pokušati isti znak
     bez greške i bez duplikata. */
  saveScoreMarks(rows, silent){
    if(!rows || !rows.length) return Promise.resolve();
    return StorageService._enqueue(async()=>{
      const r = await sb.from("score_marks").upsert(rows.map(x=>({
        id:x.id, user_id:x.userId, value:x.value, kind:x.kind, reason:x.reason,
        created_by:x.createdBy||null, task_id:x.taskId||null, ref_key:x.refKey, created_at:x.createdAt
      })), {onConflict:"ref_key", ignoreDuplicates:true});
      if(r.error) throw r.error;
    }, "znak", !!silent);
  },
  /* v2.1: znakovi za period (paginirano). RLS odlučuje šta korisnik sme da vidi. */
  async fetchScoreMarks(fromIso, toIso){
    const out = [];
    for(let page=0; page<50; page++){
      const r = await sb.from("score_marks").select("*")
        .gte("created_at", fromIso).lte("created_at", toIso)
        .order("created_at",{ascending:false})
        .range(page*1000, page*1000+999);
      if(r.error) throw r.error;
      out.push(...r.data);
      if(r.data.length<1000) break;
    }
    return out.map(StorageService.mapMark);
  },
  mapMark(r){ return {id:r.id, userId:r.user_id, value:r.value, kind:r.kind, reason:r.reason||"",
    createdBy:r.created_by, taskId:r.task_id, refKey:r.ref_key, createdAt:r.created_at,
    annulledAt:r.annulled_at||null, annulledBy:r.annulled_by||null, annulReason:r.annul_reason||""}; },
  /* v2.2: ukidanje znaka — znak ostaje u evidenciji, ali se ne računa u skor */
  annulScoreMark(markId, byUserId, reason){
    StorageService._enqueue(async()=>{
      const r = await sb.from("score_marks").update({annulled_at:new Date().toISOString(), annulled_by:byUserId, annul_reason:reason}).eq("id", markId);
      if(r.error) throw r.error;
    }, "ukidanje znaka");
  },

  /* v2.0: čitanje prisustva za period (paginirano — PostgREST vraća max 1000 redova po upitu) */
  async fetchPresence(fromIso, toIso){
    const out = [];
    for(let page=0; page<50; page++){
      const r = await sb.from("presence_log").select("user_id,seen_at")
        .gte("seen_at", fromIso).lte("seen_at", toIso)
        .order("seen_at",{ascending:true})
        .range(page*1000, page*1000+999);
      if(r.error) throw r.error;
      out.push(...r.data);
      if(r.data.length<1000) break;
    }
    return out;
  }
};

/* =====================================================================
   AUTH SERVICE — prava prijava preko Supabase Auth-a.
   Lozinke žive isključivo u Supabase Auth-u, nikad u tabeli users.
   ===================================================================== */
const AuthService = {
  async loginUser(email, password){
    const { data, error } = await sb.auth.signInWithPassword({ email:String(email||"").trim(), password });
    if(error) return {ok:false, error:"Pogrešan email ili lozinka."};
    const prof = await sb.from("users").select("*").eq("id", data.user.id).single();
    if(prof.error || !prof.data){
      await sb.auth.signOut();
      return {ok:false, error:"Nalog postoji, ali profil nije unet u tabelu users. Javi administratoru."};
    }
    await StorageService.ensureLookups();
    AppState.currentUser = StorageService.mapUser(prof.data);
    return {ok:true, user:AppState.currentUser};
  },
  logoutUser(){
    if(AppState.currentUser && AppState.db) AuditService.log("Odjava","user:"+AppState.currentUser.id, AppState.currentUser.name+" se odjavio/la");
    AppState.currentUser = null;
    sb.auth.signOut();
  },
  async restoreSession(){
    const { data } = await sb.auth.getSession();
    if(!data || !data.session) return false;
    const prof = await sb.from("users").select("*").eq("id", data.session.user.id).single();
    if(prof.error || !prof.data){ await sb.auth.signOut(); return false; }
    await StorageService.ensureLookups();
    AppState.currentUser = StorageService.mapUser(prof.data);
    return true;
  }
};

/* =====================================================================
   PERMISSION SERVICE — role i dozvole
   ===================================================================== */
const PermissionService = {
  isFinancialTask(task){ return FIN_DEPTS.includes(task.department) || FIN_CATS.includes(task.category); },
  isInvolved(user, task){ return task.assignedTo===user.id || task.createdBy===user.id || (task.participants||[]).includes(user.id); },

  canUserAccessTask(user, task){
    if(!user || !task) return false;
    switch(user.role){
      case "superadmin": case "menadzment": return true;
      case "finansije": return task.department===user.department || PermissionService.isFinancialTask(task) || PermissionService.isInvolved(user,task);
      case "voznipark": return task.department===user.department || task.department==="Vozni park" || PermissionService.isInvolved(user,task);
      /* teamlead, dispecer i svi ostali: vide sve zadatke svog sektora + one u kojima učestvuju */
      case "teamlead": case "dispecer": default:
        return task.department===user.department || PermissionService.isInvolved(user,task);
    }
  },
  canUserEditTask(user, task){
    if(!user || !task) return false;
    if(user.role==="superadmin" || user.role==="menadzment") return true;
    if(user.role==="teamlead") return task.department===user.department || PermissionService.isInvolved(user,task);
    if(user.role==="finansije") return (PermissionService.isFinancialTask(task) && task.assignedTo===user.id) || PermissionService.isInvolved(user,task);
    return PermissionService.isInvolved(user,task); // dispečer i vozni park — samo svoje
  },
  canUserDeleteTask(user, task){ // brisanje = arhiviranje
    if(!user) return false;
    if(user.role==="superadmin") return true;
    if(user.role==="menadzment") return true;
    if(user.role==="teamlead" && task && task.department===user.department) return true;
    return false;
  },
  canUserCreateTask(user){ return !!user; },
  canUserViewReports(user){ return ["superadmin","menadzment","teamlead"].includes(user.role); },
  canUserViewEfficiency(user){ return ["superadmin","menadzment"].includes(user.role); },
  canUserViewAudit(user){ return ["superadmin","menadzment"].includes(user.role); },
  canUserViewUsers(user){ return ["superadmin","menadzment"].includes(user.role); },
  canUserViewSettings(user){ return user.role==="superadmin"; },
  canUserViewPresence(user){ return ["superadmin","menadzment"].includes(user.role); },
  /* v2.1: skor tablu SVIH vide menadžment i superadmin; ostali samo svoj skor */
  canUserViewAllScores(user){ return ["superadmin","menadzment"].includes(user.role); },
  /* ukidanje znaka: menadžment zna ko je bio na godišnjem/bolovanju */
  canUserAnnulMark(user){ return ["superadmin","menadzment"].includes(user.role); },
  assignableUsers(){
    /* Svi korisnici mogu da dodele task bilo kome. */
    return AppState.db.users;
  },
  visibleTasks(user, includeArchived){
    return AppState.db.tasks.filter(t => (includeArchived || !t.isArchived) && PermissionService.canUserAccessTask(user,t));
  }
};

/* =====================================================================
   TASK SERVICE — poslovna logika taskova
   ===================================================================== */
const TaskService = {
  getTask(id){ return AppState.db.tasks.find(t=>t.id===id); },
  userById(id){ return AppState.db.users.find(u=>u.id===id); },

  /* Više odgovornih osoba: primarna = assignedTo, dodatne = participants.
     (koristi postojeću tabelu task_participants — bez izmene SQL šeme) */
  assigneeIds(task){
    const ids = [];
    if(task.assignedTo) ids.push(task.assignedTo);
    (task.participants||[]).forEach(id=>{ if(id && !ids.includes(id)) ids.push(id); });
    return ids;
  },
  assigneesOf(task){ return TaskService.assigneeIds(task).map(id=>TaskService.userById(id)).filter(Boolean); },
  isAssignee(task, userId){ return TaskService.assigneeIds(task).includes(userId); },
  assigneeNames(task){ const a=TaskService.assigneesOf(task); return a.length?a.map(x=>x.name).join(", "):"—"; },

  calculateTaskDelay(task){
    if(!task.dueDate) return {late:false, days:0};
    const end = ["Završeno","Otkazano","Arhivirano"].includes(task.status) ? (task.completedAt||task.updatedAt) : new Date().toISOString();
    const diff = startOfDay(end) - startOfDay(task.dueDate);
    const days = Math.round(diff/864e5);
    const isClosed = ["Završeno","Otkazano","Arhivirano"].includes(task.status);
    return {late: days>0 && (!isClosed || (task.status==="Završeno" && new Date(task.completedAt)>new Date(task.dueDate))), days:Math.max(days,0)};
  },

  validate(data, existing){
    const errors = [];
    if(!data.title || !data.title.trim()) errors.push("Naziv taska je obavezan.");
    if(!data.dueDate) errors.push("Rok je obavezan.");
    if(!data.priority) errors.push("Prioritet je obavezan.");
    if(data.status!=="Novo" && !data.assignedTo) errors.push("Odgovorna osoba je obavezna ako status nije „Novo“.");
    if(data.status==="Blokirano" && !(data.blockedReason||"").trim()) errors.push("Za status „Blokirano“ mora se uneti razlog blokade.");
    if(data.status==="Čeka odgovor" && !(data.waitingFor||"").trim()) errors.push("Za status „Čeka odgovor“ mora se uneti od koga se čeka odgovor.");
    const checklist = data.checklist || (existing && existing.checklist) || [];
    if(data.status==="Završeno" && checklist.some(c=>c.required && !c.done)) errors.push("Task ima nezavršene obavezne checklist stavke — ne može u status „Završeno“.");
    return errors;
  },

  applyStatusTimestamps(task, oldStatus, actorId){
    const now = new Date().toISOString();
    if(task.status==="U toku" && !task.startedAt) task.startedAt = now;
    if(!task.firstResponseAt && TaskService.isAssignee(task, actorId) && task.status!==oldStatus) task.firstResponseAt = now;
    if(task.status==="Završeno" && oldStatus!=="Završeno"){ task.completedAt = now; if(task.startedAt && !task.actualMinutes) task.actualMinutes = Math.max(1,Math.round((new Date(now)-new Date(task.startedAt))/6e4)); }
    if(task.status!=="Završeno") task.completedAt = null;
  },

  createTask(data){
    const user = AppState.currentUser;
    const errors = TaskService.validate(data);
    if(errors.length) return {ok:false, errors};
    const now = new Date().toISOString();
    const task = Object.assign({
      id:uid("t"), title:"", description:"", department:DEPARTMENTS[0], category:CATEGORIES[0],
      status:"Novo", priority:"Normalan", createdBy:user.id, assignedTo:null, participants:[],
      createdAt:now, updatedAt:now, dueDate:null, startedAt:null, firstResponseAt:null, completedAt:null,
      estimatedMinutes:null, actualMinutes:null, tags:[], checklist:[], comments:[], attachments:[],
      blockedReason:"", waitingFor:"", isArchived:false
    }, data);
    TaskService.applyStatusTimestamps(task, "Novo", user.id);
    AppState.db.tasks.unshift(task);
    StorageService.saveTask(task);
    AuditService.log("Kreiranje taska", task.id, task.title);
    TaskService.assigneeIds(task).forEach(id=>{
      if(id!==user.id) NotificationService.notify(id, "Dodeljen ti je task: "+task.title, task.id);
      if(task.priority==="Kritičan") NotificationService.notify(id, "Kritičan task: "+task.title, task.id);
    });
    return {ok:true, task};
  },

  updateTask(taskId, updates){
    const user = AppState.currentUser;
    const task = TaskService.getTask(taskId);
    if(!task) return {ok:false, errors:["Task ne postoji."]};
    if(!PermissionService.canUserEditTask(user, task)) return {ok:false, errors:["Nemate dozvolu za izmenu ovog taska."]};
    const merged = Object.assign({}, task, updates);
    const errors = TaskService.validate(merged, task);
    if(errors.length) return {ok:false, errors};
    const oldStatus = task.status, oldDue = task.dueDate, oldPri = task.priority;
    const oldAssignees = TaskService.assigneeIds(task);
    Object.assign(task, updates, {updatedAt:new Date().toISOString()});
    TaskService.applyStatusTimestamps(task, oldStatus, user.id);
    StorageService.saveTask(task);
    AuditService.log("Izmena taska", task.id, task.title);
    const assignees = TaskService.assigneeIds(task);
    const others = assignees.filter(id=>id!==user.id);
    if(oldStatus!==task.status) AuditService.log("Promena statusa", task.id, oldStatus+" → "+task.status);
    if(oldPri!==task.priority){ AuditService.log("Promena prioriteta", task.id, oldPri+" → "+task.priority);
      if(task.priority==="Kritičan") others.forEach(id=>NotificationService.notify(id,"Task je postao kritičan: "+task.title, task.id)); }
    if(oldDue!==task.dueDate){ AuditService.log("Promena roka", task.id, fmtDate(oldDue)+" → "+fmtDate(task.dueDate));
      others.forEach(id=>NotificationService.notify(id,"Promenjen je rok taska: "+task.title+" ("+fmtDate(task.dueDate)+")", task.id)); }
    assignees.filter(id=>!oldAssignees.includes(id) && id!==user.id).forEach(id=>NotificationService.notify(id,"Dodeljen ti je task: "+task.title, task.id));
    if(task.status==="Završeno" && oldStatus!=="Završeno") AuditService.log("Završetak taska", task.id, task.title);
    if(task.status==="Blokirano" && oldStatus!=="Blokirano") others.forEach(id=>NotificationService.notify(id,"Task je blokiran: "+task.title, task.id));
    return {ok:true, task};
  },

  changeTaskStatus(taskId, status){
    const task = TaskService.getTask(taskId);
    if(!task) return {ok:false, errors:["Task ne postoji."]};
    const updates = {status};
    if(status==="Blokirano" && !task.blockedReason){
      const r = prompt("Razlog blokade (obavezno):");
      if(!r || !r.trim()) return {ok:false, errors:["Za status „Blokirano“ mora se uneti razlog blokade."]};
      updates.blockedReason = r.trim();
    }
    if(status==="Čeka odgovor" && !task.waitingFor){
      const w = prompt("Od koga se čeka odgovor (obavezno):");
      if(!w || !w.trim()) return {ok:false, errors:["Za status „Čeka odgovor“ mora se uneti od koga se čeka odgovor."]};
      updates.waitingFor = w.trim();
    }
    return TaskService.updateTask(taskId, updates);
  },

  archiveTask(taskId){
    const user = AppState.currentUser;
    const task = TaskService.getTask(taskId);
    if(!task) return {ok:false, errors:["Task ne postoji."]};
    if(!PermissionService.canUserDeleteTask(user, task)) return {ok:false, errors:["Nemate dozvolu za arhiviranje."]};
    task.isArchived = true; task.status = "Arhivirano"; task.updatedAt = new Date().toISOString();
    StorageService.saveTask(task);
    AuditService.log("Arhiviranje taska", task.id, task.title);
    return {ok:true};
  },

  addTaskComment(taskId, text, internal){
    const user = AppState.currentUser;
    const task = TaskService.getTask(taskId);
    if(!task || !text || !text.trim()) return {ok:false};
    const c = {id:uid("c"), userId:user.id, text:text.trim(), createdAt:new Date().toISOString(), internal:!!internal};
    task.comments.push(c);
    task.updatedAt = c.createdAt;
    if(!task.firstResponseAt && TaskService.isAssignee(task, user.id)) task.firstResponseAt = c.createdAt;
    // @pominjanja
    AppState.db.users.forEach(u=>{
      const first = u.name.split(" ")[0];
      if(u.id!==user.id && (text.includes("@"+u.name) || text.includes("@"+first)))
        NotificationService.notify(u.id, user.name+" te je pomenuo/la u komentaru: "+task.title, task.id);
    });
    StorageService.saveTask(task);
    AuditService.log("Komentar", task.id, text.slice(0,80));
    return {ok:true, comment:c};
  },

  toggleChecklistItem(taskId, itemId){
    const task = TaskService.getTask(taskId);
    if(!task) return {ok:false};
    const item = task.checklist.find(i=>i.id===itemId);
    if(!item) return {ok:false};
    item.done = !item.done;
    task.updatedAt = new Date().toISOString();
    StorageService.saveTask(task);
    return {ok:true, item};
  }
};

/* =====================================================================
   PRESENCE SERVICE — evidencija online prisustva (v2.0).
   Ping u presence_log pri ulasku i na svakih 5 min dok je tab vidljiv.
   Sesije se rekonstruišu iz pingova: pauza > 12 min = nova sesija.
   ===================================================================== */
const PresenceService = {
  PING_MS: 5*60*1000, GAP_MS: 12*60*1000,
  _timer:null, _lastPing:0, _visHooked:false,
  start(){
    if(PresenceService._timer) return;
    PresenceService.ping();
    PresenceService._timer = setInterval(()=>{ if(document.visibilityState==="visible") PresenceService.ping(); }, PresenceService.PING_MS);
    if(!PresenceService._visHooked){
      PresenceService._visHooked = true;
      document.addEventListener("visibilitychange", ()=>{
        if(document.visibilityState==="visible" && AppState.currentUser && Date.now()-PresenceService._lastPing > PresenceService.PING_MS*0.8) PresenceService.ping();
      });
    }
  },
  stop(){ if(PresenceService._timer){ clearInterval(PresenceService._timer); PresenceService._timer=null; } },
  ping(){
    if(!AppState.currentUser) return;
    PresenceService._lastPing = Date.now();
    StorageService.logPresence(AppState.currentUser.id);
  },
  /* pings: rastuće sortiran niz Date objekata jednog korisnika/dana */
  sessionStats(pings){
    let total=0, sessions=0, prev=null;
    pings.forEach(pg=>{ const t=+pg; if(prev==null || t-prev>PresenceService.GAP_MS) sessions++; else total += t-prev; prev=t; });
    return {totalMs:total, sessions, first:pings[0]||null, last:pings[pings.length-1]||null};
  }
};

/* =====================================================================
   REMINDER SERVICE — podsetnici sa evidencijom (v2.0).
   Ručni: dugme u detaljima taska. Automatski: 24h pre roka + na dan roka
   (provera pri ulasku i na 10 min; dedupe kroz task_reminders).
   ===================================================================== */
const ReminderService = {
  forTask(taskId){ return (AppState.db.reminders||[]).filter(r=>r.taskId===taskId); },
  _hasAuto(taskId, kind){ return (AppState.db.reminders||[]).some(r=>r.taskId===taskId && r.kind===kind); },
  _record(task, recipients, kind, sentBy){
    const now = new Date().toISOString();
    const rows = recipients.map(rid=>({id:uid("r"), taskId:task.id, userId:rid, sentBy:sentBy||null, kind, sentAt:now}));
    AppState.db.reminders = rows.concat(AppState.db.reminders||[]);
    StorageService.saveReminderRows(rows);
    return rows;
  },
  sendManual(taskId){
    const u = AppState.currentUser, t = TaskService.getTask(taskId);
    if(!t) return {ok:false, error:"Task ne postoji."};
    const recipients = TaskService.assigneeIds(t).filter(id=>id!==u.id);
    if(!recipients.length) return {ok:false, error:"Vi ste jedina odgovorna osoba na ovom tasku — nema kome da se pošalje podsetnik."};
    recipients.forEach(id=>NotificationService.notify(id, "\ud83d\udd14 Podsetnik ("+u.name.split(" ")[0]+"): "+t.title+" — rok "+fmtDate(t.dueDate), t.id));
    ReminderService._record(t, recipients, "manual", u.id);
    AuditService.log("Podsetnik", t.id, "Ručni podsetnik → "+recipients.length+" os.");
    return {ok:true, count:recipients.length};
  },
  checkAuto(){
    if(!AppState.db) return;
    const now = new Date();
    AppState.db.tasks.forEach(t=>{
      if(t.isArchived || !OPEN_STATUSES.includes(t.status) || !t.dueDate) return;
      const asg = TaskService.assigneeIds(t); if(!asg.length) return;
      const due = new Date(t.dueDate);
      const dayDiff = Math.round((startOfDay(due)-startOfDay(now))/864e5);
      if(dayDiff===1 && (due-now)<=24*36e5 && !ReminderService._hasAuto(t.id,"auto24")){
        asg.forEach(id=>NotificationService.notify(id, "\u23f0 Rok ističe za 24h: "+t.title+" ("+fmtDate(t.dueDate)+")", t.id));
        ReminderService._record(t, asg, "auto24", null);
      }
      if(dayDiff===0 && !ReminderService._hasAuto(t.id,"autoDue")){
        asg.forEach(id=>NotificationService.notify(id, "\u23f0 Rok je DANAS: "+t.title, t.id));
        ReminderService._record(t, asg, "autoDue", null);
      }
    });
  },
  kindLabel(k){ return k==="manual"?"ručni":k==="auto24"?"automatski (24h pre roka)":k==="autoDue"?"automatski (na dan roka)":k; }
};

/* =====================================================================
   SCORE SERVICE — sistem znakova 👍 / 👎 (v2.1).
   Tri izvora znakova:
     manual      — kolega daje znak uz obavezan razlog (nije anonimno)
     late_login  — prijava posle 08:10 radnim danom (−1)
     overdue     — task neizvršen 48h posle roka (−1, jednom po tasku)
   Dedupe: ref_key je UNIQUE u bazi, pa isti znak ne može dva puta ni ako
   ga pokuša više klijenata istovremeno.
   ===================================================================== */
const ScoreService = {
  marks(){ return AppState.db.scoreMarks || (AppState.db.scoreMarks = []); },
  has(refKey){ return ScoreService.marks().some(m=>m.refKey===refKey); },

  /* ---- periodi ---- */
  monthRange(d){
    const x = d?new Date(d):new Date();
    const from = new Date(x.getFullYear(), x.getMonth(), 1, 0,0,0,0);
    const to = new Date(x.getFullYear(), x.getMonth()+1, 0, 23,59,59,999);
    return {from, to};
  },
  prevMonthRange(){ const n=new Date(); return ScoreService.monthRange(new Date(n.getFullYear(), n.getMonth()-1, 15)); },
  monthLabel(d){
    const M=["januar","februar","mart","april","maj","jun","jul","avgust","septembar","oktobar","novembar","decembar"];
    const x=d?new Date(d):new Date(); return M[x.getMonth()]+" "+x.getFullYear();
  },

  /* ---- agregacija: {userId: {plus, minus, net, marks[]}} ---- */
  aggregate(marks){
    const by = {};
    marks.filter(m=>!m.annulledAt).forEach(m=>{
      const b = by[m.userId] = by[m.userId] || {plus:0, minus:0, net:0, marks:[]};
      if(m.value>0) b.plus += m.value; else b.minus += Math.abs(m.value);
      b.net += m.value;
      b.marks.push(m);
    });
    Object.values(by).forEach(b=>b.marks.sort((a,c)=> a.createdAt<c.createdAt?1:-1));
    return by;
  },

  /* ---- ručni znak ---- */
  canGiveTo(targetId){
    const u = AppState.currentUser;
    if(targetId===u.id) return {ok:false, error:"Ne možete dati znak sami sebi."};
    const today = dateInput(new Date().toISOString());
    const mine = ScoreService.marks().filter(m=>m.kind==="manual" && m.createdBy===u.id && dateInput(m.createdAt)===today);
    if(mine.length >= SCORE.MAX_PER_DAY) return {ok:false, error:"Dnevni limit je "+SCORE.MAX_PER_DAY+" znaka. Pokušajte ponovo sutra."};
    if(mine.some(m=>m.userId===targetId)) return {ok:false, error:"Istoj osobi možete dati samo jedan znak dnevno."};
    return {ok:true};
  },
  giveMark(targetId, value, reason){
    const u = AppState.currentUser;
    const target = TaskService.userById(targetId);
    if(!target) return {ok:false, error:"Izaberite osobu."};
    if(value!==1 && value!==-1) return {ok:false, error:"Izaberite 👍 ili 👎."};
    reason = (reason||"").trim();
    if(reason.length < SCORE.REASON_MIN) return {ok:false, error:"Razlog je obavezan — najmanje "+SCORE.REASON_MIN+" znakova."};
    if(reason.length > 300) reason = reason.slice(0,300);
    const gate = ScoreService.canGiveTo(targetId);
    if(!gate.ok) return gate;
    const now = new Date().toISOString();
    const row = {id:uid("s"), userId:targetId, value, kind:"manual", reason,
      createdBy:u.id, taskId:null, refKey:"manual:"+u.id+":"+targetId+":"+dateInput(now), createdAt:now};
    ScoreService.marks().unshift(row);
    StorageService.saveScoreMarks([row]);
    NotificationService.notify(targetId, (value>0?"👍":"👎")+" Znak od "+u.name+": "+reason);
    AuditService.log("Znak", "user:"+targetId, (value>0?"+1":"−1")+" — "+reason);
    return {ok:true, value, name:target.name};
  },

  /* ---- automatski: task neizvršen 48h posle roka ---- */
  checkAutoOverdue(){
    if(!AppState.db) return [];
    const now = Date.now(), rows = [];
    const cutoff = new Date(SCORE.FROM_DATE+"T00:00:00").getTime();
    AppState.db.tasks.forEach(t=>{
      if(t.isArchived || !t.dueDate) return;
      if(!OPEN_STATUSES.includes(t.status)) return;
      if(SCORE.EXEMPT_STATUSES.includes(t.status)) return;
      const due = new Date(t.dueDate).getTime();
      const breach = due + SCORE.OVERDUE_HOURS*36e5;   /* momenat kada nastaje prekršaj */
      if(now < breach) return;
      if(breach < cutoff) return;                       /* prekršaj nastao pre uvođenja sistema */
      TaskService.assigneeIds(t).forEach(uid_=>{
        const refKey = "overdue:"+t.id+":"+uid_;
        if(ScoreService.has(refKey)) return;
        rows.push({id:uid("s"), userId:uid_, value:-1, kind:"overdue",
          reason:"Task „"+t.title+"“ nije izvršen 48h posle roka ("+fmtDate(t.dueDate)+")",
          createdBy:null, taskId:t.id, refKey, createdAt:new Date().toISOString()});
      });
    });
    if(rows.length){
      rows.forEach(r=>ScoreService.marks().unshift(r));
      StorageService.saveScoreMarks(rows, true);
      rows.forEach(r=>NotificationService.notify(r.userId, "👎 Automatski znak: "+r.reason));
    }
    return rows;
  },

  /* ---- automatski: nijedna prijava tokom radnog vremena ----
     Pravilo: radnim danom (pon–pet) mora postojati barem jedan ping prisustva
     između WORK_START_HOUR i WORK_END_HOUR. Ako ga nema — znak −1.
     Zaštite: dan se ocenjuje tek kad prođe (posle 16h), praznici iz
     SCORE.HOLIDAYS se preskaču, i radnik ne dobija znak za dane pre svog
     unosa u sistem. Godišnji odmor i bolovanje sistem NE ZNA — takvi znakovi
     se ukidaju kroz „Ukini znak“ (menadžment/superadmin). */
  workingDaysBetween(fromDate, toDate){
    const out = [], d = startOfDay(fromDate), end = startOfDay(toDate);
    while(d <= end){
      const dow = d.getDay();
      const key = dateInput(d.toISOString());
      if(dow!==0 && dow!==6 && !SCORE.HOLIDAYS.includes(key)) out.push(key);
      d.setDate(d.getDate()+1);
    }
    return out;
  },
  /* Poslednji radni dan koji je već završen (posle WORK_END_HOUR) */
  lastGradableDay(now){
    const n = now?new Date(now):new Date();
    const endToday = new Date(n); endToday.setHours(SCORE.WORK_END_HOUR,0,0,0);
    const d = new Date(n);
    if(n < endToday) d.setDate(d.getDate()-1);   /* danas još nije završen */
    return d;
  },
  noLoginFromPresence(presenceRows, users, now){
    const cutoff = startOfDay(new Date(SCORE.FROM_DATE+"T00:00:00"));
    const last = ScoreService.lastGradableDay(now);
    if(last < cutoff) return [];
    let from = new Date((now?new Date(now):new Date()).getTime() - SCORE.LOOKBACK_DAYS*864e5);
    if(from < cutoff) from = new Date(cutoff);
    const days = ScoreService.workingDaysBetween(from, last);
    if(!days.length) return [];
    /* skup "userId|YYYY-MM-DD" gde POSTOJI ping unutar radnog vremena */
    const seen = {};
    presenceRows.forEach(r=>{
      const d = new Date(r.seen_at), h = d.getHours() + d.getMinutes()/60;
      if(h < SCORE.WORK_START_HOUR || h >= SCORE.WORK_END_HOUR) return;
      seen[r.user_id+"|"+dateInput(r.seen_at)] = true;
    });
    const rows = [];
    users.forEach(u=>{
      const joined = u.createdAt ? startOfDay(u.createdAt) : null;
      days.forEach(day=>{
        if(joined && new Date(day+"T23:59:59") < joined) return;   /* pre unosa u sistem */
        if(seen[u.id+"|"+day]) return;
        const refKey = "nologin:"+u.id+":"+day;
        if(ScoreService.has(refKey)) return;
        rows.push({id:uid("s"), userId:u.id, value:-1, kind:"no_login",
          reason:"Nijedna prijava u aplikaciju "+day.split("-").reverse().join(".")+". u radnom vremenu ("+pad(SCORE.WORK_START_HOUR)+":00–"+pad(SCORE.WORK_END_HOUR)+":00)",
          createdBy:null, taskId:null, refKey,
          createdAt:new Date(day+"T"+pad(SCORE.WORK_END_HOUR)+":00:00").toISOString()});
      });
    });
    return rows;
  },
  /* VAŽNO: pokreće se samo kod menadžmenta/superadmina. Zaposleni po RLS-u
     vidi samo svoje prisustvo, pa bi mu izostanak tuđih redova izgledao kao
     da se niko nije prijavio i upisao bi lažne znakove celom timu. */
  async checkAutoNoLogin(){
    const me = AppState.currentUser;
    if(!me || !PermissionService.canUserViewAllScores(me)) return [];
    try{
      const from = new Date(Date.now() - (SCORE.LOOKBACK_DAYS+1)*864e5).toISOString();
      const presence = await StorageService.fetchPresence(from, new Date().toISOString());
      const rows = ScoreService.noLoginFromPresence(presence, AppState.db.users);
      if(rows.length){
        rows.forEach(r=>ScoreService.marks().unshift(r));
        await StorageService.saveScoreMarks(rows, true);
        rows.forEach(r=>NotificationService.notify(r.userId, "👎 Automatski znak: "+r.reason));
        AuditService.log("Znak (auto)", "no_login", rows.length+" znak(ova) za dane bez prijave");
      }
      return rows;
    }catch(e){ console.warn("[Skor] provera prijava:", e); return []; }
  },

  /* ---- ukidanje znaka (godišnji, bolovanje, praznik, greška) ---- */
  annulMark(markId, reason){
    const u = AppState.currentUser;
    if(!PermissionService.canUserAnnulMark(u)) return {ok:false, error:"Nemate pravo da ukidate znakove."};
    reason = (reason||"").trim();
    if(reason.length < 3) return {ok:false, error:"Upišite razlog ukidanja (npr. godišnji odmor)."};
    const m = ScoreService.marks().find(x=>x.id===markId);
    if(m){ m.annulledAt = new Date().toISOString(); m.annulledBy = u.id; m.annulReason = reason; }
    StorageService.annulScoreMark(markId, u.id, reason);
    AuditService.log("Znak ukinut", markId, reason);
    return {ok:true};
  },
  kindLabel(k){ return k==="manual"?"znak kolege" : k==="no_login"?"bez prijave u radnom vremenu" : k==="late_login"?"kasna prijava" : k==="overdue"?"prekoračen rok 48h" : k; }
};

/* =====================================================================
   REALTIME SERVICE — izmene kolega bez F5 (v2.0).
   Pretplata na promene tabela; na događaj se (debounce 900 ms) ponovo
   učitava stanje iz baze. Ako je modal otvoren, osvežavanje ekrana se
   odlaže do zatvaranja (da ne prekine kucanje) — podaci se ipak povuku.
   ===================================================================== */
const RealtimeService = {
  _channel:null, _deb:null, _reloading:false, _pending:false, _visHooked:false,
  start(){
    if(RealtimeService._channel) return;
    try{
      const ch = sb.channel("flowcore-db");
      ["tasks","task_comments","task_checklist","task_participants","task_attachments","notifications","score_marks"].forEach(tbl=>{
        ch.on("postgres_changes",{event:"*",schema:"public",table:tbl},()=>RealtimeService.schedule());
      });
      ch.subscribe(status=>{
        if(status==="CHANNEL_ERROR") console.warn("[Realtime] kanal nije dostupan — proveri da li je pokrenut flowcore_v2.sql (publication supabase_realtime).");
      });
      RealtimeService._channel = ch;
      if(!RealtimeService._visHooked){
        RealtimeService._visHooked = true;
        document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && AppState.currentUser) RealtimeService.schedule(); });
      }
    }catch(e){ console.warn("[Realtime]", e); }
  },
  schedule(){ clearTimeout(RealtimeService._deb); RealtimeService._deb = setTimeout(()=>RealtimeService.reload(), 900); },
  async reload(){
    if(!AppState.currentUser) return;
    if(RealtimeService._reloading){ RealtimeService._pending = true; return; }
    RealtimeService._reloading = true;
    try{
      await StorageService._writeQueue;              /* sačekaj sopstvene upise da read ne vrati starije stanje */
      const data = await StorageService.read();
      if(!AppState.currentUser) return;
      AppState.db = data;
      UI.refreshNotifBadge();
      if(AppState.page==="chat"){ ChatUI.renderNav(); }
      else if($("#modalWrap").innerHTML==="") UI.go(AppState.page);
      else UI._refreshAfterModal = true;
    }catch(e){ console.warn("[Realtime] osvežavanje nije uspelo:", e); }
    finally{
      RealtimeService._reloading = false;
      if(RealtimeService._pending){ RealtimeService._pending = false; RealtimeService.schedule(); }
    }
  },
  stop(){ if(RealtimeService._channel){ try{ sb.removeChannel(RealtimeService._channel); }catch(e){} RealtimeService._channel = null; } }
};

/* =====================================================================
   REPORT SERVICE — metrika, izveštaji, export
   ===================================================================== */
const ReportService = {
  calculateDashboardMetrics(user){
    const tasks = PermissionService.visibleTasks(user);
    const open = tasks.filter(t=>OPEN_STATUSES.includes(t.status));
    const mine = open.filter(t=>TaskService.isAssignee(t, user.id));
    const now = new Date();
    const doneThisMonth = tasks.filter(t=>t.status==="Završeno" && t.completedAt && new Date(t.completedAt).getMonth()===now.getMonth() && new Date(t.completedAt).getFullYear()===now.getFullYear());
    const late = open.filter(t=>TaskService.calculateTaskDelay(t).late);
    const critical = open.filter(t=>t.priority==="Kritičan");
    const unassigned = open.filter(t=>!t.assignedTo);
    const blocked = tasks.filter(t=>t.status==="Blokirano");
    const withResp = tasks.filter(t=>t.firstResponseAt);
    const avgResp = withResp.length ? withResp.reduce((s,t)=>s+hoursBetween(t.createdAt,t.firstResponseAt),0)/withResp.length : null;
    const done = tasks.filter(t=>t.status==="Završeno" && t.completedAt);
    const avgRes = done.length ? done.reduce((s,t)=>s+hoursBetween(t.createdAt,t.completedAt),0)/done.length : null;
    const doneWithDue = done.filter(t=>t.dueDate);
    const onTime = doneWithDue.filter(t=>new Date(t.completedAt)<=new Date(t.dueDate));
    return {
      totalOpen:open.length, myOpen:mine.length, doneThisMonth:doneThisMonth.length,
      late:late.length, critical:critical.length, unassigned:unassigned.length,
      avgFirstResponseH:avgResp, avgResolutionH:avgRes,
      onTimePct: doneWithDue.length? Math.round(onTime.length/doneWithDue.length*100) : null,
      blocked:blocked.length,
      byStatus: OPEN_STATUSES.map(s=>({label:s, value:open.filter(t=>t.status===s).length})),
      byPriority: PRIORITIES.map(p=>({label:p, value:open.filter(t=>t.priority===p).length})),
      byDept: DEPARTMENTS.map(d=>({label:d, value:open.filter(t=>t.department===d).length})).filter(x=>x.value>0),
      doneByDay: ReportService.doneByDay(tasks,14),
      lateByUser: AppState.db.users.map(u=>({label:u.name.split(" ")[0], value:open.filter(t=>TaskService.isAssignee(t, u.id) && TaskService.calculateTaskDelay(t).late).length})).filter(x=>x.value>0),
      lateTasks:late, criticalTasks:critical, unassignedTasks:unassigned, blockedTasks:blocked
    };
  },
  doneByDay(tasks, days){
    const out = [];
    for(let i=days-1;i>=0;i--){
      const d = startOfDay(new Date(Date.now()-i*864e5));
      const cnt = tasks.filter(t=>t.completedAt && startOfDay(t.completedAt).getTime()===d.getTime()).length;
      out.push({label:pad(d.getDate())+"."+pad(d.getMonth()+1)+".", value:cnt});
    }
    return out;
  },

  calculateEmployeeMetrics(){
    return AppState.db.users.map(u=>{
      const tasks = AppState.db.tasks.filter(t=>!t.isArchived && TaskService.isAssignee(t, u.id));
      const open = tasks.filter(t=>OPEN_STATUSES.includes(t.status));
      const done = tasks.filter(t=>t.status==="Završeno" && t.completedAt);
      const doneDue = done.filter(t=>t.dueDate);
      const onTime = doneDue.filter(t=>new Date(t.completedAt)<=new Date(t.dueDate));
      const late = open.filter(t=>TaskService.calculateTaskDelay(t).late);
      const critAll = tasks.filter(t=>t.priority==="Kritičan");
      const critDone = critAll.filter(t=>t.status==="Završeno");
      const withResp = tasks.filter(t=>t.firstResponseAt);
      const avgResp = withResp.length ? withResp.reduce((s,t)=>s+hoursBetween(t.createdAt,t.firstResponseAt),0)/withResp.length : null;
      const avgRes = done.length ? done.reduce((s,t)=>s+hoursBetween(t.createdAt,t.completedAt),0)/done.length : null;
      // Indeks efikasnosti: 40% rok, 25% prva reakcija, 20% vreme rešavanja, 15% kritični
      const onTimeScore = doneDue.length ? onTime.length/doneDue.length : 0.5;
      const respScore = avgResp==null ? 0.5 : Math.max(0, 1 - avgResp/24);
      const resScore  = avgRes ==null ? 0.5 : Math.max(0, 1 - avgRes/96);
      const critScore = critAll.length ? critDone.length/critAll.length : 1;
      const index = Math.round((onTimeScore*40 + respScore*25 + resScore*20 + critScore*15));
      return {user:u, total:tasks.length, open:open.length, done:done.length, onTime:onTime.length,
        late:late.length, critical:critAll.filter(t=>OPEN_STATUSES.includes(t.status)).length,
        avgFirstResponseH:avgResp, avgResolutionH:avgRes,
        onTimePct: doneDue.length? Math.round(onTime.length/doneDue.length*100) : null, index};
    }).sort((a,b)=>b.index-a.index);
  },

  managementData(){
    const tasks = AppState.db.tasks.filter(t=>!t.isArchived);
    const open = tasks.filter(t=>OPEN_STATUSES.includes(t.status));
    const late = open.filter(t=>TaskService.calculateTaskDelay(t).late);
    const critical = open.filter(t=>t.priority==="Kritičan").sort((a,b)=>new Date(a.dueDate||"2100")-new Date(b.dueDate||"2100"));
    const unassigned = open.filter(t=>!t.assignedTo);
    const blocked = open.filter(t=>t.status==="Blokirano");
    const blockedLong = blocked.filter(t=>hoursBetween(t.updatedAt, new Date().toISOString())>24 || TaskService.calculateTaskDelay(t).late);
    const waitingLong = open.filter(t=>t.status==="Čeka odgovor" && hoursBetween(t.updatedAt,new Date().toISOString())>24);
    const byUserOpen = AppState.db.users.map(u=>({user:u, open:open.filter(t=>TaskService.isAssignee(t, u.id)).length, late:late.filter(t=>TaskService.isAssignee(t, u.id)).length})).sort((a,b)=>b.open-a.open);
    const byDept = DEPARTMENTS.map(d=>({dept:d, open:open.filter(t=>t.department===d).length, late:late.filter(t=>t.department===d).length, crit:critical.filter(t=>t.department===d).length})).filter(x=>x.open>0).sort((a,b)=>b.open-a.open);
    const recos = [];
    byDept.forEach(d=>{ if(d.late>=2) recos.push({type:d.crit>0?"crit":"warn", text:d.dept+" ima "+d.late+" taskova u kašnjenju"+(d.crit?", od čega su "+d.crit+" kritični":"")+"."}); });
    byUserOpen.forEach(x=>{ if(x.open>=6) recos.push({type:"warn", text:x.user.name+" ima "+x.open+" otvorenih taskova, preporučuje se provera opterećenja."});
      if(x.late>=2) recos.push({type:"crit", text:x.user.name+" ima "+x.late+" taskova u kašnjenju."}); });
    if(unassigned.length) recos.push({type:"info", text:"Postoji "+unassigned.length+(unassigned.length===1?" task":" taska/taskova")+" bez odgovorne osobe."});
    if(blockedLong.length) recos.push({type:"crit", text:blockedLong.length+" task(ova) je blokirano duže od 24h."});
    if(waitingLong.length) recos.push({type:"warn", text:waitingLong.length+" task(ova) čeka odgovor duže od 24h."});
    if(!recos.length) recos.push({type:"info", text:"Nema kritičnih upozorenja — operativa je pod kontrolom."});
    return {critical, late, unassigned, blocked, blockedLong, waitingLong, byUserOpen, byDept, recos};
  },

  exportTasksCSV(tasks){
    const rows = [["ID","Naziv","Status","Prioritet","Odeljenje","Kategorija","Odgovorna osoba","Rok","Kreirano","Završeno","Kasni","Komentari"]];
    tasks.forEach(t=>{
      const a = TaskService.userById(t.assignedTo);
      const d = TaskService.calculateTaskDelay(t);
      rows.push([t.id,t.title,t.status,t.priority,t.department,t.category,TaskService.assigneeNames(t),fmtDate(t.dueDate),fmtDate(t.createdAt),fmtDate(t.completedAt),d.late?"DA ("+d.days+" d)":"NE",String(t.comments.length)]);
    });
    const csv = "\uFEFF"+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\r\n");
    const blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download="flowcore_taskovi_"+dateInput(new Date().toISOString())+".csv";
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    AuditService.log("Export izveštaja","csv","CSV export ("+tasks.length+" taskova)");
    return csv;
  },

  printReport(type){
    const user = AppState.currentUser;
    const all = PermissionService.visibleTasks(user);

    const now = new Date();
    let title="", tasks=all, extra="";

    } else if(type==="nedeljni"){ title="Nedeljni izveštaj";
      tasks = all.filter(t=>new Date(t.updatedAt)>=new Date(Date.now()-7*864e5));
    } else if(type==="mesecni"){ title="Mesečni menadžment izveštaj";
      tasks = all.filter(t=>new Date(t.updatedAt)>=new Date(now.getFullYear(),now.getMonth(),1));
      extra = ReportService.printEmployeeBlock();

      extra = "<h2>Opterećenje po odeljenjima</h2><table><tr><th>Odeljenje</th><th>Otvoreno</th><th>Kasni</th></tr>"+
        ReportService.managementData().byDept.map(d=>"<tr><td>"+esc(d.dept)+"</td><td>"+d.open+"</td><td>"+d.late+"</td></tr>").join("")+"</table>";

    const kpi = (l,v)=>'<div class="p-kpi"><b>'+v+'</b>'+l+'</div>';
    const rowsHtml = tasks.slice(0,80).map(t=>{
      const a = TaskService.userById(t.assignedTo); const d = TaskService.calculateTaskDelay(t);
      return "<tr><td>"+esc(t.title)+"</td><td>"+esc(t.status)+"</td><td>"+esc(t.priority)+"</td><td>"+esc(t.department)+"</td><td>"+esc(TaskService.assigneeNames(t))+"</td><td>"+fmtDate(t.dueDate)+"</td><td>"+(d.late?"KASNI "+d.days+" d":"—")+"</td></tr>";
    }).join("");
    $("#printArea").innerHTML =
      '<div class="p-head"><div><h1>FlowCore — '+esc(title)+'</h1><div>Balkan Transport · Task management sistem</div></div>'+
      '<div style="text-align:right">Generisano: '+fmtDateTime(now.toISOString())+'<br>Korisnik: '+esc(user.name)+'</div></div>'+
      '<div class="p-kpis">'+kpi("Aktivni taskovi",m.totalOpen)+kpi("U kašnjenju",m.late)+kpi("Kritični",m.critical)+kpi("Blokirani",m.blocked)+kpi("Završeno ovog meseca",m.doneThisMonth)+kpi("% na vreme",(m.onTimePct==null?"—":m.onTimePct+"%"))+'</div>'+
      '<p><b>Sažetak:</b> Prosečno vreme prve reakcije: '+fmtHours(m.avgFirstResponseH)+' · Prosečno vreme rešavanja: '+fmtHours(m.avgResolutionH)+' · Taskovi bez odgovorne osobe: '+m.unassigned+'</p>'+extra+
      '<h2 style="margin:12px 0 6px">Taskovi ('+tasks.length+')</h2>'+
      '<table><tr><th>Naziv</th><th>Status</th><th>Prioritet</th><th>Odeljenje</th><th>Odgovorni</th><th>Rok</th><th>Kašnjenje</th></tr>'+rowsHtml+'</table>'+
      '<p style="margin-top:14px;color:#666;font-size:11px">FlowCore v2.6 · Interni dokument Balkan Transport-a.</p>';
    AuditService.log("Export izveštaja","print",title);
    window.print();
  },
  printEmployeeBlock(){
    const em = ReportService.calculateEmployeeMetrics();
    return "<h2>Efikasnost zaposlenih</h2><table><tr><th>Zaposleni</th><th>Otvoreno</th><th>Završeno</th><th>U roku %</th><th>Kasni</th><th>Indeks</th></tr>"+
      em.map(e=>"<tr><td>"+esc(e.user.name)+"</td><td>"+e.open+"</td><td>"+e.done+"</td><td>"+(e.onTimePct==null?"—":e.onTimePct+"%")+"</td><td>"+e.late+"</td><td>"+e.index+"</td></tr>").join("")+"</table>";
  }
};
