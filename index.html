  /* v2.0: dashboard widget prisustva — ko je online sada + ukupno danas */
  async fillPresenceWidget(){
    const el = $("#presenceWidget"); if(!el) return;
    try{
      const rows = await StorageService.fetchPresence(startOfDay(new Date()).toISOString(), new Date().toISOString());
      if(!$("#presenceWidget")) return;
      const byUser = {};
      rows.forEach(r=>{ (byUser[r.user_id]=byUser[r.user_id]||[]).push(new Date(r.seen_at)); });
      const now = Date.now();
      const list = AppState.db.users.map(x=>{
        const pings = (byUser[x.id]||[]).sort((a,b)=>a-b);
        const st = PresenceService.sessionStats(pings);
        const online = st.last && (now - +st.last) <= 6*60*1000;
        return {user:x, st, online};
      }).sort((a,b)=> (b.online-a.online) || ((+(b.st.last||0)) - (+(a.st.last||0))));
      $("#presenceWidget").innerHTML = list.map(r=>'<div class="pres-row"><span class="pres-dot'+(r.online?" on":"")+'"></span>'+avatarHtml(r.user,24)+
        '<span style="flex:1"><b>'+esc(r.user.name)+'</b><span class="small muted"> · '+esc(r.user.department)+'</span></span>'+
        '<span class="small muted">'+(r.st.first?("od "+fmtTime(r.st.first)+" · online "+fmtDur(r.st.totalMs)+(r.online?" · <b style=\'color:var(--mint)\'>online sada</b>":" · posl. "+fmtTime(r.st.last))):"danas nije bio/la online")+'</span></div>').join("");
    }catch(e){
      console.warn("[Prisustvo]", e);
      if($("#presenceWidget")) $("#presenceWidget").innerHTML = '<div class="small muted">Evidencija prisustva nije dostupna — pokreni flowcore_v2.sql (tabela presence_log).</div>';
    }
  },

  /* ---------- LISTA TASKOVA ---------- */
  renderMyTasks(){ UI.renderTaskListPage(true); },
  renderTaskListPage(onlyMine){
    const u = AppState.currentUser;
    const f = AppState.filters;
    if(onlyMine===true) f.quick = "moji";
    if(!AppState.listView) AppState.listView = "phases";
    const view = AppState.listView;
    let tasks = PermissionService.visibleTasks(u, f.status==="Arhivirano");
    /* Završeni i otkazani su po defaultu SKLONJENI iz liste — vraćaju se
       izborom statusa u filteru ili brzim filterom „Završeni“. */
    let doneHidden = false;
    if(f.quick==="zavrseni") tasks = tasks.filter(t=>t.status==="Završeno");
    else if(!f.status){ tasks = tasks.filter(t=>!["Završeno","Otkazano"].includes(t.status)); doneHidden = true; }
    if(f.q) { const q=f.q.toLowerCase(); tasks = tasks.filter(t=>(t.title+" "+t.description+" "+t.tags.join(" ")).toLowerCase().includes(q)); }
    if(f.status) tasks = tasks.filter(t=>t.status===f.status);
    if(f.priority) tasks = tasks.filter(t=>t.priority===f.priority);
    if(f.department) tasks = tasks.filter(t=>t.department===f.department);
    if(f.assignedTo) tasks = tasks.filter(t=>TaskService.isAssignee(t, f.assignedTo));
    if(f.category) tasks = tasks.filter(t=>t.category===f.category);
    if(f.quick==="moji") tasks = tasks.filter(t=>TaskService.isAssignee(t, u.id));
    if(f.quick==="kasni") tasks = tasks.filter(t=>OPEN_STATUSES.includes(t.status) && TaskService.calculateTaskDelay(t).late);
    if(f.quick==="danas") tasks = tasks.filter(t=>t.dueDate && startOfDay(t.dueDate).getTime()===startOfDay(new Date()).getTime());
    if(f.quick==="nedelja") tasks = tasks.filter(t=>{ if(!t.dueDate) return false; const d=startOfDay(t.dueDate), n=startOfDay(new Date()); return d>=n && d<=new Date(n.getTime()+6*864e5); });
    tasks = tasks.slice().sort((a,b)=>{
      let va, vb;
      if(f.sortBy==="dueDate"){ va=a.dueDate||"2100"; vb=b.dueDate||"2100"; }
      else if(f.sortBy==="priority"){ va=PRIORITIES.indexOf(b.priority); vb=PRIORITIES.indexOf(a.priority); }
      else { va=a[f.sortBy]||""; vb=b[f.sortBy]||""; }
      return (va<vb?-1:va>vb?1:0)*f.sortDir;
    });
    UI._lastFiltered = tasks;
    const opt = (arr,cur,all)=>'<option value="">'+all+'</option>'+arr.map(x=>'<option '+(cur===x?"selected":"")+'>'+x+'</option>').join("");
    const chip = (id,label)=>'<button class="chip '+(f.quick===id?"active":"")+'" onclick="UI.setQuick(\''+id+'\')">'+label+'</button>';
    const todayStart = startOfDay(new Date()).getTime();
    const rowOf = t=>{
      const d = TaskService.calculateTaskDelay(t);
      const canEdit = PermissionService.canUserEditTask(u,t), canDel = PermissionService.canUserDeleteTask(u,t);
      const statusSel = UI.statusPill(t, canEdit);
      const isOpen = OPEN_STATUSES.includes(t.status);
      const dd = t.dueDate ? Math.round((startOfDay(t.dueDate).getTime()-todayStart)/864e5) : null;
      const rowCls = (t.priority==="Kritičan"?"row-crit ":t.priority==="Visok"?"row-visok ":"")+(d.late&&isOpen?"row-late":"");
      return '<tr class="st-row st-'+(STATUS_CLASS[t.status]||"novo")+' '+rowCls+'" title="ID '+t.id.slice(0,8)+'">'+
        '<td><span class="t-title" onclick="UI.openTask(\''+t.id+'\')">'+esc(t.title)+'</span>'+(t.comments.length?' <span class="small muted">💬'+t.comments.length+'</span>':"")+'</td>'+
        '<td>'+statusSel+'</td><td>'+UI.priBadge(t.priority)+'</td>'+
        '<td><span class="badge b-dept">'+esc(t.department)+'</span></td>'+
        '<td>'+UI.assigneeCell(t)+'</td>'+
        '<td'+(d.late&&isOpen?' style="color:var(--red);font-weight:700"':"")+'>'+fmtDate(t.dueDate)+'</td>'+
        '<td>'+(d.late?'<span class="badge b-late">+'+d.days+' d</span>'
          :(isOpen&&dd===0?'<span class="badge b-warn">rok danas</span>'
          :(isOpen&&dd===1?'<span class="badge b-warn">sutra</span>':'<span class="badge b-ok">u roku</span>')))+'</td>'+
        '<td><div class="row-actions">'+
          '<button class="btn btn-sm" onclick="UI.openTask(\''+t.id+'\')">Otvori</button>'+
          (canEdit?'<button class="btn btn-sm" onclick="UI.openTaskForm(\''+t.id+'\')">Izmeni</button>':"")+
          (canDel?'<button class="btn btn-sm" style="color:var(--red)" onclick="UI.askArchive(\''+t.id+'\')">Arhiviraj</button>':"")+
        '</div></td></tr>';
    };
    const rows = tasks.map(rowOf).join("");
    const thead = '<thead><tr><th style="cursor:pointer" onclick="UI.sortBy(\'title\')">Naziv ⇅</th><th>Faza</th>'+
      '<th style="cursor:pointer" onclick="UI.sortBy(\'priority\')">Prioritet ⇅</th><th>Odeljenje</th><th>Odgovorni</th>'+
      '<th style="cursor:pointer" onclick="UI.sortBy(\'dueDate\')">Rok ⇅</th><th>Kašnjenje</th><th>Akcije</th></tr></thead>';
    const empty = '<div class="card"><div class="empty"><b>Nema taskova za izabrane filtere</b>Promenite filtere ili kreirajte novi task.</div></div>';
    const body = view==="grouped" ? UI.groupedByEmployee(tasks)
      : view==="phases" ? UI.groupedByPhase(tasks, rowOf, thead)
      : (tasks.length ? '<div class="table-wrap"><table class="tl">'+thead+'<tbody>'+rows+'</tbody></table></div>' : empty);
    $("#pageContent").innerHTML =
      '<div class="page-actions">'+
        '<button class="btn btn-primary" onclick="UI.openTaskForm()">'+ICONS.plus+' Novi task</button>'+
        '<button class="btn" onclick="ReportService.exportTasksCSV(UI._lastFiltered);UI.toast(\'CSV izvezen.\',\'ok\')">Export CSV</button>'+
        '<button class="btn" onclick="ReportService.printReport(\'dnevni\')">Export PDF</button>'+
        '<button class="btn btn-ghost" onclick="UI.resetFilters()">Resetuj filtere</button>'+
        '<span class="view-toggle" style="margin-left:auto">'+
          '<button class="'+(view==="phases"?"active":"")+'" onclick="AppState.listView=\'phases\';UI.go(AppState.page)">Po fazama</button>'+
          '<button class="'+(view==="table"?"active":"")+'" onclick="AppState.listView=\'table\';UI.go(AppState.page)">Tabela</button>'+
          '<button class="'+(view==="grouped"?"active":"")+'" onclick="AppState.listView=\'grouped\';UI.go(AppState.page)">Po zaposlenom</button>'+
        '</span>'+
      '</div>'+
      '<div class="filters">'+
        '<input placeholder="Pretraga..." value="'+esc(f.q)+'" oninput="AppState.filters.q=this.value;UI.debounceList()">'+
        '<select onchange="AppState.filters.status=this.value;UI.go(AppState.page)">'+opt(STATUSES,f.status,"Svi statusi")+'</select>'+
        '<select onchange="AppState.filters.priority=this.value;UI.go(AppState.page)">'+opt(PRIORITIES,f.priority,"Svi prioriteti")+'</select>'+
        '<select onchange="AppState.filters.department=this.value;UI.go(AppState.page)">'+opt(DEPARTMENTS,f.department,"Sva odeljenja")+'</select>'+
        '<select onchange="AppState.filters.category=this.value;UI.go(AppState.page)">'+opt(CATEGORIES,f.category,"Sve kategorije")+'</select>'+
        '<select onchange="AppState.filters.assignedTo=this.value;UI.go(AppState.page)"><option value="">Svi korisnici</option>'+AppState.db.users.map(x=>'<option value="'+x.id+'" '+(f.assignedTo===x.id?"selected":"")+'>'+esc(x.name)+'</option>').join("")+'</select>'+
      '</div>'+
      '<div class="filters">'+chip("","Sve")+chip("moji","Moji taskovi")+chip("kasni","Kasni")+chip("danas","Rok danas")+chip("nedelja","Rok ove nedelje")+chip("zavrseni","Završeni")+'</div>'+
      UI.phaseStrip()+
      (doneHidden?'<div class="note" style="margin-bottom:12px">Završeni i otkazani taskovi su sklonjeni iz prikaza — uključite ih filterom statusa ili brzim filterom „Završeni“.</div>':"")+
      body;
  },
  /* Ćelija „Odgovorni“ — preklopljeni avatari za više osoba */
  assigneeCell(t){
    const asg = TaskService.assigneesOf(t);
    if(!asg.length) return '<span class="muted">—</span>';
    const av = '<span class="avatars">'+asg.slice(0,3).map(x=>avatarHtml(x,22)).join("")+
      (asg.length>3?'<span class="avatar" style="background:#64748b;width:22px;height:22px;font-size:9px">+'+(asg.length-3)+'</span>':"")+'</span>';
    const label = esc(asg[0].name.split(" ")[0])+(asg.length>1?' <span class="muted">+'+(asg.length-1)+'</span>':"");
    return '<span style="display:inline-flex;align-items:center;gap:7px" title="'+esc(asg.map(x=>x.name).join(", "))+'">'+av+'<span class="small">'+label+'</span></span>';
  },
  /* Grupisan prikaz „Po zaposlenom“ — task sa više odgovornih se
     pojavljuje u grupi svake od njih; sortirano po roku. */
  groupedByEmployee(tasks){
    const byDue = list => list.slice().sort((a,b)=>((a.dueDate||"2100")<(b.dueDate||"2100")?-1:1));
    const gRow = t=>{
      const d = TaskService.calculateTaskDelay(t);
      const others = TaskService.assigneesOf(t);
      return '<div class="emp-task'+(t.priority==="Kritičan"?" pri-kritican":t.priority==="Visok"?" pri-visok":"")+'" onclick="UI.openTask(\''+t.id+'\')">'+
        '<span class="emp-due'+(d.late?" late":"")+'">'+fmtDate(t.dueDate)+'</span>'+
        '<span class="emp-title">'+esc(t.title)+(others.length>1?' <span class="small muted">(+'+(others.length-1)+' osoba)</span>':"")+'</span>'+
        '<span class="badge b-dept">'+esc(t.department)+'</span>'+
        UI.statusBadge(t.status)+UI.priBadge(t.priority)+
        (d.late?'<span class="badge b-late">+'+d.days+' d</span>':"")+
      '</div>';
    };
    const groups = AppState.db.users
      .map(x=>({user:x, list:byDue(tasks.filter(t=>TaskService.isAssignee(t,x.id)))}))
      .filter(g=>g.list.length)
      .sort((a,b)=>a.user.name.localeCompare(b.user.name,"sr"));
    const unassigned = byDue(tasks.filter(t=>!TaskService.assigneeIds(t).length));
    if(!groups.length && !unassigned.length) return '<div class="card"><div class="empty"><b>Nema taskova za izabrane filtere</b>Promenite filtere ili kreirajte novi task.</div></div>';
    const section = (headHtml, list)=>'<div class="card emp-group"><div class="emp-head">'+headHtml+'</div>'+list.map(gRow).join("")+'</div>';
    const html = groups.map(g=>{
      const late = g.list.filter(t=>OPEN_STATUSES.includes(t.status) && TaskService.calculateTaskDelay(t).late).length;
      const crit = g.list.filter(t=>t.priority==="Kritičan" && OPEN_STATUSES.includes(t.status)).length;
      return section(
        avatarHtml(g.user,34)+'<span style="flex:1"><b>'+esc(g.user.name)+'</b><span class="small muted"> · '+esc(g.user.department)+'</span></span>'+
        '<span class="badge b-dept">'+g.list.length+' task'+(g.list.length===1?"":"ova")+'</span>'+
        (crit?'<span class="badge b-pri-kritican">'+crit+' krit.</span>':"")+
        (late?'<span class="badge b-late">'+late+' kasni</span>':""),
        g.list);
    }).join("") +
    (unassigned.length ? section(
      '<span class="avatar" style="background:#94a3b8;width:34px;height:34px">—</span><span style="flex:1"><b>Bez odgovorne osobe</b></span><span class="badge b-late">'+unassigned.length+'</span>',
      unassigned) : "");
    return html;
  },
  debounceList(){ clearTimeout(UI._deb); UI._deb = setTimeout(()=>UI.go(AppState.page), 320); },
  setQuick(id){ AppState.filters.quick = (AppState.filters.quick===id && id!=="")?"":id; if(AppState.page==="mytasks"&&id!=="moji") AppState.page="alltasks"; UI.go(AppState.page); },
  sortBy(k){ const f=AppState.filters; if(f.sortBy===k) f.sortDir*=-1; else {f.sortBy=k; f.sortDir=1;} UI.go(AppState.page); },
  resetFilters(){ AppState.filters = {q:"",status:"",priority:"",department:"",assignedTo:"",category:"",quick:"",sortBy:"dueDate",sortDir:1}; const gs=$("#globalSearch"); if(gs) gs.value=""; UI.go(AppState.page); },
  quickStatus(taskId, status){
    const r = TaskService.changeTaskStatus(taskId, status);
    if(!r.ok){ UI.toast(r.errors[0], "err"); }
    else UI.toast("Status promenjen u „"+status+"“.", "ok");
    UI.go(AppState.page);
  },
  askArchive(taskId){

    });
  },

  /* ---------- KANBAN ---------- */
  renderKanban(){
    const u = AppState.currentUser;
    const showDone = !!AppState.kanbanShowDone;
    const tasks = PermissionService.visibleTasks(u).filter(t=>showDone || t.status!=="Završeno");
    const statuses = KANBAN_STATUSES.filter(s=>showDone || s!=="Završeno");
    const todayStartK = startOfDay(new Date()).getTime();
    const cols = statuses.map(s=>{
      const list = tasks.filter(t=>t.status===s)
        .sort((a,b)=>(PRIORITIES.indexOf(b.priority)-PRIORITIES.indexOf(a.priority)) || ((a.dueDate||"2100")<(b.dueDate||"2100")?-1:1));
      const cards = list.map(t=>{
        const asg = TaskService.assigneesOf(t), d = TaskService.calculateTaskDelay(t);
        const canEdit = PermissionService.canUserEditTask(u,t);
        const kbDueToday = !d.late && t.dueDate && startOfDay(t.dueDate).getTime()===todayStartK && OPEN_STATUSES.includes(t.status);
        return '<div class="kb-card'+(t.priority==="Kritičan"?" pri-kritican":t.priority==="Visok"?" pri-visok":"")+'" onclick="UI.openTask(\''+t.id+'\')">'+
          '<div class="kb-title">'+esc(t.title)+'</div>'+
          '<div class="kb-meta">'+UI.priBadge(t.priority)+'<span class="badge b-dept">'+esc(t.department)+'</span>'+
            (d.late?'<span class="badge b-late">kasni +'+d.days+' d</span>':"")+
            (kbDueToday?'<span class="badge b-warn">rok danas</span>':"")+'</div>'+
          '<div class="kb-foot"><span style="display:inline-flex;align-items:center;gap:5px" title="'+esc(asg.map(x=>x.name).join(", ")||"—")+'">'+
            (asg.length?'<span class="avatars">'+asg.slice(0,3).map(x=>avatarHtml(x,22)).join("")+(asg.length>3?'<span class="avatar" style="background:#64748b;width:22px;height:22px;font-size:9px">+'+(asg.length-3)+'</span>':"")+'</span>':avatarHtml(null,22))+
            ' '+fmtDate(t.dueDate)+'</span>'+
            '<span>💬'+t.comments.length+' ☑'+t.checklist.filter(c=>c.done).length+'/'+t.checklist.length+'</span></div>'+
          (canEdit?'<div class="kb-foot" style="margin-top:7px"><span class="small muted">Status:</span><select onclick="event.stopPropagation()" onchange="UI.quickStatus(\''+t.id+'\',this.value)">'+
            STATUSES.filter(x=>x!=="Arhivirano").map(x=>'<option '+(t.status===x?"selected":"")+'>'+x+'</option>').join("")+'</select></div>':"")+
        '</div>';
      }).join("");
      return '<div class="kb-col st-'+STATUS_CLASS[s]+'"><h4>'+esc(s)+'<span class="cnt">'+list.length+'</span></h4>'+(cards||'<div class="empty small">Prazno</div>')+'</div>';
    }).join("");
    $("#pageContent").innerHTML = '<div class="page-actions"><button class="btn btn-primary" onclick="UI.openTaskForm()">'+ICONS.plus+' Novi task</button>'+
      '<button class="btn btn-ghost" style="margin-left:auto" onclick="AppState.kanbanShowDone=!AppState.kanbanShowDone;UI.go(\'kanban\')">'+(showDone?"Sakrij završene":"Prikaži završene")+'</button></div>'+

  /* ---------- KALENDAR ---------- */
  renderCalendar(){
    if(!AppState.calMonth) AppState.calMonth = startOfDay(new Date());
    const u = AppState.currentUser;
    const showDone = !!AppState.calShowDone;
    const tasks = PermissionService.visibleTasks(u).filter(t=>t.dueDate && (showDone || !["Završeno","Otkazano"].includes(t.status)));
    const cur = AppState.calMonth, y = cur.getFullYear(), mo = cur.getMonth();
    const monthNames = ["Januar","Februar","Mart","April","Maj","Jun","Jul","Avgust","Septembar","Oktobar","Novembar","Decembar"];
    const first = new Date(y,mo,1);
    let startDow = (first.getDay()+6)%7; // ponedeljak = 0
    const daysIn = new Date(y,mo+1,0).getDate();
    const todayT = startOfDay(new Date()).getTime();
    let cells = "";
    for(let i=0;i<startDow;i++){ const d = new Date(y,mo,i-startDow+1); cells += '<div class="cal-day other"><span class="d-num">'+d.getDate()+'</span></div>'; }
    for(let d=1;d<=daysIn;d++){
      const dt = new Date(y,mo,d);
      const dayTasks = tasks.filter(t=>startOfDay(t.dueDate).getTime()===dt.getTime());
      const late = dayTasks.some(t=>OPEN_STATUSES.includes(t.status) && TaskService.calculateTaskDelay(t).late);
      const sel = AppState.calSelected && startOfDay(AppState.calSelected).getTime()===dt.getTime();
      cells += '<div class="cal-day'+(dt.getTime()===todayT?" today":"")+(sel?" selected":"")+'" onclick="UI.calSelect('+dt.getTime()+')">'+
        '<span class="d-num">'+d+'</span>'+(dayTasks.length?'<br><span class="cal-pill'+(late?" late":"")+'">'+dayTasks.length+' task'+(dayTasks.length>1?"a":"")+'</span>':"")+'</div>';
    }
    const selTasks = AppState.calSelected ? tasks.filter(t=>startOfDay(t.dueDate).getTime()===startOfDay(AppState.calSelected).getTime()) : [];
    $("#pageContent").innerHTML =
      '<div class="card"><div class="cal-head"><button class="btn btn-sm" onclick="UI.calMove(-1)">‹</button>'+
      '<h3 style="margin:0">'+monthNames[mo]+' '+y+'.</h3><button class="btn btn-sm" onclick="UI.calMove(1)">›</button>'+
      '<button class="btn btn-sm btn-ghost" onclick="AppState.calMonth=startOfDay(new Date());AppState.calSelected=null;UI.go(\'calendar\')">Danas</button>'+
      '<button class="btn btn-sm btn-ghost" style="margin-left:auto" onclick="AppState.calShowDone=!AppState.calShowDone;UI.go(\'calendar\')">'+(showDone?"Sakrij završene":"Prikaži završene")+'</button></div>'+
      '<div class="cal-grid">'+["Pon","Uto","Sre","Čet","Pet","Sub","Ned"].map(d=>'<div class="cal-dow">'+d+'</div>').join("")+cells+'</div></div>'+
      (AppState.calSelected?'<div class="card"><h3>Taskovi za '+fmtDate(new Date(AppState.calSelected).toISOString())+'</h3>'+UI.miniTaskList(selTasks)+'</div>':'<div class="note">Kliknite na dan da vidite taskove sa tim rokom.</div>');
  },
  calMove(n){ const c=AppState.calMonth; AppState.calMonth = new Date(c.getFullYear(), c.getMonth()+n, 1); AppState.calSelected=null; UI.go("calendar"); },
  calSelect(ts){ AppState.calSelected = new Date(ts); UI.go("calendar"); },

  /* ---------- v2.0: PRILOZI (Supabase Storage) ---------- */
  async openAttachment(taskId, attId){
    const t = TaskService.getTask(taskId); if(!t) return;
    const a = t.attachments.find(x=>x.id===attId); if(!a) return;
    if(!a.storagePath){ UI.toast("Ovaj prilog je iz starije verzije — sačuvan je samo naziv, fajl nije otpremljen.","warn",6000); return; }
    try{
      const { data, error } = await sb.storage.from("task-attachments").createSignedUrl(a.storagePath, 3600);
      if(error || !data || !data.signedUrl) throw (error||new Error("nema URL-a"));
      window.open(data.signedUrl, "_blank");
    }catch(e){
      console.error("[Storage]", e);
      UI.toast("Ne mogu da otvorim prilog: "+((e&&e.message)||"greška")+".","err",7000);
    }
  },
  async uploadAttachments(taskId, input){
    const t = TaskService.getTask(taskId);
    if(!t || !input.files || !input.files.length) return;
    const files = [...input.files]; input.value = "";
    const MAX = 10*1024*1024, OKEXT = /\.(jpe?g|png|pdf)$/i;
    let added = 0;
    UI.toast("Otpremanje "+files.length+" fajl(ova)...","",4000);
    for(const f of files){
      if(!OKEXT.test(f.name)){ UI.toast("Preskočeno „"+f.name+"“ — dozvoljeni su JPG, PNG i PDF.","warn",6000); continue; }
      if(f.size > MAX){ UI.toast("Preskočeno „"+f.name+"“ — fajl je veći od 10 MB.","warn",6000); continue; }
      const safe = f.name.replace(/[^\w.\-]+/g,"_").slice(-80);
      const path = t.id+"/"+Date.now()+"_"+safe;
      const up = await sb.storage.from("task-attachments").upload(path, f, {upsert:false, contentType:f.type||undefined});
      if(up.error){
        console.error("[Storage]", up.error);
        UI.toast("Greška pri otpremanju „"+f.name+"“: "+(up.error.message||"")+" — da li je pokrenut flowcore_v2.sql (bucket task-attachments)?","err",9000);
        continue;
      }
      t.attachments.push({id:uid("f"), name:f.name, storagePath:path, addedBy:AppState.currentUser.id, addedAt:new Date().toISOString()});
      added++;
    }
    if(added){
      t.updatedAt = new Date().toISOString();
      StorageService.saveTask(t);
      AuditService.log("Prilog", t.id, added+" fajl(ova) dodato");
      UI.toast(added+" prilog(a) dodato.","ok");
    }
    UI.openTask(taskId);
  },
  deleteAttachment(taskId, attId){
    const t = TaskService.getTask(taskId); if(!t) return;
    const a = t.attachments.find(x=>x.id===attId); if(!a) return;
    UI.confirm('Obrisati prilog „'+a.name+'“?', async()=>{
      if(a.storagePath){
        const rm = await sb.storage.from("task-attachments").remove([a.storagePath]);
        if(rm.error) console.warn("[Storage] remove:", rm.error);
      }
      t.attachments = t.attachments.filter(x=>x.id!==attId);
      t.updatedAt = new Date().toISOString();
      StorageService.saveTask(t);
      AuditService.log("Prilog obrisan", t.id, a.name);
      UI.toast("Prilog obrisan.","ok");
      UI.openTask(taskId);
    });
  },

  /* v2.0: izveštaj o prisustvu po danima i korisnicima */
  async renderPresenceReport(){
    const el = $("#presResult"); if(!el) return;
    el.innerHTML = "Učitavanje...";
    try{
      const fromV = $("#presFrom").value, toV = $("#presTo").value;
      if(!fromV || !toV || fromV > toV){ el.innerHTML = '<div class="login-error">Proverite izabrani period (Od mora biti pre Do).</div>'; return; }
      const from = new Date(fromV+"T00:00:00").toISOString();
      const to = new Date(toV+"T23:59:59").toISOString();
      const userF = $("#presUser").value;
      const rows = await StorageService.fetchPresence(from, to);
      const groups = {};
      rows.forEach(r=>{
        if(userF && r.user_id!==userF) return;
        const k = r.user_id+"|"+dateInput(r.seen_at);
        (groups[k]=groups[k]||[]).push(new Date(r.seen_at));
      });
      const items = Object.keys(groups).map(k=>{
        const parts = k.split("|");
        const pings = groups[k].sort((a,b)=>a-b);
        return {user:TaskService.userById(parts[0]), day:parts[1], st:PresenceService.sessionStats(pings)};
      }).filter(x=>x.user).sort((a,b)=> a.day<b.day?1:a.day>b.day?-1: a.user.name.localeCompare(b.user.name,"sr"));
      UI._presItems = items;
      if(!items.length){ el.innerHTML = '<div class="empty"><b>Nema podataka za izabrani period</b>Evidencija počinje od uvođenja verzije 2.0.</div>'; return; }
      const totals = {};
      items.forEach(x=>{ totals[x.user.id]=totals[x.user.id]||{user:x.user, ms:0, days:0}; totals[x.user.id].ms+=x.st.totalMs; totals[x.user.id].days++; });
      el.innerHTML =
        '<div class="table-wrap" style="margin-bottom:12px"><table style="min-width:0"><thead><tr><th>Datum</th><th>Korisnik</th><th>Prvi put online</th><th>Poslednja aktivnost</th><th>Ukupno online</th><th>Sesija</th></tr></thead><tbody>'+
        items.map(x=>'<tr><td>'+x.day.split("-").reverse().join(".")+'.</td><td>'+esc(x.user.name)+'</td><td>'+fmtTime(x.st.first)+'</td><td>'+fmtTime(x.st.last)+'</td><td><b>'+fmtDur(x.st.totalMs)+'</b></td><td>'+x.st.sessions+'</td></tr>').join("")+
        '</tbody></table></div>'+
        '<h3 style="margin:8px 0 6px">Zbirno po korisniku (izabrani period)</h3>'+
        Object.values(totals).sort((a,b)=>b.ms-a.ms).map(x=>'<div class="rank-row">'+avatarHtml(x.user,24)+'<span style="flex:1"><b>'+esc(x.user.name)+'</b></span><span class="badge b-dept">'+x.days+' dan(a)</span><b>'+fmtDur(x.ms)+'</b></div>').join("");
    }catch(e){
      console.warn("[Prisustvo]", e);
      el.innerHTML = '<div class="login-error">Evidencija prisustva nije dostupna — proveri da li je pokrenut flowcore_v2.sql (tabela presence_log).</div>';
    }
  },
  exportPresenceCSV(){
    const items = UI._presItems||[];
    if(!items.length){ UI.toast("Prvo klikni „Prikaži“ za izabrani period.","warn"); return; }
    const rows = [["Datum","Korisnik","Prvi login","Poslednja aktivnost","Ukupno online (min)","Sesija"]];
    items.forEach(x=>rows.push([x.day, x.user.name, fmtTime(x.st.first), fmtTime(x.st.last), String(Math.round(x.st.totalMs/6e4)), String(x.st.sessions)]));
    const csv = "\uFEFF"+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\r\n");
    const blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download="flowcore_prisustvo_"+dateInput(new Date().toISOString())+".csv";
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    AuditService.log("Export izveštaja","csv","Prisustvo ("+items.length+" redova)");
  },

/* =====================================================================
   TEME (v2.4) — boje za celu firmu, podešava superadmin u Podešavanjima.
   Biraju se samo 3 boje; sve nijanse (hover, aktivno, tekst, značke) se
   izvode automatski i proveravaju na čitljivost (WCAG kontrast).
   Čuva se u tabeli app_settings (key = 'theme'); lokalna kopija u
   pregledaču sprečava „treptanje“ podrazumevanih boja pri učitavanju.
   ===================================================================== */
const ThemeService = {
  KEY:"theme", LS:"fc.theme",
  DEFAULT:{preset:"asfalt", sidebar:"#14213A", accent:"#F2B705", primary:"#2563EB", workspace:"Balkan Transport"},
  PRESETS:[
    {preset:"asfalt",     label:"Asfalt",     note:"Podrazumevana",              sidebar:"#14213A", accent:"#F2B705", primary:"#2563EB"},
    {preset:"autoput",    label:"Autoput",    note:"Zelena kao table auto-puta", sidebar:"#0F4A33", accent:"#F2B705", primary:"#0E7A52"},
    {preset:"magistrala", label:"Magistrala", note:"Plava kao putokazi",         sidebar:"#0B3B78", accent:"#FFC629", primary:"#1D5FD1"},
    {preset:"grafit",     label:"Grafit",     note:"Neutralna i mirna",          sidebar:"#2B3038", accent:"#F59E0B", primary:"#3B5BDB"},
    {preset:"bordo",      label:"Bordo",      note:"Topla i upečatljiva",        sidebar:"#4A1426", accent:"#F4C430", primary:"#B4234A"},
    {preset:"dan",        label:"Dan",        note:"Svetli sidebar",             sidebar:"#EEF2F7", accent:"#E0A100", primary:"#2563EB"}
  ],
  current:null, _ch:null,

  /* ---------- boje ---------- */
  norm(c){
    c = String(c||"").trim();
    if(/^#[0-9a-f]{3}$/i.test(c)) c = "#"+c.slice(1).split("").map(x=>x+x).join("");
    return /^#[0-9a-f]{6}$/i.test(c) ? c.toUpperCase() : null;
  },
  rgb(h){ h = ThemeService.norm(h); return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); },
  hex(a){ return "#"+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("").toUpperCase(); },
  mix(a,b,t){ const x = ThemeService.rgb(a), y = ThemeService.rgb(b); return ThemeService.hex(x.map((v,i)=>v+(y[i]-v)*t)); },
  lum(h){ return ThemeService.rgb(h).map(v=>{ v/=255; return v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); }).reduce((s,v,i)=>s+v*[.2126,.7152,.0722][i],0); },
  contrast(a,b){ const x = ThemeService.lum(a), y = ThemeService.lum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); },
  ink(bg){ return ThemeService.contrast(bg,"#FFFFFF") >= ThemeService.contrast(bg,"#1D2433") ? "#FFFFFF" : "#1D2433"; },
  /* pomera fg ka toward dok ne postigne zadati kontrast sa bg */
  reach(fg, bg, target, toward){
    let c = fg;
    for(let i=0; i<20 && ThemeService.contrast(c,bg) < target; i++) c = ThemeService.mix(c, toward, .12);
    return c;
  },
  rgba(h,a){ const x = ThemeService.rgb(h); return "rgba("+x[0]+","+x[1]+","+x[2]+","+a+")"; },

  /* ---------- 3 boje → ceo sistem nijansi ---------- */
  derive(t){
    const W = "#FFFFFF", K = "#000000", sb = t.sidebar, ac = t.accent, pr = t.primary;
    const dark = ThemeService.lum(sb) < 0.35;
    const toward = dark ? W : K;
    const txt = ThemeService.reach(ThemeService.mix(sb, toward, dark?.76:.70), sb, 7, toward);
    const dim = ThemeService.reach(ThemeService.mix(sb, toward, dark?.50:.48), sb, 4.5, toward);
    return {
      "--asfalt": sb,
      "--asfalt-2": ThemeService.mix(sb, toward, dark?.07:.05),
      "--asfalt-3": ThemeService.mix(sb, toward, dark?.14:.10),
      "--asfalt-line": ThemeService.mix(sb, toward, dark?.10:.09),
      "--side-txt": txt, "--side-dim": dim,
      "--side-strong": dark ? W : ThemeService.mix(sb, K, .88),
      "--navy": dark ? sb : ThemeService.mix(pr, K, .62),
      "--navy-2": dark ? ThemeService.mix(sb, W, .07) : ThemeService.mix(pr, K, .52),
      "--signal": ac, "--signal-ink": ThemeService.ink(ac),
      "--signal-soft": ThemeService.mix(ac, W, .87),
      "--signal-mention": ThemeService.mix(ac, W, .55),
      "--signal-flash": ThemeService.mix(ac, W, .70),
      "--signal-text": ThemeService.reach(ThemeService.mix(ac, K, .35), W, 4.5, K),
      "--blue": pr, "--blue-soft": ThemeService.mix(pr, W, .90),
      "--primary-soft": ThemeService.mix(pr, W, .90),
      "--primary-line": ThemeService.mix(pr, W, .55),
      "--primary-ink": ThemeService.reach(pr, W, 6, K),
      "--primary-ring": ThemeService.rgba(pr, .13)
    };
  },
  /* čitljivost — vraća spisak upozorenja (prazan = sve u redu) */
  check(t){
    const v = ThemeService.derive(t), out = [];
    const cBtn = ThemeService.contrast(t.primary, "#FFFFFF");
    if(cBtn < 4.5) out.push("Beli tekst na dugmadi je slabo čitljiv ("+cBtn.toFixed(1)+":1, treba bar 4,5:1) — izaberite tamniju boju dugmadi.");
    const cAcc = ThemeService.contrast(t.accent, t.sidebar);
    if(cAcc < 1.8) out.push("Boja naglaska se slabo razlikuje od sidebara — značke za nepročitano se neće isticati.");
    if(ThemeService.contrast(t.primary, "#FFFFFF") < 3) out.push("Linkovi i oznake u boji dugmadi biće teški za čitanje na beloj pozadini.");
    return out;
  },
  sanitize(t){
    const d = ThemeService.DEFAULT;
    t = t||{};
    return {
      preset: String(t.preset||"custom").slice(0,20),
      sidebar: ThemeService.norm(t.sidebar)||d.sidebar,
      accent: ThemeService.norm(t.accent)||d.accent,
      primary: ThemeService.norm(t.primary)||d.primary,
      workspace: String(t.workspace==null?d.workspace:t.workspace).trim().slice(0,40) || d.workspace
    };
  },
  presetOf(t){
    const p = ThemeService.PRESETS.find(x=>x.sidebar===t.sidebar && x.accent===t.accent && x.primary===t.primary);
    return p ? p.preset : "custom";
  },
  initials(name){
    const w = String(name||"").trim().split(/\s+/).filter(Boolean);
    return ((w[0]||"F")[0] + ((w[1]||w[0]||"C")[w[1]?0:1]||"")).toUpperCase();
  },

  /* ---------- primena ---------- */
  apply(t, opts){
    opts = opts||{};
    t = ThemeService.sanitize(t);
    const root = document.documentElement, v = ThemeService.derive(t);
    Object.keys(v).forEach(k=>root.style.setProperty(k, v[k]));
    const b = document.querySelector(".sidebar .brand b"); if(b) b.textContent = t.workspace;
    const lm = document.querySelector(".sidebar .brand .logo-mark");
    if(lm){ const ini = ThemeService.initials(t.workspace); lm.innerHTML = esc(ini[0])+'<span>'+esc(ini.slice(1))+'</span>'; }
    if(!opts.preview){
      ThemeService.current = t;
      try{ localStorage.setItem(ThemeService.LS, JSON.stringify(t)); }catch(e){}
    }
    return t;
  },
  applyCached(){
    let t = null;
    try{ t = JSON.parse(localStorage.getItem(ThemeService.LS)||"null"); }catch(e){}
    ThemeService.apply(t || ThemeService.DEFAULT);
  },
  async load(){
    try{
      const r = await sb.from("app_settings").select("*").eq("key", ThemeService.KEY);
      if(r.error){ console.warn("[Tema] app_settings (v2.4 SQL nije pokrenut?):", r.error); return; }
      if(r.data && r.data[0]) ThemeService.apply(r.data[0].value);
    }catch(e){ console.warn("[Tema]", e); }
  },
  start(){
    ThemeService.load();
    if(ThemeService._ch) return;
    try{
      const ch = sb.channel("flowcore-theme");
      ch.on("postgres_changes",{event:"*",schema:"public",table:"app_settings"}, p=>{
        const row = p && (p.new||p.old);
        if(row && row.key===ThemeService.KEY && p.new && p.new.value){
          if(AppState.page==="settings" && UI._themeDraft && UI._themeDirty) return;  /* ne pregazi tuđu izmenu u toku */
          ThemeService.apply(p.new.value);
          if(AppState.page==="settings") UI.go("settings");
        }
      });
      ch.subscribe();
      ThemeService._ch = ch;
    }catch(e){}
  },
  stop(){ if(ThemeService._ch){ try{ sb.removeChannel(ThemeService._ch); }catch(e){} ThemeService._ch = null; } },
  async save(t){
    const u = AppState.currentUser;
    if(!u || u.role!=="superadmin") return {ok:false, error:"Temu menja samo superadmin."};
    t = ThemeService.sanitize(t); t.preset = ThemeService.presetOf(t);
    const r = await sb.from("app_settings").upsert({key:ThemeService.KEY, value:t, updated_by:u.id, updated_at:new Date().toISOString()}, {onConflict:"key"});
    if(r.error) return {ok:false, error:(r.error.message||"Tema nije sačuvana.")+" — da li je pokrenut flowcore_v2.4.sql?"};
    ThemeService.apply(t);
    AuditService.log("Tema", "app_settings", (ThemeService.PRESETS.find(p=>p.preset===t.preset)||{label:"Prilagođena"}).label+" · "+t.sidebar+" / "+t.accent+" / "+t.primary);
    return {ok:true, theme:t};
  }
};

      '</div>'+
      '<div class="th-check" id="thCheck">'+UI.themeCheckHtml(warn)+'</div>'+
      '<div class="page-actions">'+
        '<button class="btn btn-primary" onclick="UI.themeSave()"'+(UI._themeDirty?"":" disabled")+'>Sačuvaj za sve korisnike</button>'+
        (UI._themeDirty?'<button class="btn" onclick="UI.themeDiscard()">Odbaci izmene</button>':"")+
        '<button class="btn btn-ghost" onclick="UI.themePreset(\'asfalt\');UI.themeSet(\'workspace\',\'Balkan Transport\',true)">Vrati podrazumevanu</button>'+
      '</div></div>';
  },
  themeCheckHtml(warn){
    return warn.length
      ? warn.map(w=>'<div class="th-warn">⚠️ '+esc(w)+'</div>').join("")
      : '<div class="th-ok">✓ Čitljivost je u redu — tekst u sidebaru, na dugmadi i u značkama zadovoljava WCAG kontrast.</div>';
  },
  themeRefresh(){
    const card = $("#themeCard"); if(!card) return;
    const keep = document.activeElement && document.activeElement.id;
    const pos = keep && document.activeElement.selectionStart;
    card.outerHTML = UI.themeCardHtml();
    if(keep){ const el = document.getElementById(keep); if(el){ el.focus(); try{ if(pos!=null) el.setSelectionRange(pos,pos); }catch(e){} } }
  },
  themePreset(id){
    const p = ThemeService.PRESETS.find(x=>x.preset===id); if(!p) return;
    Object.assign(UI._themeDraft, {preset:p.preset, sidebar:p.sidebar, accent:p.accent, primary:p.primary});
    UI._themeDirty = true;
    ThemeService.apply(UI._themeDraft, {preview:true});
    UI.themeRefresh();
  },
  themeSet(key, val, fromText){
    if(key==="workspace"){ UI._themeDraft.workspace = String(val).slice(0,40); }
    else{
      const n = ThemeService.norm(val);
      if(!n){ if(fromText){ const el = $("#th_"+key); if(el) el.classList.add("invalid"); } return; }
      UI._themeDraft[key] = n;
    }
    UI._themeDirty = true;
    ThemeService.apply(UI._themeDraft, {preview:true});
    UI.themeRefresh();
  },
  async themeSave(){
    const warn = ThemeService.check(UI._themeDraft);
    const go = async()=>{
      const r = await ThemeService.save(UI._themeDraft);
      if(!r.ok){ UI.toast(r.error,"err",7000); return; }
      UI._themeDraft = null; UI._themeDirty = false;
      UI.toast("Tema je sačuvana za sve korisnike.","ok");
      UI.go("settings");
    };
    if(warn.length) UI.confirm("Tema ima upozorenja o čitljivosti. Sačuvati je ipak?", go); else go();
  },
  themeDiscard(){
    UI._themeDraft = null; UI._themeDirty = false;
    ThemeService.apply(ThemeService.current||ThemeService.DEFAULT, {preview:true});
    UI.go("settings");
  }
});

function plPoruka(n){ const a = n%10, b = n%100; return (a===1 && b!==11) ? "poruka" : (a>=2 && a<=4 && (b<12||b>14)) ? "poruke" : "poruka"; }

const ChatAdmin = {
  list:[],            /* poslednji rezultat chat_admin_channels() */
  isSuper(){ const u = AppState.currentUser; return !!u && u.role==="superadmin"; },
  async rpc(name, args){
    const r = await sb.rpc(name, args||{});
    if(r.error) return {ok:false, error:(r.error.message||"Greška")+(String(r.error.message||"").includes("function")?" — da li je pokrenut flowcore_v2.5.sql?":"")};
    return {ok:true, data:r.data};
  },
  async loadList(){
    const r = await ChatAdmin.rpc("chat_admin_channels");
    if(r.ok) ChatAdmin.list = (r.data||[]).map(x=>Object.assign({}, x, {
      members:Number(x.members)||0, messages:Number(x.messages)||0,
      department:(StorageService.deptById||{})[x.department_id]||""}));
    return r;
  },
  info(cid){ return ChatAdmin.list.find(x=>x.id===cid) || ChatService.S.byId[cid] || null; },
  async members(cid){
    const r = await ChatAdmin.rpc("chat_members", {cid});
    return r.ok ? (r.data||[]).map(x=>({userId:x.user_id, joinedAt:x.joined_at})) : null;
  },
  async after(cid){
    /* posle svake izmene: osveži sidebar, listu i karticu u Podešavanjima */

    ChatUI.renderNav();
    if(ChatAdmin.isSuper()) await ChatAdmin.loadList();
    if(AppState.page==="settings") ChatAdmin.drawCard();
    if(AppState.page==="chat" && ChatService.S.active && !ChatService.S.byId[ChatService.S.active]) UI.go("dashboard");

const CARET = '<svg class="cr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg>';
const lymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pymd = s => { const a = String(s).slice(0,10).split("-").map(Number); return new Date(a[0], a[1]-1, a[2]); };

/* ---------------- (1) STATUSI: dugme + meni + faze ---------------- */
Object.assign(UI, {
  statusPill(t, canEdit){
    const cls = STATUS_CLASS[t.status]||"novo";
    return canEdit
      ? '<button class="st-pill st-'+cls+'" aria-haspopup="menu" onclick="event.stopPropagation();UI.statusMenu(this,\''+t.id+'\')"><i></i>'+esc(t.status)+CARET+'</button>'
      : '<span class="st-pill st-'+cls+'"><i></i>'+esc(t.status)+'</span>';
  },
  statusMenu(btn, taskId){
    const t = TaskService.getTask(taskId); if(!t) return;
    const open = $("#stMenu"); if(open){ const same = open.dataset.id===taskId; UI.closeStatusMenu(); if(same) return; }
    const m = document.createElement("div");
    m.id = "stMenu"; m.className = "st-menu"; m.dataset.id = taskId; m.setAttribute("role","menu");
    m.innerHTML = '<div class="st-menu-h">Promeni fazu</div>'+STATUSES.filter(s=>s!=="Arhivirano").map(s=>
      '<button role="menuitem" class="st-opt st-'+STATUS_CLASS[s]+(s===t.status?" cur":"")+'" data-st="'+esc(s)+'"><i></i>'+esc(s)+(s===t.status?'<span class="st-ok">✓</span>':"")+'</button>').join("");
    document.body.appendChild(m);
    const r = btn.getBoundingClientRect(), h = m.offsetHeight || 300;
    m.style.left = Math.max(8, Math.min(window.innerWidth-230, r.left))+"px";
    m.style.top = (r.bottom+h+8 > window.innerHeight ? Math.max(8, r.top-h-6) : r.bottom+6)+"px";
    m.addEventListener("click", e=>{
      const o = e.target.closest(".st-opt"); if(!o) return;
      e.stopPropagation(); UI.closeStatusMenu();
      if(o.dataset.st!==t.status) UI.quickStatus(taskId, o.dataset.st);
    });
    const f = m.querySelector(".st-opt.cur")||m.querySelector(".st-opt"); if(f) f.focus();
  },
  closeStatusMenu(){ const m = $("#stMenu"); if(m) m.remove(); },
  phaseStrip(){
    const u = AppState.currentUser, f = AppState.filters;
    const all = PermissionService.visibleTasks(u);
    const order = STATUSES.filter(s=>s!=="Arhivirano");
    const cnt = order.map(s=>({s, n:all.filter(t=>t.status===s).length})).filter(x=>x.n);
    const total = cnt.reduce((a,x)=>a+x.n,0); if(!total) return "";
    return '<div class="ph-strip" role="group" aria-label="Raspodela po fazama">'+
      '<div class="ph-bar">'+cnt.map(x=>'<span class="st-'+STATUS_CLASS[x.s]+'" style="flex:'+x.n+'" title="'+esc(x.s)+': '+x.n+'"></span>').join("")+'</div>'+
      '<div class="ph-legend">'+cnt.map(x=>'<button class="ph-chip st-'+STATUS_CLASS[x.s]+(f.status===x.s?" on":"")+'" onclick="AppState.filters.status=(AppState.filters.status===\''+x.s+'\'?\'\':\''+x.s+'\');UI.go(AppState.page)"><i></i>'+esc(x.s)+'<b>'+x.n+'</b></button>').join("")+
      '<span class="ph-total">'+total+' ukupno</span></div></div>';
  },
  groupedByPhase(tasks, rowOf, thead){
    if(!tasks.length) return '<div class="card"><div class="empty"><b>Nema taskova za izabrane filtere</b>Promenite filtere ili kreirajte novi task.</div></div>';
    const col = AppState.phaseCollapsed = AppState.phaseCollapsed || {"Završeno":false,"Otkazano":true};
    return STATUSES.map(s=>({s, list:tasks.filter(t=>t.status===s)})).filter(g=>g.list.length).map(g=>{
      const late = g.list.filter(t=>OPEN_STATUSES.includes(t.status) && TaskService.calculateTaskDelay(t).late).length;
      const crit = g.list.filter(t=>t.priority==="Kritičan" && OPEN_STATUSES.includes(t.status)).length;
      return '<section class="ph-group st-'+STATUS_CLASS[g.s]+(col[g.s]?" collapsed":"")+'" data-ph="'+esc(g.s)+'">'+
        '<button class="ph-head" aria-expanded="'+(!col[g.s])+'" onclick="UI.togglePhase(this)">'+CARET+'<span class="ph-name"><i></i>'+esc(g.s)+'</span>'+
        '<span class="ph-count">'+g.list.length+'</span>'+(crit?'<span class="badge b-pri-kritican">'+crit+' krit.</span>':"")+(late?'<span class="badge b-late">'+late+' kasni</span>':"")+'</button>'+
        '<div class="table-wrap ph-body"><table class="tl">'+thead+'<tbody>'+g.list.map(rowOf).join("")+'</tbody></table></div></section>';
    }).join("");
  },
  togglePhase(btn){
    const g = btn.closest(".ph-group"), s = g.dataset.ph;
    AppState.phaseCollapsed[s] = !AppState.phaseCollapsed[s];
    g.classList.toggle("collapsed", AppState.phaseCollapsed[s]);
    btn.setAttribute("aria-expanded", String(!AppState.phaseCollapsed[s]));
  }
});

/* ---------------- (2) MOJ PROSTOR ---------------- */
const PT = {
  STATUS:[{k:"todo",l:"Za uraditi"},{k:"doing",l:"U toku"},{k:"waiting",l:"Čeka"},{k:"done",l:"Završeno"}],
  PRI:[{k:"none",l:"Bez prioriteta"},{k:"low",l:"Nizak"},{k:"medium",l:"Srednji"},{k:"high",l:"Visok"}],
  COLORS:[{k:"slate",l:"Siva",c:"#64748B"},{k:"blue",l:"Plava",c:"#2563EB"},{k:"teal",l:"Tirkizna",c:"#0D9488"},{k:"green",l:"Zelena",c:"#16A34A"},
          {k:"amber",l:"Narandžasta",c:"#D97706"},{k:"red",l:"Crvena",c:"#DC2626"},{k:"violet",l:"Ljubičasta",c:"#7C3AED"},{k:"pink",l:"Roze",c:"#DB2777"}],
  WORDS:{siva:"slate",sivo:"slate",plava:"blue",plavo:"blue",tirkizna:"teal",zelena:"green",zeleno:"green",narandzasta:"amber",zuta:"amber",
         crvena:"red",crveno:"red",ljubicasta:"violet",roze:"pink",pink:"pink"},
  DAYS:{pon:1,uto:2,sre:3,cet:4,pet:5,sub:6,ned:0},
  MONTHS:["januar","februar","mart","april","maj","jun","jul","avgust","septembar","oktobar","novembar","decembar"],
  WD:["ned","pon","uto","sre","čet","pet","sub"],
  label(list,k){ return (list.find(x=>x.k===k)||list[0]).l; },
  color(k){ return (PT.COLORS.find(x=>x.k===k)||PT.COLORS[0]).c; }
};

const Personal = {
  S:{items:[], loaded:false, ready:false, view:"list", month:null, showWork:true, ch:null, doneOpen:false},

  /* ---------- podaci ---------- */
  map(r){ return {id:r.id, title:r.title, notes:r.notes||"", status:r.status||"todo", priority:r.priority||"none", color:r.color||"slate",
    due:r.due_date?String(r.due_date).slice(0,10):null, time:r.due_time?String(r.due_time).slice(0,5):null,
    completedAt:r.completed_at||null, createdAt:r.created_at||new Date().toISOString(), updatedAt:r.updated_at||null}; },
  row(t){ return {id:t.id, owner_id:AppState.currentUser.id, title:t.title, notes:t.notes, status:t.status, priority:t.priority, color:t.color,
    due_date:t.due||null, due_time:t.time||null, completed_at:t.completedAt||null, updated_at:new Date().toISOString()}; },
  async load(){
    const r = await sb.from("personal_tasks").select("*").order("created_at",{ascending:true});
    if(r.error){ console.warn("[Moj prostor] personal_tasks (v2.6 SQL nije pokrenut?):", r.error); Personal.S.ready = false; Personal.S.loaded = true; return; }
    Personal.S.items = r.data.map(Personal.map); Personal.S.ready = true; Personal.S.loaded = true;
  },
  start(){
    Personal.load().then(()=>{ if(AppState.page==="personal") Personal.render(); if(AppState.page==="dashboard") Personal.fillDash(); });
    if(Personal.S.ch) return;
    try{
      const ch = sb.channel("flowcore-personal");
      ch.on("postgres_changes",{event:"*",schema:"public",table:"personal_tasks"}, p=>Personal.onRemote(p));
      ch.subscribe(); Personal.S.ch = ch;
    }catch(e){}
  },
  stop(){ if(Personal.S.ch){ try{ sb.removeChannel(Personal.S.ch); }catch(e){} } Object.assign(Personal.S,{items:[],loaded:false,ready:false,ch:null}); },
  onRemote(p){
    const S = Personal.S, row = p.new && p.new.id ? p.new : null, old = p.old;
    if(row){ if(row.owner_id && row.owner_id!==AppState.currentUser.id) return;
      const m = Personal.map(row), i = S.items.findIndex(x=>x.id===m.id);
      if(i>=0){ if(S.items[i]._local && Date.now()-S.items[i]._local < 3000) return; S.items[i] = m; } else S.items.push(m);
    } else if(old && old.id){ S.items = S.items.filter(x=>x.id!==old.id); }
    Personal.refresh();
  },
  refresh(){
    if(AppState.page==="personal" && $("#modalWrap").innerHTML==="") Personal.render();
    if(AppState.page==="dashboard") Personal.fillDash();
  },
  get(id){ return Personal.S.items.find(x=>x.id===id); },
  save(t){
    t._local = Date.now();
    const data = Personal.row(t);
    StorageService._enqueue(async()=>{
      const r = await sb.from("personal_tasks").upsert(data, {onConflict:"id"});
      if(r.error) throw r.error;
    }, "lični zadatak");
  },
  create(o){
    const title = String(o.title||"").trim().slice(0,300);
    if(!title) return {ok:false, error:"Upišite naziv zadatka."};
    if(!Personal.S.ready) return {ok:false, error:"Moj prostor još nije uključen — superadmin treba da pokrene flowcore_v2.6.sql."};
    const t = {id:uid(), title, notes:String(o.notes||"").slice(0,5000), status:o.status||"todo", priority:o.priority||"none",
      color:PT.COLORS.some(c=>c.k===o.color)?o.color:"slate", due:o.due||null, time:o.due?(o.time||null):null,
      completedAt:o.status==="done"?new Date().toISOString():null, createdAt:new Date().toISOString()};
    Personal.S.items.push(t); Personal.save(t);
    return {ok:true, task:t};
  },
  update(id, patch){
    const t = Personal.get(id); if(!t) return {ok:false};
    if(patch.title!=null){ patch.title = String(patch.title).trim().slice(0,300); if(!patch.title) return {ok:false, error:"Naziv ne može biti prazan."}; }
    if(patch.status && patch.status!==t.status) patch.completedAt = patch.status==="done" ? new Date().toISOString() : null;
    if(patch.due===null) patch.time = null;
    Object.assign(t, patch); Personal.save(t);
    return {ok:true, task:t};
  },
  remove(id){
    const t = Personal.get(id); if(!t) return;
    Personal.S.items = Personal.S.items.filter(x=>x.id!==id);
    StorageService._enqueue(async()=>{ const r = await sb.from("personal_tasks").delete().eq("id", id); if(r.error) throw r.error; }, "brisanje ličnog zadatka");
    return t;
  },
  toggleDone(id){
    const t = Personal.get(id); if(!t) return;
    const prev = t.status, done = prev!=="done";
    Personal.update(id, {status: done ? "done" : "todo"});
    const row = document.querySelector('.pt-row[data-id="'+id+'"]');
    if(row && done){ row.classList.add("completing"); setTimeout(()=>Personal.refresh(), 420); } else Personal.refresh();
    if(done) Personal.undo("„"+t.title.slice(0,40)+"“ — završeno", ()=>{ Personal.update(id,{status:prev}); Personal.refresh(); });
  },
  undo(text, fn){
    const w = $("#toastWrap"); if(!w) return;
    const el = document.createElement("div"); el.className = "toast ok undo-toast";
    el.innerHTML = '<span>'+esc(text)+'</span><button>Poništi</button>';
    el.querySelector("button").onclick = ()=>{ fn(); el.remove(); };
    w.appendChild(el); setTimeout(()=>el.remove(), 6000);
  },

  /* ---------- brzo dodavanje na srpskom ---------- */
  parse(raw, now){
    now = now||new Date();
    const out = {title:"", due:null, time:null, priority:"none", color:null};
    let t = " "+String(raw||"")+" ";
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const plus = n=>{ const d = new Date(today); d.setDate(d.getDate()+n); return lymd(d); };
    const take = (re, fn)=>{ t = t.replace(re, (...m)=>{ const keep = fn(m); return keep===false ? m[0] : " "; }); };
    take(/\s(!{1,3})(?=\s)/, m=>{ out.priority = ["","low","medium","high"][m[1].length]; });
    take(/\s#([\p{L}]+)(?=\s)/u, m=>{ const k = PT.WORDS[normTxt(m[1])]; if(!k) return false; out.color = k; });
    take(/\s(?:u\s+)?([01]?\d|2[0-3])(?::([0-5]\d)|\s?h)(?=\s)/i, m=>{ out.time = pad(+m[1])+":"+(m[2]||"00"); });
    take(/\s(?:do\s+)?(prekosutra|sutra|danas)(?=\s)/i, m=>{ const w = m[1].toLowerCase(); out.due = plus(w==="danas"?0:w==="sutra"?1:2); });
    take(/\s(?:za\s+)(\d{1,2})\s+dan[a]?(?=\s)/i, m=>{ out.due = plus(+m[1]); });
    take(/\s(?:(?:u|do|za)\s+)?(ponedeljak|ponedeljka|pon|utorak|utorka|uto|sreda|sredu|srede|sre|četvrtak|četvrtka|cetvrtak|cetvrtka|čet|cet|petak|petka|subota|subotu|subote|sub|nedelja|nedelju|nedelje|ned)(?=[\s.,])/iu, m=>{
      const dow = PT.DAYS[normTxt(m[1]).slice(0,3)]; if(dow==null) return false;
      out.due = plus((dow - today.getDay() + 7) % 7);
    });
    take(/\s(\d{1,2})\.(\d{1,2})\.(?:(\d{4})\.?)?(?=\s)/, m=>{
      const d = +m[1], mo = +m[2]; if(d<1||d>31||mo<1||mo>12) return false;
      let y = m[3] ? +m[3] : today.getFullYear();
      let dt = new Date(y, mo-1, d);
      if(!m[3] && dt < today) dt = new Date(y+1, mo-1, d);
      if(dt.getMonth()!==mo-1) return false;
      out.due = lymd(dt);
    });
    out.title = t.replace(/\s+/g," ").trim();
    if(!out.title) out.title = String(raw||"").trim();
    if(out.time && !out.due) out.due = plus(0);
    return out;
  },
  dueLabel(due, time){
    if(!due) return "";
    const d = pymd(due), t0 = new Date(); t0.setHours(0,0,0,0);
    const diff = Math.round((d - t0)/864e5);
    let s = diff===0 ? "Danas" : diff===1 ? "Sutra" : diff===-1 ? "Juče" : (diff>1 && diff<7) ? PT.WD[d.getDay()] : d.getDate()+"."+(d.getMonth()+1)+".";
    return s + (time ? " "+time : "");
  },
  dueClass(t){
    if(!t.due || t.status==="done") return "";
    const today = lymd(new Date());
    return t.due < today ? "late" : t.due===today ? "today" : "";
  },
  previewHtml(p){
    const chips = [];
    if(p.due) chips.push('<span class="qa-chip">📅 '+esc(Personal.dueLabel(p.due, p.time))+'</span>');
    if(p.priority!=="none") chips.push('<span class="qa-chip pri-'+p.priority+'">'+Personal.flag(p.priority)+esc(PT.label(PT.PRI,p.priority))+'</span>');
    if(p.color) chips.push('<span class="qa-chip"><i style="background:'+PT.color(p.color)+'"></i>'+esc(PT.label(PT.COLORS,p.color))+'</span>');
    return chips.length ? chips.join("") : '<span class="qa-hint">Probajte: „Pozovi servis <b>sutra u 14h</b> <b>!!!</b> <b>#crvena</b>“ · rok: danas, sutra, petak, 15.11. · prioritet: ! !! !!!</span>';
  },
  flag(p){ return '<svg class="flag" viewBox="0 0 24 24" fill="currentColor"><path d="M5 21V4h11l-1.5 4L16 12H7v9z"/></svg>'; },

  /* ---------- prikaz ---------- */
  render(){
    const S = Personal.S;
    $("#topbarTitle").innerHTML = '<span class="tt-main">Moj prostor</span><span class="tt-sub">Lični zadaci — vidite ih samo vi; ne ulaze u izveštaje ni skor</span>';
    if(!S.loaded){ $("#pageContent").innerHTML = '<div class="card"><div class="small muted">Učitavanje…</div></div>'; return; }
    if(!S.ready){ $("#pageContent").innerHTML = '<div class="card"><div class="empty"><b>Moj prostor još nije uključen</b>Superadmin treba da pokrene flowcore_v2.6.sql u Supabase SQL Editoru.</div></div>'; return; }
    const tab = (k,l,ico)=>'<button class="'+(S.view===k?"active":"")+'" onclick="Personal.S.view=\''+k+'\';Personal.render()">'+ico+l+'</button>';
    const open = S.items.filter(t=>t.status!=="done");
    const today = lymd(new Date());
    const stats = {late:open.filter(t=>t.due && t.due<today).length, today:open.filter(t=>t.due===today).length, open:open.length};
    $("#pageContent").innerHTML =
      '<div class="pt-wrap">'+
      '<div class="pt-top"><div class="pt-qa">'+
        '<div class="qa-box"><span class="qa-plus">'+ICONS.plus+'</span><input id="ptQuick" maxlength="300" placeholder="Dodaj lični zadatak i pritisni Enter…" autocomplete="off" oninput="Personal.onQuick()" onkeydown="if(event.key===\'Enter\'){event.preventDefault();Personal.addQuick();}">'+
        '<button class="btn btn-primary btn-sm" onclick="Personal.addQuick()">Dodaj</button></div>'+
        '<div class="qa-prev" id="ptPrev">'+Personal.previewHtml(Personal.parse(""))+'</div></div>'+
        '<div class="pt-stats"><span class="'+(stats.late?"late":"")+'"><b>'+stats.late+'</b>prekoračeno</span><span><b>'+stats.today+'</b>danas</span><span><b>'+stats.open+'</b>otvoreno</span></div></div>'+
      '<div class="pt-bar"><span class="view-toggle">'+tab("list","Lista",'')+tab("board","Tabla",'')+tab("cal","Kalendar",'')+'</span>'+
        (S.view==="cal"?'<label class="pt-tog"><input type="checkbox" '+(S.showWork?"checked":"")+' onchange="Personal.S.showWork=this.checked;Personal.render()"> Prikaži i moje radne taskove</label>':"")+
      '</div>'+
      '<div id="ptBody">'+(S.view==="board"?Personal.boardHtml():S.view==="cal"?Personal.calHtml():Personal.listHtml())+'</div></div>';
    if(S.view!=="cal" && !UI.isTouch) setTimeout(()=>{ const q = $("#ptQuick"); if(q && document.activeElement===document.body) q.focus(); }, 20);
  },
  onQuick(){ const v = $("#ptQuick").value; $("#ptPrev").innerHTML = Personal.previewHtml(Personal.parse(v)); },
  addQuick(dueOverride){
    const inp = $("#ptQuick"); if(!inp) return;
    const p = Personal.parse(inp.value);
    if(!inp.value.trim()) return;
    const r = Personal.create({title:p.title, due:dueOverride||p.due, time:p.time, priority:p.priority, color:p.color||"slate"});
    if(!r.ok){ UI.toast(r.error,"warn",5000); return; }
    inp.value = ""; Personal.render(); const q = $("#ptQuick"); if(q) q.focus();
  },
  sorted(list){
    const pr = {high:0, medium:1, low:2, none:3};
    return list.slice().sort((a,b)=>((a.due||"9999")<(b.due||"9999")?-1:(a.due||"9999")>(b.due||"9999")?1:0) || ((a.time||"99")<(b.time||"99")?-1:(a.time||"99")>(b.time||"99")?1:0) || (pr[a.priority]-pr[b.priority]) || (a.createdAt<b.createdAt?-1:1));
  },
  sections(){
    const today = lymd(new Date()), d = new Date(); d.setDate(d.getDate()+1); const tom = lymd(d);
    const w = new Date(); w.setDate(w.getDate()+7); const week = lymd(w);
    const open = Personal.sorted(Personal.S.items.filter(t=>t.status!=="done"));
    const done = Personal.S.items.filter(t=>t.status==="done").sort((a,b)=>(b.completedAt||"")<(a.completedAt||"")?-1:1);
    return [
      {k:"late",  l:"Prekoračeno",  list:open.filter(t=>t.due && t.due<today)},
      {k:"today", l:"Danas",        list:open.filter(t=>t.due===today)},
      {k:"tom",   l:"Sutra",        list:open.filter(t=>t.due===tom)},
      {k:"week",  l:"Ova nedelja",  list:open.filter(t=>t.due && t.due>tom && t.due<=week)},
      {k:"later", l:"Kasnije",      list:open.filter(t=>t.due && t.due>week)},
      {k:"none",  l:"Bez roka",     list:open.filter(t=>!t.due)},
      {k:"done",  l:"Završeno",     list:done}
    ];
  },
  rowHtml(t){
    const dc = Personal.dueClass(t), done = t.status==="done";
    return '<div class="pt-row'+(done?" done":"")+'" data-id="'+t.id+'" style="--ptc:'+PT.color(t.color)+'" onclick="Personal.openFromRow(event,\''+t.id+'\')">'+
      '<button class="pt-check'+(done?" on":"")+'" aria-label="'+(done?"Vrati u otvorene":"Označi kao završeno")+'" onclick="event.stopPropagation();Personal.toggleDone(\''+t.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></button>'+
      '<span class="pt-title">'+esc(t.title)+(t.notes?'<span class="pt-note" title="Ima belešku">≡</span>':"")+'</span>'+
      (t.priority!=="none"?'<span class="pt-pri pri-'+t.priority+'" title="'+esc(PT.label(PT.PRI,t.priority))+'">'+Personal.flag(t.priority)+'</span>':"")+
      (t.status!=="todo"&&!done?'<span class="pt-st s-'+t.status+'">'+esc(PT.label(PT.STATUS,t.status))+'</span>':"")+
      (t.due?'<span class="pt-due '+dc+'">'+esc(Personal.dueLabel(t.due,t.time))+'</span>':"")+
    '</div>';
  },
  listHtml(){
    const S = Personal.S, secs = Personal.sections();
    if(!S.items.length) return '<div class="pt-empty"><div class="pt-empty-ico">✓</div><b>Vaš lični spisak je prazan</b><span>Upišite prvi zadatak iznad — npr. „Produži registraciju za BG-123 petak“. Vidite ga samo vi.</span></div>';
    return secs.filter(s=>s.list.length).map(s=>{
      const isDone = s.k==="done", collapsed = isDone && !S.doneOpen;
      return '<section class="pt-sec s-'+s.k+(collapsed?" collapsed":"")+'"><button class="pt-sec-h" onclick="'+(isDone?"Personal.S.doneOpen=!Personal.S.doneOpen;Personal.render()":"this.parentNode.classList.toggle(\'collapsed\')")+'">'+CARET+'<b>'+s.l+'</b><span>'+s.list.length+'</span></button>'+
        '<div class="pt-sec-b">'+(isDone?s.list.slice(0,30):s.list).map(Personal.rowHtml).join("")+'</div></section>';
    }).join("");
  },
  openFromRow(e, id){ if(e.target.closest("button")) return; Personal.edit(id); },
  boardHtml(){
    return '<div class="pt-board">'+PT.STATUS.map(st=>{
      const list = Personal.sorted(Personal.S.items.filter(t=>t.status===st.k));
      return '<div class="pt-col s-'+st.k+'" ondragover="Personal.over(event)" ondragleave="Personal.leave(event)" ondrop="Personal.dropStatus(event,\''+st.k+'\')">'+
        '<div class="pt-col-h"><i></i><b>'+st.l+'</b><span>'+list.length+'</span><button class="nav-add" title="Dodaj u „'+st.l+'“" onclick="Personal.edit(null,{status:\''+st.k+'\'})">'+ICONS.plus+'</button></div>'+
        list.slice(0, st.k==="done"?25:200).map(t=>'<div class="pt-card" draggable="true" ondragstart="Personal.drag(event,\''+t.id+'\')" onclick="Personal.edit(\''+t.id+'\')" style="--ptc:'+PT.color(t.color)+'">'+
          '<div class="pt-card-t">'+esc(t.title)+'</div><div class="pt-card-m">'+
          (t.due?'<span class="pt-due '+Personal.dueClass(t)+'">'+esc(Personal.dueLabel(t.due,t.time))+'</span>':"")+
          (t.priority!=="none"?'<span class="pt-pri pri-'+t.priority+'">'+Personal.flag(t.priority)+'</span>':"")+'</div></div>').join("")+
        (list.length?"":'<div class="pt-col-empty">Prevucite zadatak ovde</div>')+'</div>';
    }).join("")+'</div>';
  },
  calHtml(){
    const S = Personal.S;
    if(!S.month){ const n = new Date(); S.month = new Date(n.getFullYear(), n.getMonth(), 1); }
    const m0 = S.month, first = new Date(m0.getFullYear(), m0.getMonth(), 1);
    const start = new Date(first); start.setDate(1 - ((first.getDay()+6)%7));   /* nedelja počinje ponedeljkom */
    const today = lymd(new Date()), me = AppState.currentUser;
    const byDay = {};
    S.items.forEach(t=>{ if(t.due) (byDay[t.due] = byDay[t.due]||[]).push({p:t}); });
    if(S.showWork) AppState.db.tasks.filter(t=>!t.isArchived && t.dueDate && TaskService.isAssignee(t, me.id) && t.status!=="Otkazano")
      .forEach(t=>{ const k = lymd(new Date(t.dueDate)); (byDay[k] = byDay[k]||[]).push({w:t}); });
    let cells = "";
    for(let i=0;i<42;i++){
      const d = new Date(start); d.setDate(start.getDate()+i);
      const k = lymd(d), inMonth = d.getMonth()===m0.getMonth();
      const items = (byDay[k]||[]).sort((a,b)=>(a.p?(a.p.time||"99"):"98")<(b.p?(b.p.time||"99"):"98")?-1:1);
      const chips = items.slice(0,4).map(x=> x.p
        ? '<div class="cal-chip'+(x.p.status==="done"?" done":"")+'" draggable="true" ondragstart="Personal.drag(event,\''+x.p.id+'\')" onclick="event.stopPropagation();Personal.edit(\''+x.p.id+'\')" style="--ptc:'+PT.color(x.p.color)+'" title="'+esc(x.p.title)+'">'+(x.p.time?'<em>'+x.p.time+'</em>':"")+esc(x.p.title)+'</div>'
        : '<div class="cal-chip work st-'+STATUS_CLASS[x.w.status]+'" onclick="event.stopPropagation();UI.openTask(\''+x.w.id+'\')" title="Radni task: '+esc(x.w.title)+' ('+esc(x.w.status)+')">'+esc(x.w.title)+'</div>').join("")+
        (items.length>4?'<button class="cal-more" onclick="event.stopPropagation();Personal.dayList(\''+k+'\')">+'+(items.length-4)+' još</button>':"");
      cells += '<div class="cal-day'+(inMonth?"":" out")+(k===today?" today":"")+((d.getDay()+6)%7>4?" we":"")+'" data-day="'+k+'" onclick="Personal.edit(null,{due:\''+k+'\'})" ondragover="Personal.over(event)" ondragleave="Personal.leave(event)" ondrop="Personal.dropDay(event,\''+k+'\')">'+
        '<span class="cal-n">'+d.getDate()+'</span>'+chips+'</div>';
    }
    return '<div class="pt-cal"><div class="cal-head"><button class="icon-btn sm" aria-label="Prethodni mesec" onclick="Personal.shift(-1)">‹</button>'+
      '<b>'+PT.MONTHS[m0.getMonth()]+' '+m0.getFullYear()+'</b><button class="icon-btn sm" aria-label="Sledeći mesec" onclick="Personal.shift(1)">›</button>'+
      '<button class="btn btn-sm" onclick="Personal.S.month=null;Personal.render()">Danas</button>'+
      '<span class="cal-leg"><i class="lg-p"></i>lični <i class="lg-w"></i>radni</span></div>'+
      '<div class="cal-grid">'+["pon","uto","sre","čet","pet","sub","ned"].map(x=>'<div class="cal-wd">'+x+'</div>').join("")+cells+'</div>'+
      '<p class="small muted" style="margin-top:8px">Klik na dan dodaje lični zadatak za taj dan. Lične zadatke prevucite na drugi dan da promenite rok.</p></div>';
  },
  shift(n){ const m = Personal.S.month; Personal.S.month = new Date(m.getFullYear(), m.getMonth()+n, 1); Personal.render(); },
  dayList(k){
    const d = pymd(k), list = Personal.S.items.filter(t=>t.due===k);
    const work = AppState.db.tasks.filter(t=>!t.isArchived && t.dueDate && lymd(new Date(t.dueDate))===k && TaskService.isAssignee(t, AppState.currentUser.id));
    UI.modal('<header><h2>'+d.getDate()+'. '+PT.MONTHS[d.getMonth()]+'</h2><button class="btn btn-sm" onclick="UI.closeModal()">✕</button></header><div class="modal-body">'+
      list.map(Personal.rowHtml).join("")+work.map(t=>'<div class="pt-row work" onclick="UI.openTask(\''+t.id+'\')">'+UI.statusPill(t,false)+'<span class="pt-title">'+esc(t.title)+'</span></div>').join("")+'</div>');
  },
  /* prevlačenje */
  drag(e, id){ e.dataTransfer.setData("text/plain", id); e.dataTransfer.effectAllowed = "move"; e.stopPropagation(); },
  over(e){ e.preventDefault(); e.currentTarget.classList.add("drop"); },
  leave(e){ e.currentTarget.classList.remove("drop"); },
  dropDay(e, k){ e.preventDefault(); e.stopPropagation(); e.currentTarget.classList.remove("drop");
    const id = e.dataTransfer.getData("text/plain"); const t = Personal.get(id); if(!t || t.due===k) return;
    Personal.update(id, {due:k}); Personal.render(); UI.toast("Rok pomeren na "+Personal.dueLabel(k, t.time)+".","ok"); },
  dropStatus(e, st){ e.preventDefault(); e.currentTarget.classList.remove("drop");
    const id = e.dataTransfer.getData("text/plain"); const t = Personal.get(id); if(!t || t.status===st) return;
    Personal.update(id, {status:st}); Personal.render(); },

  /* ---------- detalj / izmena ---------- */
  edit(id, preset){
    const t = id ? Personal.get(id) : Object.assign({title:"", notes:"", status:"todo", priority:"none", color:"slate", due:null, time:null}, preset||{});
    if(!t) return;
    Personal._draft = Object.assign({}, t); Personal._editId = id||null;
    const seg = (key, list, extra)=>'<div class="seg" role="radiogroup">'+list.map(x=>'<button type="button" role="radio" aria-checked="'+(t[key]===x.k)+'" class="'+(t[key]===x.k?"on ":"")+(extra?extra(x):"")+'" onclick="Personal.pick(\''+key+'\',\''+x.k+'\',this)">'+(key==="priority"&&x.k!=="none"?Personal.flag(x.k):"")+esc(x.l)+'</button>').join("")+'</div>';
    UI.modal('<header><h2>'+(id?"Lični zadatak":"Novi lični zadatak")+'</h2><button class="btn btn-sm" onclick="UI.closeModal()">✕</button></header>'+
      '<div class="modal-body pt-edit">'+
        '<input id="peTitle" class="pe-title" maxlength="300" placeholder="Šta treba uraditi?" value="'+esc(t.title)+'">'+
        '<div class="pe-grid">'+
          '<label>Status</label>'+seg("status", PT.STATUS, x=>"s-"+x.k)+
          '<label>Prioritet</label>'+seg("priority", PT.PRI, x=>"pri-"+x.k)+
          '<label>Boja</label><div class="sw">'+PT.COLORS.map(c=>'<button type="button" class="'+(t.color===c.k?"on":"")+'" style="--c:'+c.c+'" title="'+c.l+'" aria-label="'+c.l+'" onclick="Personal.pick(\'color\',\''+c.k+'\',this)"></button>').join("")+'</div>'+
          '<label>Rok</label><div class="pe-due"><input type="date" id="peDue" value="'+(t.due||"")+'"><input type="time" id="peTime" value="'+(t.time||"")+'"><button type="button" class="btn btn-sm btn-ghost" onclick="$(\'#peDue\').value=\'\';$(\'#peTime\').value=\'\'">Bez roka</button></div>'+
          '<label>Beleška</label><textarea id="peNotes" rows="4" maxlength="5000" placeholder="Detalji, brojevi, kontakti…">'+esc(t.notes||"")+'</textarea>'+
        '</div>'+
        '<p class="small muted pe-priv">🔒 Vidite samo vi. Lični zadaci ne ulaze u izveštaje, skor ni obaveštenja.</p>'+
      '</div>'+
      '<footer>'+(id?'<button class="btn btn-danger-o" style="margin-right:auto" onclick="Personal.askRemove(\''+id+'\')">Obriši</button><button class="btn" onclick="Personal.toWork(\''+id+'\')">Pretvori u radni task</button>':"")+
        '<button class="btn" onclick="UI.closeModal()">Otkaži</button><button class="btn btn-primary" onclick="Personal.commit()">Sačuvaj</button></footer>', {static:true});
    const ti = $("#peTitle"); setTimeout(()=>{ ti.focus(); ti.setSelectionRange(ti.value.length, ti.value.length); }, 30);
    $("#modalWrap").querySelector(".pt-edit").addEventListener("keydown", e=>{ if(e.key==="Enter" && (e.ctrlKey||e.metaKey || e.target.id==="peTitle")){ e.preventDefault(); Personal.commit(); } });
  },
  pick(key, val, btn){
    Personal._draft[key] = val;
    btn.parentNode.querySelectorAll("button").forEach(b=>{ b.classList.toggle("on", b===btn); if(b.hasAttribute("aria-checked")) b.setAttribute("aria-checked", String(b===btn)); });
  },
  commit(){
    const d = Personal._draft;
    const patch = {title:$("#peTitle").value, notes:$("#peNotes").value, status:d.status, priority:d.priority, color:d.color,
      due:$("#peDue").value||null, time:$("#peDue").value ? ($("#peTime").value||null) : null};
    const r = Personal._editId ? Personal.update(Personal._editId, patch) : Personal.create(patch);
    if(!r.ok){ UI.toast(r.error||"Greška.","warn"); return; }
    UI.closeModal(); Personal.refresh();
    if(AppState.page!=="personal" && AppState.page!=="dashboard") UI.toast("Lični zadatak sačuvan.","ok");
  },
  askRemove(id){
    const t = Personal.get(id); if(!t) return;
    UI.closeModal();
    const removed = Personal.remove(id); Personal.refresh();
    Personal.undo("„"+t.title.slice(0,40)+"“ obrisan", ()=>{ Personal.S.items.push(removed); Personal.save(removed); Personal.refresh(); });
  },
  toWork(id){
    const t = Personal.get(id); if(!t) return;
    UI.closeModal(); UI.openTaskForm();
    setTimeout(()=>{
      if($("#fTitle")) $("#fTitle").value = t.title;
      if($("#fDesc")) $("#fDesc").value = t.notes||"";
      ["fDue","fDueDate"].forEach(fid=>{ const el = document.getElementById(fid); if(el && t.due){ el.value = el.type==="datetime-local" ? t.due+"T"+(t.time||"16:00") : t.due; } });
      UI.toast("Popunite odgovornu osobu i sačuvajte — lični zadatak ostaje dok ga ne obrišete.","",6000);
    }, 40);
  },

  /* ---------- Dashboard: Moj dan ---------- */
  dashCardHtml(){ setTimeout(()=>Personal.fillDash(), 0); return '<div class="card" id="ptDash"><h3>☀️ Moj dan <span class="small muted" style="font-weight:400">— lično, vidite samo vi</span></h3><div class="small muted">Učitavanje…</div></div>'; },
  fillDash(){
    const el = $("#ptDash"); if(!el) return;
    const S = Personal.S;
    if(!S.loaded) return;
    if(!S.ready){ el.remove(); return; }
    const today = lymd(new Date());
    const list = Personal.sorted(S.items.filter(t=>t.status!=="done" && t.due && t.due<=today)).slice(0,6);
    el.innerHTML = '<h3 style="display:flex;align-items:center;gap:8px">☀️ Moj dan <span class="small muted" style="font-weight:400;flex:1">— lično, vidite samo vi</span><button class="btn btn-sm" onclick="UI.go(\'personal\')">Otvori Moj prostor</button></h3>'+
      (list.length ? list.map(Personal.rowHtml).join("") : '<div class="small muted">Za danas nema ličnih zadataka. <a href="javascript:void(0)" onclick="UI.go(\'personal\')">Dodaj jedan</a>.</div>');
  }
};

/* =====================================================================
   INIT
   ===================================================================== */
async function initApp(){
  document.addEventListener("click", e=>{
    const p = $("#notifPanel");
    if(p && !p.classList.contains("hidden") && !p.contains(e.target) && !e.target.closest(".icon-btn")) p.classList.add("hidden");
  });
  try{
    if(await AuthService.restoreSession()){
      await DataService.loadData();
      UI.enterApp();
    } else {
      UI.renderLogin();
    }
  }catch(e){
    console.error(e);
    UI.renderLogin();
    const el = $("#loginError");
    el.textContent = "Greška pri povezivanju sa Supabase bazom. Proveri SUPABASE_URL / SUPABASE_ANON_KEY i internet konekciju.";
    el.classList.remove("hidden");
  }
}
// Globalni pristup za konzolu/testove
window.App = {AppState, DataService, AuthService, PermissionService, TaskService, ReportService, NotificationService, AuditService, UI, initApp};
window.UI = UI;
document.addEventListener("DOMContentLoaded", initApp);
</script>

<!-- =====================================================================
SUPABASE PLAN — SQL šema i uputstvo
>>> STATUS v2.0: MIGRACIJA ZAVRŠENA — aplikacija radi nad Supabase bazom.
    Koraci 1-6 ispod su ODRAĐENI i ostaju kao dokumentacija/šema za obnovu.
    Sledeći koraci: RLS politike (fajl flowcore_rls.sql), pa Storage bucket
    "task-attachments" za prave priloge (sada je prilog samo naziv fajla).

1) Napraviti projekat na supabase.com (Free Tier), uneti URL i anon key
   u konstante SUPABASE_URL / SUPABASE_ANON_KEY na vrhu skript bloka.
2) Dodati skript tag: src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
3) U StorageService zameniti localStorage pozive Supabase upitima —
   interfejs read/write ostaje isti, ostatak aplikacije se ne menja.
4) Login: AuthService.loginUser -> supabase.auth.signInWithPassword.
   Test lozinke iz seed-a se tada uklanjaju iz tabele users.
5) Prilozi: umesto naziva fajla, upload u Supabase Storage bucket
   'task-attachments' i čuvanje putanje u task_attachments.storage_path.

-- ===================== SQL ŠEMA =====================
create table departments (
  id uuid primary key default gen_random_uuid(),
  name text not null unique
);
create table categories (
  id uuid primary key default gen_random_uuid(),
  name text not null unique
);
create table users (
  id uuid primary key references auth.users(id),
  name text not null,
  email text not null unique,
  role text not null check (role in ('superadmin','menadzment','teamlead','dispecer','finansije','voznipark')),
  department_id uuid references departments(id),
  color text,
  created_at timestamptz default now()
);
create table tasks (
  id uuid primary key default gen_random_uuid(),
  title text not null,
  description text default '',
  department_id uuid references departments(id),
  category_id uuid references categories(id),
  status text not null default 'Novo',
  priority text not null default 'Normalan',
  created_by uuid references users(id),
  assigned_to uuid references users(id),
  created_at timestamptz default now(),
  updated_at timestamptz default now(),
  due_date timestamptz,
  started_at timestamptz,
  first_response_at timestamptz,
  completed_at timestamptz,
  estimated_minutes int,
  actual_minutes int,
  tags text[] default '{}',
  blocked_reason text default '',
  waiting_for text default '',
  is_archived boolean default false
);
create table task_participants (
  task_id uuid references tasks(id) on delete cascade,
  user_id uuid references users(id) on delete cascade,
  primary key (task_id, user_id)
);
create table task_comments (
  id uuid primary key default gen_random_uuid(),
  task_id uuid references tasks(id) on delete cascade,
  user_id uuid references users(id),
  text text not null,
  internal boolean default false,
  created_at timestamptz default now()
);
create table task_checklist (
  id uuid primary key default gen_random_uuid(),
  task_id uuid references tasks(id) on delete cascade,
  label text not null,
  done boolean default false,
  required boolean default false,
  position int default 0
);
create table task_attachments (
  id uuid primary key default gen_random_uuid(),
  task_id uuid references tasks(id) on delete cascade,
  name text not null,
  storage_path text,          -- putanja u Supabase Storage bucket-u
  added_by uuid references users(id),
  added_at timestamptz default now()
);
create table notifications (
  id uuid primary key default gen_random_uuid(),
  user_id uuid references users(id) on delete cascade,
  task_id uuid references tasks(id) on delete set null,
  text text not null,
  read boolean default false,
  created_at timestamptz default now()
);
create table audit_logs (
  id uuid primary key default gen_random_uuid(),
  at timestamptz default now(),
  user_id uuid references users(id),
  action text not null,
  entity text,
  details text
);
create table time_logs (
  id uuid primary key default gen_random_uuid(),
  task_id uuid references tasks(id) on delete cascade,
  user_id uuid references users(id),
  minutes int not null,
  note text,
  created_at timestamptz default now()
);
