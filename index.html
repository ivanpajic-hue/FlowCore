<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowCore — Task management sistem za Balkan Transport</title>
<!--
  FlowCore v1.3.0
  Task management sistem za Balkan Transport
  Jedan fajl: HTML + CSS + JS, Supabase (PostgreSQL + Auth) kao online baza.
  v2.0 — migrirano sa localStorage na Supabase (SQL šema u komentaru na dnu fajla).
  v1.3.0 — više odgovornih osoba po tasku (primarna = assigned_to, dodatne =
           task_participants, BEZ izmene SQL šeme); Chart.js 4.4.1 (grafikoni
           su ranije bili prazni jer biblioteka nije bila učitana); redizajn
           dashboarda (donut sa ukupnim brojem, horizontalni barovi, rok danas);
           task forma se ne zatvara klikom pored modala; završeni/otkazani
           taskovi po defaultu sklonjeni iz liste/kanbana/kalendara (vraćaju se
           filterom ili toggle-om); prikaz "Po zaposlenom" u listi taskova;
           PDF export u landscape; iz forme uklonjeni Učesnici i Prilozi.
  v2.0   — evidencija online prisustva (tabela presence_log: ping na 5 min,
           widget na dashboardu + izveštaj po datumima, samo menadžment);
           pravi prilozi kroz Supabase Storage (JPG/PNG/PDF do 10 MB, bucket
           task-attachments, signed URL); isticanje prioriteta (kolorne ivice,
           pulsirajući "Kritičan", sortiranje kanbana); upozorenja na rok
           (danas / sutra / prekoračen + periodična provera); podsetnici sa
           evidencijom (tabela task_reminders: ručni + automatski 24h pre roka
           i na dan roka); Supabase Realtime — izmene kolega bez F5.
           >>> PRE KORIŠĆENJA pokrenuti flowcore_v2.sql u SQL Editoru. <<<
  v2.1   — sistem znakova (skor): tabela score_marks; ručni znakovi 👍/👎 uz
           OBAVEZAN razlog (min 10 znakova, 1 znak dnevno po kolegi, max 3
           dnevno ukupno, nije anonimno); automatski −1 za prijavu posle
           08:10 radnim danom i za task neizvršen 48h posle roka (blokirani
           i taskovi koji čekaju odgovor su izuzeti); skor tabla na
           dashboardu sa izborom perioda (podrazumevano tekući mesec) —
           menadžment/superadmin vide sve, zaposleni samo svoj tekući mesec
           sa razlozima; dedupe kroz ref_key (unique) u bazi.
           >>> PRE KORIŠĆENJA pokrenuti i flowcore_v2.1.sql. <<<
  v2.2   — promenjeno pravilo automatskog negativnog znaka: umesto kasne
           prijave (posle 08:10) sada se kažnjava DAN BEZ IJEDNE PRIJAVE u
           radnom vremenu (pon–pet, 08:00–16:00). Dan se ocenjuje tek kada
           se završi; praznici se preskaču kroz SCORE.HOLIDAYS; radnik ne
           dobija znak za dane pre svog unosa u sistem; proveru pokreće
           isključivo menadžment/superadmin (zaposleni po RLS-u ne vidi tuđe
           prisustvo). Dodato UKIDANJE znaka (godišnji, bolovanje, praznik,
           greška) — znak ostaje u evidenciji sa razlogom, ali se ne računa
           u skor.
           >>> PRE KORIŠĆENJA pokrenuti i flowcore_v2.2.sql. <<<
  v2.3   — PORUKE + REDIZAJN: kanali (#opste + po jedan za svako odeljenje,
           nove otvara menadžment/team lead), direktne poruke, niti, reakcije,
           @pominjanja sa notifikacijom, izmena/brisanje svojih poruka, „piše…“,
           nepročitano i pominjanja u sidebaru i naslovu taba, desktop
           obaveštenja, brza pretraga Ctrl/⌘+K (kanali, ljudi, taskovi,
           stranice i pretraga poruka), task ↔ poruka (podeli task u kanal,
           napravi task iz poruke, objava u kanalu odeljenja kad se task
           kreira/završi). Bezbednost u bazi: RLS + security definer funkcije
           (DM vide samo učesnici). Redizajn: asfalt sidebar, signalna žuta
           za ono što traži pažnju, IBM Plex Sans.
           >>> PRE KORIŠĆENJA pokrenuti i flowcore_v2.3.sql. <<<
  v2.4   — TEME: superadmin u Podešavanjima → Izgled bira jednu od 6 tema
           (Asfalt, Autoput, Magistrala, Grafit, Bordo, Dan) ili 3 svoje boje
           (sidebar, naglasak, dugmad) + naziv u sidebaru. Sve nijanse se
           izvode automatski uz WCAG proveru čitljivosti; pregled uživo pre
           čuvanja; tema važi za sve i stiže prijavljenima bez osvežavanja.
           Tabela app_settings (čita svako, menja samo superadmin).
           >>> PRE KORIŠĆENJA pokrenuti i flowcore_v2.4.sql. <<<
  v2.5   — KANALI: privatni kanali (vide ih samo članovi); superadmin u
           Podešavanjima → Kanali i u zaglavlju kanala vidi članove, ubacuje
           i izbacuje ih, pretvara kanal javni ↔ privatni, arhivira/vraća i
           trajno briše (uz potvrdu upisom naziva). Zaglavlje kanala prikazuje
           broj članova. Ubačen/izbačen korisnik odmah dobija/gubi kanal.
           Baza: u arhivirani kanal se ne piše; superadmin NE čita poruke
           privatnog kanala u kome nije član; #opste je zaštićen.
           >>> PRE KORIŠĆENJA pokrenuti i flowcore_v2.5.sql. <<<
  v2.6   — MOJ PROSTOR: lični zadaci (tabela personal_tasks, vidi ih samo
           vlasnik — ni superadmin; ne ulaze u izveštaje, skor, znakove,
           kanale ni obaveštenja). Lista sa pametnim grupama, tabla i
           mesečni kalendar (sa mojim radnim taskovima), prevlačenje,
           brzo dodavanje na srpskom („sutra u 14h !!! #crvena“), boje,
           prioriteti, statusi, poništavanje, „Moj dan“ na Dashboardu.
           REDIZAJN LISTE: boja po fazi (traka + podloga reda), statusno
           dugme sa menijem, prikaz „Po fazama“ (podrazumevan), traka
           raspodele faza sa filterom, obojene kolone kanbana.
           >>> PRE KORIŠĆENJA pokrenuti i flowcore_v2.6.sql. <<<
-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0e1b33; --navy-2:#16274a; --blue:#2563eb; --blue-soft:#e8effd;
  --mint:#10b981; --mint-soft:#e7f8f1; --amber:#f59e0b; --amber-soft:#fdf3e0;
  --red:#ef4444; --red-soft:#fdeaea; --violet:#7c3aed;
  --bg:#f4f6fa; --card:#ffffff; --line:#e5e9f0;
  --text:#1e293b; --muted:#64748b; --radius:12px;
  --shadow:0 1px 3px rgba(15,27,51,.07),0 6px 18px rgba(15,27,51,.05);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
a{color:var(--blue);text-decoration:none}
h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}

/* ---------- LOGIN ---------- */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy) 0%,#1a3a6b 60%,#2563eb 130%);padding:20px}
.login-card{background:var(--card);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:100%;max-width:440px;padding:36px 32px}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo-mark{width:42px;height:42px;border-radius:11px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;letter-spacing:-.5px}
.logo-mark span{color:#5ea0ff}
.login-card h1{font-size:24px;letter-spacing:-.4px}
.login-sub{color:var(--muted);margin:2px 0 24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fbfcfe;outline:none;transition:border .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--primary-ring);background:#fff}
.btn{border:none;border-radius:9px;padding:10px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;transition:filter .12s,transform .05s;background:#eef1f6;color:var(--text)}
.btn:hover{filter:brightness(.96)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--blue);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:7px}
.btn-block{width:100%;justify-content:center}
.quick-users{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.quick-users p{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px}
.quick-user{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:7px}
.quick-user:hover{border-color:var(--blue);background:var(--blue-soft)}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.quick-user b{display:block;font-size:13px}
.quick-user span{font-size:11.5px;color:var(--muted)}
.login-error{background:var(--red-soft);color:#b91c1c;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px}

/* ---------- APP SHELL ---------- */
#appShell{display:flex;min-height:100vh}
.sidebar{width:236px;background:var(--navy);color:#c6d2e8;flex:none;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40;overflow-y:auto}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;color:#fff}
.sidebar .brand b{font-size:16px;letter-spacing:-.3px}
.sidebar .brand small{display:block;font-size:10.5px;color:#8fa3c8;font-weight:400}
.nav-group{padding:6px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#5f7398;margin-top:8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 14px;margin:1px 8px;border-radius:8px;color:#c6d2e8;background:none;border:none;width:calc(100% - 16px);text-align:left;font-size:13.5px;font-weight:500}
.nav-item svg{width:17px;height:17px;flex:none;opacity:.8}
.nav-item:hover{background:var(--navy-2);color:#fff}
.nav-item.active{background:var(--blue);color:#fff}
.sidebar .side-footer{margin-top:auto;padding:14px;border-top:1px solid #1d2f55;font-size:12px;color:#7d92b8}
.main{flex:1;margin-left:236px;display:flex;flex-direction:column;min-width:0}

/* topbar */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 22px;min-height:58px}
.topbar h1{font-size:18px;letter-spacing:-.3px;white-space:nowrap}
.topbar .spacer{flex:1}
.search-wrap{position:relative;flex:0 1 320px}
.search-wrap input{width:100%;border:1px solid var(--line);border-radius:20px;padding:8px 14px 8px 34px;background:#f7f9fc;outline:none}
.search-wrap input:focus{border-color:var(--blue);background:#fff}
.search-wrap svg{position:absolute;left:11px;top:9px;width:15px;height:15px;color:var(--muted)}
.icon-btn{position:relative;background:#f2f5f9;border:1px solid var(--line);border-radius:50%;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center}
.icon-btn svg{width:17px;height:17px}
.notif-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.topbar .me{display:flex;align-items:center;gap:9px;background:none;border:none;padding:4px 6px;border-radius:9px}
.topbar .me:hover{background:#f2f5f9}
.topbar .me b{font-size:13px}
.topbar .me span:not(.avatar){display:block;font-size:11px;color:var(--muted)}

/* notifications panel */
.notif-panel{position:absolute;top:54px;right:20px;width:340px;max-height:420px;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:60}
.notif-panel header{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);font-weight:600}
.notif-item{padding:10px 14px;border-bottom:1px solid #f0f3f8;font-size:13px;display:flex;gap:9px;cursor:pointer}
.notif-item:hover{background:#f7f9fc}
.notif-item.unread{background:var(--blue-soft)}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:5px;flex:none}
.notif-item.read .notif-dot{background:#cbd5e1}
.notif-item time{display:block;font-size:11px;color:var(--muted);margin-top:2px}

/* content */
.content{padding:22px;max-width:1400px;width:100%;margin:0 auto}
.page-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.grid-kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:13px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .k-label{font-size:12px;color:var(--muted);font-weight:600}
.kpi .k-value{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:3px}
.kpi .k-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
.kpi.k-mint::before{background:var(--mint)}.kpi.k-amber::before{background:var(--amber)}
.kpi.k-red::before{background:var(--red)}.kpi.k-navy::before{background:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
.card h3{margin-bottom:12px;display:flex;align-items:center;gap:8px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.chart-box{position:relative;height:240px}
.css-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px}
.css-bar-row .lbl{width:120px;flex:none;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.css-bar-track{flex:1;background:#eef1f6;border-radius:6px;height:16px;overflow:hidden}
.css-bar-fill{height:100%;border-radius:6px;background:var(--blue);min-width:2px}
.css-bar-row .val{width:34px;text-align:right;font-weight:700}
/* ---------- preklopljeni avatari (više odgovornih) ---------- */
.avatars{display:inline-flex;align-items:center}
.avatars .avatar{border:2px solid #fff;margin-left:-7px}
.avatars .avatar:first-child{margin-left:0}
/* ---------- prekidač prikaza liste ---------- */
.view-toggle{display:inline-flex;background:#eef1f6;border-radius:9px;padding:3px;gap:2px}
.view-toggle button{border:none;background:transparent;border-radius:7px;padding:6px 13px;font-weight:600;font-size:12.5px;color:var(--muted)}
.view-toggle button.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(15,27,51,.12)}
/* ---------- grupisanje po zaposlenom ---------- */
.emp-group{padding:0;overflow:hidden;margin-bottom:16px}
.emp-head{display:flex;align-items:center;gap:11px;padding:13px 16px;background:linear-gradient(180deg,#f8fafd,#f2f5fa);border-bottom:1px solid var(--line)}
.emp-task{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.emp-task:last-child{border-bottom:none}
.emp-task:hover{background:var(--blue-soft)}
.emp-due{flex:none;width:86px;font-weight:700;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.emp-due.late{color:var(--red)}
.emp-title{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:760px){.emp-title{white-space:normal}.emp-due{width:auto}}


/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:6px;padding:3px 8px;white-space:nowrap}
.b-status-novo{background:#eef1f6;color:#475569}
.b-status-dodeljeno{background:var(--blue-soft);color:#1d4ed8}
.b-status-utoku{background:#ede9fe;color:#6d28d9}
.b-status-ceka{background:var(--amber-soft);color:#b45309}
.b-status-blokirano{background:var(--red-soft);color:#b91c1c}
.b-status-zavrseno{background:var(--mint-soft);color:#047857}
.b-status-otkazano{background:#f1f5f9;color:#94a3b8;text-decoration:line-through}
.b-status-arhivirano{background:#f1f5f9;color:#94a3b8}
.b-pri-nizak{background:#f1f5f9;color:#64748b}
.b-pri-normalan{background:var(--blue-soft);color:#1d4ed8}
.b-pri-visok{background:var(--amber-soft);color:#b45309}
.b-pri-kritican{background:var(--red);color:#fff}
.b-late{background:var(--red-soft);color:#b91c1c}
.b-ok{background:var(--mint-soft);color:#047857}
.b-dept{background:#f1f5f9;color:#475569}

/* table */
.table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
th{background:#f7f9fc;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #f0f3f8;vertical-align:middle}
tbody tr:hover{background:#f9fbfe}
td .t-title{font-weight:600;cursor:pointer}
td .t-title:hover{color:var(--blue)}
.row-actions{display:flex;gap:5px;white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.filters select,.filters input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;font-size:13px;outline:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip.active{background:var(--navy);border-color:var(--navy);color:#fff}

/* kanban */
.kanban{display:flex;gap:13px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.kb-col{background:#eef1f6;border-radius:var(--radius);width:272px;flex:none;padding:10px}
.kb-col h4{font-size:12.5px;display:flex;justify-content:space-between;align-items:center;padding:2px 4px 9px;color:#475569;text-transform:uppercase;letter-spacing:.4px}
.kb-col h4 .cnt{background:#fff;border-radius:10px;padding:1px 8px;font-size:11px}
.kb-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(15,27,51,.06);cursor:pointer}
.kb-card:hover{border-color:var(--blue)}
.kb-card .kb-title{font-weight:600;font-size:13px;margin-bottom:7px}
.kb-meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.kb-foot{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted)}
.kb-foot select{border:1px solid var(--line);border-radius:6px;font-size:11px;padding:2px 4px;max-width:110px}

/* calendar */
.cal-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;padding:4px 0}
.cal-day{background:#fff;border:1px solid var(--line);border-radius:9px;min-height:74px;padding:6px;font-size:12px;cursor:pointer;position:relative}
.cal-day:hover{border-color:var(--blue)}
.cal-day.other{opacity:.38}
.cal-day.today{border-color:var(--blue);box-shadow:0 0 0 2px rgba(37,99,235,.18)}
.cal-day.selected{background:var(--blue-soft)}
.cal-day .d-num{font-weight:700}
.cal-pill{margin-top:5px;background:var(--blue);color:#fff;border-radius:8px;font-size:10.5px;font-weight:700;padding:1px 7px;display:inline-block}
.cal-pill.late{background:var(--red)}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(14,27,51,.5);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:34px 14px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:680px;box-shadow:0 24px 70px rgba(0,0,0,.3);animation:pop .16s ease}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line)}
.modal header h2{font-size:16px}
.modal .modal-body{padding:18px 20px;max-height:70vh;overflow-y:auto}
.modal footer{display:flex;justify-content:flex-end;gap:9px;padding:13px 20px;border-top:1px solid var(--line)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.form-grid .full{grid-column:1/-1}
.check-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid #f0f3f8;font-size:13px}
.check-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue)}
.check-row .req{font-size:10px;background:var(--amber-soft);color:#b45309;border-radius:5px;padding:1px 6px;font-weight:700}
.check-row.done label{text-decoration:line-through;color:var(--muted)}
.comment{border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:9px;background:#fbfcfe}
.comment .c-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.comment .c-head b{color:var(--navy)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 16px;margin-bottom:14px;font-size:13px}
.detail-grid .dg-item span{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.mention{color:var(--blue);font-weight:700}
.tag{background:#eef1f6;border-radius:6px;padding:2px 8px;font-size:11.5px;color:#475569;font-weight:600}

/* toast */
#toastWrap{position:fixed;bottom:22px;right:22px;z-index:90;display:flex;flex-direction:column;gap:9px}
.toast{background:var(--navy);color:#fff;border-radius:10px;padding:11px 16px;box-shadow:var(--shadow);font-size:13.5px;display:flex;gap:9px;align-items:center;animation:pop .2s ease;max-width:340px}
.toast.ok{background:#065f46}.toast.err{background:#b91c1c}.toast.warn{background:#b45309}

/* efficiency / mgmt */
.rank-row{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid #f0f3f8}
.rank-num{width:26px;height:26px;border-radius:50%;background:#eef1f6;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none}
.rank-row.top .rank-num{background:var(--amber);color:#fff}
.eff-bar{flex:1;height:8px;background:#eef1f6;border-radius:5px;overflow:hidden}
.eff-fill{height:100%;border-radius:5px}
.reco{display:flex;gap:10px;background:var(--amber-soft);border:1px solid #fbe4bd;border-radius:10px;padding:10px 13px;margin-bottom:9px;font-size:13px}
.reco.crit{background:var(--red-soft);border-color:#f6c8c8}
.reco.info{background:var(--blue-soft);border-color:#cfdffb}
.note{font-size:12px;color:var(--muted);background:#f7f9fc;border:1px dashed var(--line);border-radius:9px;padding:9px 12px;margin-top:10px}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.empty b{display:block;font-size:15px;color:var(--text);margin-bottom:4px}

/* bottom nav (mobile) */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:50;justify-content:space-around;padding:5px 4px calc(6px + env(safe-area-inset-bottom))}
.bottom-nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);padding:5px 9px;border-radius:9px;font-weight:600}
.bottom-nav button svg{width:20px;height:20px}
.bottom-nav button.active{color:var(--blue);background:var(--blue-soft)}

/* ---------- v2.0: prioriteti, rokovi, prisustvo, prilozi, podsetnici ---------- */
@keyframes pulseCrit{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.45)}50%{box-shadow:0 0 0 6px rgba(239,68,68,0)}}
.b-pri-kritican{animation:pulseCrit 1.7s ease-in-out infinite}
.b-warn{background:var(--amber-soft);color:#b45309}
tr.row-crit td:first-child{box-shadow:inset 3px 0 0 var(--red)}
tr.row-visok td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
tr.row-late td{background:#fffafa}
.kb-card.pri-kritican{border-left:3px solid var(--red)}
.kb-card.pri-visok{border-left:3px solid var(--amber)}
.emp-task.pri-kritican{box-shadow:inset 3px 0 0 var(--red)}
.emp-task.pri-visok{box-shadow:inset 3px 0 0 var(--amber)}
.att-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid #f0f3f8;font-size:13px}
.att-row .att-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;cursor:pointer;color:var(--blue)}
.rem-row{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #f0f3f8;font-size:12.5px;color:var(--muted)}
.pres-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f0f3f8;font-size:13px}
.pres-dot{width:9px;height:9px;border-radius:50%;background:#cbd5e1;flex:none}
.pres-dot.on{background:var(--mint);box-shadow:0 0 0 3px rgba(16,185,129,.18)}

/* ---------- v2.1: skor tabla (znakovi) ---------- */
.score-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:11px}
.score-presets{display:flex;gap:6px;flex-wrap:wrap}
.chip-p{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font:600 12px/1 inherit;color:var(--muted);cursor:pointer;transition:.15s}
.chip-p:hover{border-color:var(--blue);color:var(--blue)}
.chip-p.on{background:var(--navy);border-color:var(--navy);color:#fff}
.sc-row{display:grid;grid-template-columns:26px 34px 1fr auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid #f0f3f8;cursor:pointer;transition:background .15s}
.sc-row:hover{background:#f7f9fc}
.sc-row:last-child{border-bottom:none}
.sc-rank{font:700 13px/1 inherit;color:var(--muted);text-align:center}
.sc-rank.top{color:var(--amber)}
.sc-name{min-width:0;overflow:hidden}
.sc-name b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-name>.small{display:block}
.sc-rank{font-size:15px}
.sc-bar{height:5px;border-radius:3px;background:#eef1f6;margin-top:5px;overflow:hidden;display:flex}
.sc-bar i{display:block;height:100%}
.sc-bar i.p{background:var(--mint)}
.sc-bar i.m{background:var(--red)}
.sc-nums{display:flex;align-items:center;gap:7px;white-space:nowrap}
.sc-pill{border-radius:999px;padding:3px 9px;font:700 12px/1.4 inherit;background:#f7f9fc;color:var(--muted)}
.sc-pill.p{background:var(--mint-soft);color:#047857}
.sc-pill.m{background:var(--red-soft);color:#b91c1c}
.sc-net{min-width:44px;text-align:right;font:800 16px/1 inherit}
.sc-net.pos{color:var(--mint)} .sc-net.neg{color:var(--red)} .sc-net.zero{color:var(--muted)}
.myscore{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.myscore .big{font:800 40px/1 inherit}
.mark-row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid #f0f3f8;font-size:13px}
.mark-row:last-child{border-bottom:none}
.mark-ico{font-size:17px;line-height:1.2;text-align:center}
.mark-reason{color:var(--text)}
.mark-meta{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.mark-when{font-size:11.5px;color:var(--muted);white-space:nowrap;text-align:right}
.mark-row.annulled .mark-reason{text-decoration:line-through;color:var(--muted)}
.mark-row.annulled .mark-ico{opacity:.35}
.annul-note{display:block;margin-top:4px;font-size:11.5px;color:#047857;background:var(--mint-soft);border-radius:6px;padding:3px 8px}
.pick-user{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px;max-height:190px;overflow:auto;padding:3px;border:1px solid var(--line);border-radius:9px}
.pick-user button{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid transparent;border-radius:7px;background:#fff;cursor:pointer;text-align:left;font:600 12.5px/1.3 inherit;color:var(--text)}
.pick-user button:hover{background:#f7f9fc}
.pick-user button.on{border-color:var(--blue);background:#eff4ff}
.tog-2{display:flex;gap:8px}
.tog-2 button{flex:1;padding:11px;border:1.5px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font:700 14px/1 inherit;color:var(--muted)}
.tog-2 button.onp{border-color:var(--mint);background:var(--mint-soft);color:#047857}
.tog-2 button.onm{border-color:var(--red);background:var(--red-soft);color:#b91c1c}

/* print */
#printArea{display:none}
@page{size:A4 landscape;margin:10mm}
@media print{
  body>#appShell,#toastWrap,.modal-overlay,#loginScreen{display:none!important}
  #printArea{display:block;padding:10px;font-size:12px}
  #printArea h1{font-size:20px}
  #printArea table{min-width:0;width:100%}
  #printArea th,#printArea td{padding:6px 8px;border:1px solid #ccc}
  #printArea .p-head{display:flex;justify-content:space-between;border-bottom:3px solid #0e1b33;padding-bottom:8px;margin-bottom:14px}
  #printArea .p-kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  #printArea .p-kpi{border:1px solid #ccc;border-radius:8px;padding:8px 14px}
  #printArea .p-kpi b{display:block;font-size:18px}
}

@media(max-width:1020px){.grid-2,.grid-3{grid-template-columns:1fr}}
@media(max-width:760px){
  .sidebar{display:none}
  .main{margin-left:0}
  .bottom-nav{display:flex}
  .content{padding:14px 12px 84px}
  .topbar{padding:9px 12px}
  .topbar h1{font-size:15.5px}
  .search-wrap{flex:1 1 auto}
  .topbar .me b,.topbar .me span:not(.avatar){display:none}
  .form-grid{grid-template-columns:1fr}
  .grid-kpi{grid-template-columns:1fr 1fr}
  .notif-panel{left:10px;right:10px;width:auto}
  .kb-col{width:246px}
  .cal-day{min-height:56px;font-size:11px}
  table{min-width:640px}
}
/* =====================================================================
   v2.3 — REDIZAJN: asfalt + signalna žuta (kolovozna oznaka)
   Jedan upečatljiv element: žuta signalizacija za ono što traži pažnju
   (aktivni kanal, pominjanje, nepročitano). Sve ostalo je mirno.
   ===================================================================== */
:root{
  --asfalt:#14213A; --asfalt-2:#1C2D4D; --asfalt-3:#253B63; --asfalt-line:#22355A;
  --side-txt:#B9C6DD; --side-dim:#7F93B5;
  --signal:#F2B705; --signal-ink:#3A2C00; --signal-soft:#FFF7DB;
  --navy:#14213A; --navy-2:#1C2D4D;
  --font:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --top-h:54px;
  --side-strong:#FFFFFF; --primary-ink:#1D4ED8; --primary-soft:#EAF1FE; --primary-line:#9DB8F2;
  --primary-ring:rgba(37,99,235,.13); --signal-text:#8A6A00; --signal-flash:#FFF0B3; --signal-mention:#FDE68A;
}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sidebar :focus-visible{outline-color:var(--signal)}

/* ---------- sidebar ---------- */
.sidebar{width:264px;background:var(--asfalt);color:var(--side-txt)}
.main{margin-left:264px}
.sidebar .brand{padding:14px 16px 12px;border-bottom:1px solid var(--asfalt-line);gap:11px}
.sidebar .brand{color:var(--side-strong)}
.sidebar .brand .logo-mark{width:34px;height:34px;border-radius:9px;font-size:14px;background:var(--signal);color:var(--signal-ink)}
.sidebar .brand .logo-mark span{color:var(--signal-ink);opacity:.65}
.sidebar .brand b{font-size:15.5px;letter-spacing:-.2px}
.sidebar .brand small{color:var(--side-dim);font-size:12px}
#sidebarNav{padding:10px 0 14px}
.side-search{display:flex;align-items:center;gap:9px;margin:2px 12px 10px;padding:8px 10px;width:calc(100% - 24px);border-radius:8px;border:1px solid var(--asfalt-line);background:rgba(255,255,255,.04);color:var(--side-dim);font-size:13.5px;text-align:left}
.side-search:hover{background:rgba(255,255,255,.08);color:var(--side-txt)}
.side-search svg{width:15px;height:15px;flex:none}
.side-search kbd{margin-left:auto}
kbd{font:600 11px/1 var(--font);padding:3px 6px;border-radius:5px;border:1px solid currentColor;opacity:.75}
.nav-sec{margin-top:6px}
.nav-sec-h{display:flex;align-items:center;padding:0 8px 0 10px}
.nav-sec-t{flex:1;display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--side-dim);font:600 13px/1 var(--font);padding:7px 6px;border-radius:6px;text-align:left}
.nav-sec-t:hover{color:var(--side-txt)}
.nav-sec-t svg{width:12px;height:12px;transition:transform .15s;transform:rotate(90deg)}
.nav-sec.collapsed .nav-sec-t svg{transform:rotate(0)}
.nav-sec.collapsed .nav-sec-b>*:not(.active):not(.unread){display:none}
.nav-add{background:none;border:none;color:var(--side-dim);width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center}
.nav-add:hover{background:var(--asfalt-2);color:var(--side-strong)}
.nav-add svg{width:15px;height:15px}
.nav-group{display:none}
.nav-item{position:relative;gap:9px;padding:6px 12px;margin:1px 8px;border-radius:7px;color:var(--side-txt);font-size:14px;font-weight:400;min-height:32px}
.nav-item svg{width:16px;height:16px;opacity:.75}
.nav-item:hover{background:var(--asfalt-2);color:var(--side-strong)}
.nav-item.active{background:var(--asfalt-3);color:var(--side-strong);font-weight:500}
.nav-item.active::before{content:"";position:absolute;left:-8px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--signal)}
.nav-item.unread{color:var(--side-strong);font-weight:600}
.nav-item .ch-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-hash{width:16px;text-align:center;color:var(--side-dim);font-weight:500;flex:none}
.nav-item.unread .ch-hash,.nav-item.active .ch-hash{color:var(--side-txt)}
.nav-badge{margin-left:auto;min-width:20px;height:19px;padding:0 6px;border-radius:10px;background:var(--asfalt-3);color:var(--side-strong);font:700 11.5px/19px var(--font);text-align:center}
.nav-badge.strong{background:var(--signal);color:var(--signal-ink)}
.dm-av{position:relative;display:inline-flex;flex:none}
.dm-av .avatar{border-radius:6px;font-size:9px}
.dm-av .dot{position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;border-radius:50%;background:var(--asfalt);border:2px solid var(--asfalt);box-shadow:inset 0 0 0 1.5px var(--side-dim)}
.dm-av .dot.on{background:#2BAC76;box-shadow:none}
.nav-item:hover .dm-av .dot,.nav-item.active .dm-av .dot{border-color:var(--asfalt-2)}
.nav-ghost{color:var(--side-dim)}
.nav-note{margin:4px 18px 8px;font-size:12.5px;color:var(--side-dim);line-height:1.45}
.nav-note b{color:var(--side-txt)}
.sidebar .side-footer{border-top-color:var(--asfalt-line);color:var(--side-dim);font-size:11.5px}

/* ---------- topbar ---------- */
.topbar{min-height:var(--top-h);padding:8px 20px;gap:12px}
.topbar h1{font-size:17px;font-weight:600;display:flex;flex-direction:column;justify-content:center;min-width:0;line-height:1.2}
.tt-main{display:flex;align-items:center;gap:7px;white-space:nowrap}
.tt-main .avatar{border-radius:6px}
.tt-hash{color:var(--muted);font-weight:500;margin-right:1px}
.tt-sub{font-size:12.5px;font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.qs-trigger{display:flex;align-items:center;gap:9px;flex:0 1 380px;min-width:0;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:#F4F6FA;color:var(--muted);font-size:13.5px;text-align:left}
.qs-trigger:hover{border-color:#C9D3E2;background:#fff}
.qs-trigger svg{width:15px;height:15px;flex:none}
.qs-trigger span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qs-trigger kbd{color:var(--muted)}

/* ---------- chat okvir ---------- */
.main.chat-mode .content{padding:0;max-width:none;height:calc(100vh - var(--top-h));overflow:hidden}
.chat{display:flex;height:100%;background:#fff}
.chat-main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.msg-scroll{flex:1;overflow-y:auto;padding:8px 0 6px;overscroll-behavior:contain}
.chat-loading,.chat-hint{padding:18px 22px;color:var(--muted);font-size:13.5px}
.chat-loading.small{text-align:center;font-size:12px;padding:10px}
.chat-empty{padding:40px 22px;color:var(--muted)}
.chat-empty b{display:block;color:var(--text);margin-bottom:4px}
.chat-intro{padding:28px 22px 14px}
.chat-intro .avatar{border-radius:12px}
.chat-intro h2{font-size:22px;letter-spacing:-.3px;margin:10px 0 4px}
.chat-intro p{color:var(--muted);max-width:60ch}
.intro-hash svg{width:26px;height:26px}
.intro-hash{width:56px;height:56px;border-radius:12px;background:var(--signal-soft);color:var(--signal-text);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:600}
.chat-banner{display:flex;align-items:center;gap:10px;padding:9px 20px;background:#F4F6FA;border-bottom:1px solid var(--line);font-size:13px}
.chat-banner svg{width:16px;height:16px;flex:none;color:var(--muted)}
.chat-banner span{flex:1}
.btn-ghost{background:none;border-color:transparent}

/* razdelnici */
.day-div{display:flex;align-items:center;gap:12px;margin:14px 20px 6px;color:var(--muted);font-size:12.5px;font-weight:600}
.day-div::before,.day-div::after{content:"";flex:1;height:1px;background:var(--line)}
.day-div span{padding:3px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.new-div{display:flex;align-items:center;margin:8px 20px;color:var(--signal-text);font-size:11.5px;font-weight:700}
.new-div::before{content:"";flex:1;height:2px;background:var(--signal)}
.new-div span{padding-left:8px}

/* poruka */
.msg{position:relative;display:grid;grid-template-columns:44px 1fr;column-gap:10px;padding:6px 20px 6px 18px}
.msg.grouped{padding-top:1px;padding-bottom:2px}
.msg:hover{background:#F7F8FA}
.msg.mention-me{background:var(--signal-soft);box-shadow:inset 3px 0 0 var(--signal)}
.msg.pending{opacity:.6}
.msg.failed .msg-text{color:var(--red)}
.msg.flash{animation:msgFlash 2s ease-out}
@keyframes msgFlash{0%,40%{background:var(--signal-flash)}100%{background:transparent}}
.msg-gutter{display:flex;justify-content:flex-end;padding-top:2px}
.msg-gutter .avatar{border-radius:9px;font-size:13px}
.g-time{visibility:hidden;font-size:11px;color:var(--muted);padding-top:3px;white-space:nowrap}
.msg:hover .g-time{visibility:visible}
.msg-body{min-width:0}
.msg-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.msg-head b{font-weight:600;font-size:14.5px}
.msg-head time{font-size:12px;color:var(--muted)}
.msg-text{font-size:14.5px;line-height:1.55;overflow-wrap:anywhere;max-width:78ch}
.msg-text code{font-size:13px;background:#F1F3F7;border:1px solid #E3E7EE;border-radius:5px;padding:1px 5px}
.m-code{font-size:13px;background:#F6F8FB;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:5px 0;white-space:pre-wrap;overflow-x:auto}
.msg-text a{color:var(--blue);text-decoration:underline;text-underline-offset:2px}
.mention{color:var(--primary-ink);background:var(--primary-soft);border-radius:4px;padding:0 3px;font-weight:500}
.mention.me{color:var(--signal-ink);background:var(--signal-mention)}
.edited{font-size:12px;color:var(--muted)}
.msg-deleted{font-style:italic;color:var(--muted);font-size:14px}
.msg-failed{font-size:12.5px;color:var(--red);margin-top:2px}
.link-btn{background:none;border:none;color:var(--blue);font:600 12.5px var(--font);padding:0;text-decoration:underline}
.msg-sys .msg-head .sys-txt{color:var(--muted);font-size:14px}

/* alati poruke (hover) */
.msg-tools{position:absolute;top:-15px;right:20px;display:none;align-items:center;gap:1px;padding:3px;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 4px 12px rgba(20,33,58,.1);z-index:3}
.msg:hover .msg-tools,.msg:focus-within .msg-tools,.msg.show-tools .msg-tools{display:flex}
.msg-tools button{width:30px;height:28px;border:none;background:none;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px}
.msg-tools button:hover{background:#F1F3F7;color:var(--text)}
.msg-tools button svg{width:16px;height:16px}
.msg-tools .t-danger:hover{color:var(--red)}

/* reakcije */
.reacts{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.rx{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border-radius:13px;border:1px solid #E3E8F0;background:#F7F8FA;font-size:14px;line-height:1}
.rx b{font-size:12px;font-weight:600;color:var(--muted)}
.rx:hover{border-color:#C9D3E2;background:#fff}
.rx.mine{border-color:var(--primary-line);background:var(--primary-soft)}
.rx.mine b{color:var(--primary-ink)}
.rx-add{display:none;color:var(--muted)}
.rx-add svg{width:14px;height:14px}
.msg:hover .rx-add{display:inline-flex}
.react-pop{position:fixed;z-index:200;display:flex;gap:2px;padding:5px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,33,58,.16)}
.react-pop button{width:34px;height:34px;border:none;background:none;border-radius:8px;font-size:19px}
.react-pop button:hover{background:#F1F3F7}

/* nit — link */
.thread-link{display:inline-flex;align-items:center;gap:6px;margin-top:5px;padding:4px 8px 4px 4px;border:1px solid transparent;border-radius:8px;background:none;font-size:13px;color:var(--muted)}
.thread-link .avatar{border-radius:5px;font-size:8px}
.thread-link b{color:var(--blue);font-weight:600}
.thread-link:hover{border-color:var(--line);background:#fff}

/* task kartica */
.tcard{margin-top:6px;max-width:460px;padding:10px 12px 10px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;box-shadow:inset 3px 0 0 #CBD5E1}
.tcard:hover{border-color:var(--primary-line)}
.tcard.pri-kritican{box-shadow:inset 3px 0 0 var(--red)}
.tcard.pri-visok{box-shadow:inset 3px 0 0 var(--amber)}
.tcard.pri-normalan{box-shadow:inset 3px 0 0 var(--blue)}
.tcard-top{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.tcard-title{font-weight:600;font-size:14.5px;line-height:1.35}
.tcard-meta{display:flex;align-items:center;gap:12px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.tcard-av{display:inline-flex;margin-left:auto}
.tcard-av .avatar{margin-left:-5px;border:2px solid #fff}
.tcard-off{cursor:default;color:var(--muted);font-size:13px;box-shadow:none}
.share-task{margin-bottom:14px}
.share-task .tcard{max-width:none;cursor:default}

/* kuca... */
.typing-line{height:20px;padding:0 22px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.typing-dots{display:inline-flex;gap:3px}
.typing-dots i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:tdot 1.2s infinite}
.typing-dots i:nth-child(2){animation-delay:.15s}.typing-dots i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{opacity:.25}30%{opacity:1}}
.jump-new{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);padding:7px 14px;border-radius:16px;border:none;background:var(--navy);color:#fff;font:600 12.5px var(--font);box-shadow:0 6px 18px rgba(20,33,58,.25);z-index:4}

/* composer */
.composer{position:relative;padding:0 20px 16px}
.composer-box{border:1px solid #CBD3DF;border-radius:11px;background:#fff;transition:border-color .15s,box-shadow .15s}
.composer-box:focus-within{border-color:var(--primary-line);box-shadow:0 0 0 3px var(--primary-ring)}
.composer textarea{display:block;width:100%;border:none;outline:none;resize:none;padding:11px 14px 4px;font:14.5px/1.5 var(--font);background:transparent;max-height:40vh}
.composer-bar{display:flex;align-items:center;gap:10px;padding:4px 6px 6px 14px}
.composer-hint{flex:1;font-size:11.5px;color:#94A0B4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.composer-hint b{font-weight:600;color:#7C889C}
.send-btn{margin-left:auto;width:34px;height:30px;border:none;border-radius:7px;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.send-btn svg{width:16px;height:16px}
.send-btn:disabled{background:#E5E9F0;color:#A4AEBF;cursor:default}
.mention-pop{position:absolute;left:20px;bottom:calc(100% - 8px);width:min(360px,calc(100% - 40px));background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 12px 32px rgba(20,33,58,.16);padding:5px;z-index:20}
.mp-item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:none;background:none;border-radius:7px;text-align:left;font-size:13.5px}
.mp-item .avatar{border-radius:6px}
.mp-item>span:last-child{color:var(--muted);font-size:12.5px;margin-left:auto}
.mp-item.sel,.mp-item:hover{background:var(--primary-soft)}

/* izmena */
.msg-edit textarea{width:100%;border:1px solid var(--primary-line);border-radius:9px;padding:9px 11px;font:14.5px/1.5 var(--font);resize:none;outline:none;box-shadow:0 0 0 3px var(--primary-ring)}
.edit-bar{display:flex;align-items:center;gap:6px;margin-top:6px}
.edit-bar .small{flex:1}

/* panel niti */
.thread-panel{width:min(420px,40%);flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;background:#fff}
.thread-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 10px 18px;border-bottom:1px solid var(--line);min-height:52px}
.thread-head b{display:block;font-size:15px}
.thread-head span{font-size:12.5px;color:var(--muted)}
.icon-btn.sm{width:32px;height:32px;background:none;border-color:transparent}
.icon-btn.sm:hover{background:#F1F3F7}
.icon-btn.sm svg{width:16px;height:16px}
.thread-scroll{flex:1;overflow-y:auto;padding:10px 0}
.thread-count{display:flex;align-items:center;gap:10px;margin:8px 18px;font-size:12.5px;color:var(--muted)}
.thread-count::after{content:"";flex:1;height:1px;background:var(--line)}
.thread-panel .msg{padding-left:14px;padding-right:14px}
.thread-panel .msg-tools{right:12px}

/* brza pretraga */
.modal.modal-qs{width:min(640px,calc(100vw - 24px));padding:0;overflow:hidden;align-self:flex-start;margin-top:12vh}
.qs-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.qs-in svg{width:18px;height:18px;color:var(--muted);flex:none}
.qs-in input{flex:1;border:none;outline:none;font:16px var(--font);background:none}
.qs-in kbd{color:var(--muted)}
.qs-list{max-height:min(56vh,460px);overflow-y:auto;padding:6px}
.qs-g{padding:9px 10px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.qs-item{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border:none;background:none;border-radius:8px;text-align:left}
.qs-item .avatar{border-radius:6px;flex:none}
.qs-item.sel{background:var(--primary-soft)}
.qs-ico{width:22px;height:22px;border-radius:6px;background:#F1F3F7;display:inline-flex;align-items:center;justify-content:center;font-weight:600;color:var(--muted);flex:none}
.qs-ico svg{width:14px;height:14px}
.qs-t{min-width:0;display:flex;flex-direction:column}
.qs-t b{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qs-t span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qs-empty{padding:22px;text-align:center;color:var(--muted);font-size:13.5px}
.qs-foot{display:flex;gap:16px;padding:9px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);background:#FAFBFC}
.qs-foot kbd{margin-right:3px}

/* mobilni */
.bottom-nav button{position:relative}
.bn-badge{position:absolute;top:2px;right:calc(50% - 20px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--signal);color:var(--signal-ink);font:700 10.5px/17px var(--font)}
.chat-list-m{background:var(--asfalt);border-radius:14px;padding:12px 0 6px}
.chat-list-m>.btn{margin:0 12px 6px;width:calc(100% - 24px);display:flex;gap:8px;justify-content:center}
.chat-list-m .btn svg{width:15px;height:15px}
@media(max-width:1100px){.thread-panel{width:360px}.composer-hint{display:none}}
@media(max-width:760px){
  .main{margin-left:0}
  .qs-trigger span,.qs-trigger kbd{display:none}
  .qs-trigger{flex:none;width:38px;height:38px;padding:0;justify-content:center;border-radius:50%}
  .main.chat-mode .content{height:calc(100vh - var(--top-h) - 62px);padding:0}
  .msg{padding-left:10px;padding-right:12px;grid-template-columns:38px 1fr}
  .msg-gutter .avatar{width:34px!important;height:34px!important}
  .msg-tools{right:10px}
  .composer{padding:0 10px 10px}
  .thread-panel{position:fixed;inset:0 0 62px 0;width:auto;z-index:45}
  .tt-sub{display:none}
}
@media(prefers-reduced-motion:reduce){
  .msg.flash,.typing-dots i,.b-pri-kritican{animation:none}
  .nav-sec-t svg{transition:none}
}


/* ---------- v2.4: Podešavanja → Izgled ---------- */
.th-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.th-card{display:flex;flex-direction:column;gap:2px;padding:8px 8px 10px;border:1.5px solid var(--line);border-radius:12px;background:#fff;text-align:left}
.th-card:hover{border-color:var(--primary-line)}
.th-card.on{border-color:var(--blue);box-shadow:0 0 0 3px var(--primary-ring)}
.th-prev{display:grid;grid-template-columns:46% 1fr;height:68px;border-radius:8px;overflow:hidden;border:1px solid var(--line);margin-bottom:7px}
.th-sb{position:relative;padding:13px 8px 0 11px;display:flex;flex-direction:column;gap:7px}
.th-sb i{position:absolute;left:0;top:11px;width:3px;height:12px;border-radius:0 2px 2px 0}
.th-sb b{display:block;height:5px;border-radius:3px;width:62%}
.th-sb b+b{width:46%}
.th-sb u{position:absolute;right:8px;top:12px;width:10px;height:10px;border-radius:50%}
.th-main{background:#fff;padding:13px 9px 10px;display:flex;flex-direction:column;gap:6px}
.th-main s{display:block;height:4px;border-radius:2px;background:#E5E9F0;width:90%}
.th-main s+s{width:64%}
.th-main em{display:block;width:38px;height:12px;border-radius:4px;margin-top:auto}
.th-name{font-weight:600;font-size:13.5px}
.th-note{font-size:12px;color:var(--muted)}
.th-sub{font-size:14px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.th-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 18px;margin-bottom:14px}
.th-field{display:flex;flex-direction:column;gap:5px}
.th-field label{font-size:12.5px;font-weight:600}
.th-pick{display:flex;gap:8px;align-items:center}
.th-pick input[type=color]{width:42px;height:38px;padding:3px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;flex:none}
.th-pick input:not([type=color]),.th-field>input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:14px var(--font);background:#fbfcfe;outline:none}
.th-pick input:not([type=color]){text-transform:uppercase;font-variant-numeric:tabular-nums}
.th-pick input:focus,.th-field>input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--primary-ring);background:#fff}
.th-pick input.invalid{border-color:var(--red)}
.th-check{margin-bottom:14px}
.th-ok{font-size:13px;color:#047857;background:var(--mint-soft);border-radius:9px;padding:9px 12px}
.th-warn{font-size:13px;color:#92400E;background:var(--amber-soft);border-radius:9px;padding:9px 12px;margin-bottom:6px}
#themeCard .btn:disabled{opacity:.45;cursor:default}

/* ---------- v2.5: privatni kanali, članovi, administracija ---------- */
.ch-head-act{display:flex;align-items:center;gap:6px;margin-left:12px;flex:none}
.hb{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);font:500 13px var(--font)}
.hb:hover{background:#F4F6FA}
.hb svg{width:15px;height:15px;color:var(--muted)}
.ch-hash svg{width:13px;height:13px;vertical-align:-1px}
.tt-lock{display:inline-flex;color:var(--muted);margin-right:3px}
.tt-lock svg{width:15px;height:15px}
.qs-ico svg{width:13px;height:13px}
.modal header h2 svg{width:17px;height:17px;vertical-align:-2px;color:var(--muted)}
.badge svg{width:11px;height:11px;vertical-align:-1px;margin-right:2px}
.b-priv{background:#EEF0FF;color:#3B3FB0}
.b-pub{background:var(--primary-soft);color:var(--primary-ink)}
.b-arch{background:#F1F3F7;color:var(--muted)}
.chm-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:12px}
.chm-h{font-size:13.5px;font-weight:600;margin:16px 0 8px}
.chm-chips{display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow:auto}
.chm-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border:1px solid var(--line);border-radius:14px;font-size:12.5px}
.mem-row{display:grid;grid-template-columns:30px 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #F0F3F8}
.mem-n{display:flex;flex-direction:column;min-width:0}
.mem-n b{font-size:13.5px;font-weight:600}
.mem-n>span{font-size:12px;color:var(--muted)}
.chm-add{display:flex;gap:8px;margin-top:12px}
.chm-add select{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:13.5px var(--font);background:#fff}
.chm-actions{display:flex;flex-wrap:wrap;gap:8px}
.chm-actions .btn svg,.ch-act .btn svg{width:14px;height:14px;vertical-align:-2px}
.chm-check{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px}
.chk-row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:13.5px}
.chk-row:hover{background:#F7F8FA}
.chk-row input{width:16px;height:16px;accent-color:var(--blue);flex:none}
.btn.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.btn-danger:disabled{opacity:.45;cursor:default}
.btn.btn-danger-o{color:var(--red)}
.btn.btn-danger-o:hover{background:var(--red-soft);border-color:#F5B5B5}
.del-warn{background:var(--red-soft);color:#991B1B;border-radius:9px;padding:10px 12px;font-size:13.5px;line-height:1.5}
.ch-table td{vertical-align:middle}
.ch-link{display:inline-flex;align-items:center;gap:4px;font-weight:600;text-decoration:none!important;color:var(--text)!important;font-size:14px}
.ch-link svg{width:13px;height:13px;color:var(--muted)}
.ch-act{white-space:nowrap;text-align:right}
.ch-act .btn{margin-left:4px}
tr.row-arch td{opacity:.6}
@media(max-width:760px){.hb span{display:none}.ch-head-act{margin-left:4px}.hb{padding:0 8px}}
/* ---------- v2.6: FAZE — jedna boja po fazi, svuda ista ---------- */
.st-novo{--stc:#64748B;--stb:#F8FAFC;--stp:#EEF1F5;--stt:#3F4B5E}
.st-dodeljeno{--stc:#7C3AED;--stb:#FAF7FF;--stp:#EDE7FE;--stt:#5B21B6}
.st-utoku{--stc:#2563EB;--stb:#F5F8FF;--stp:#E3ECFD;--stt:#1D4ED8}
.st-ceka{--stc:#D97706;--stb:#FFFAF0;--stp:#FDEFD3;--stt:#92400E}
.st-blokirano{--stc:#DC2626;--stb:#FFF6F6;--stp:#FDE2E2;--stt:#991B1B}
.st-zavrseno{--stc:#059669;--stb:#F3FBF7;--stp:#D9F2E6;--stt:#065F46}
.st-otkazano,.st-arhivirano{--stc:#94A3B8;--stb:#F8F9FB;--stp:#EEF0F4;--stt:#64748B}
.b-status-novo{background:#EEF1F5;color:#3F4B5E}.b-status-dodeljeno{background:#EDE7FE;color:#5B21B6}
.b-status-utoku{background:#E3ECFD;color:#1D4ED8}.b-status-ceka{background:#FDEFD3;color:#92400E}
.b-status-blokirano{background:#FDE2E2;color:#991B1B}.b-status-zavrseno{background:#D9F2E6;color:#065F46}
.b-status-otkazano,.b-status-arhivirano{background:#EEF0F4;color:#64748B}
tr.st-row td{background:var(--stb);transition:background .12s;padding-top:11px;padding-bottom:11px}
tr.st-row td:first-child{box-shadow:inset 4px 0 0 var(--stc);padding-left:16px}
tr.st-row:hover td{background:var(--stp)}
tr.st-row .t-title{font-weight:600}
tr.st-zavrseno .t-title,tr.st-otkazano .t-title{color:var(--muted);font-weight:500;text-decoration:line-through;text-decoration-color:rgba(100,116,139,.45)}
.st-pill{display:inline-flex;align-items:center;gap:7px;height:27px;padding:0 9px 0 10px;border-radius:14px;border:1px solid transparent;background:var(--stp);color:var(--stt);font:600 12.5px/1 var(--font);white-space:nowrap}
button.st-pill:hover{border-color:var(--stc)}
.st-pill i,.st-opt i,.ph-name i,.ph-chip i{width:8px;height:8px;border-radius:50%;background:var(--stc);flex:none}
.st-pill .cr{width:13px;height:13px;opacity:.7;margin-left:-2px}
.st-menu{position:fixed;z-index:300;width:220px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(20,33,58,.18)}
.st-menu-h{padding:6px 10px;font-size:11.5px;font-weight:600;color:var(--muted)}
.st-opt{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:none;background:none;border-radius:8px;font:500 13.5px var(--font);color:var(--text);text-align:left}
.st-opt:hover,.st-opt:focus{background:var(--stp);outline:none}
.st-opt.cur{font-weight:600}
.st-ok{margin-left:auto;color:var(--stc);font-weight:700}
.kb-col[class*=" st-"]{border-top:3px solid var(--stc)}
.kb-col[class*=" st-"] h4{color:var(--stt)}
.ph-strip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.ph-bar{display:flex;height:8px;border-radius:5px;overflow:hidden;gap:2px;margin-bottom:10px}
.ph-bar span{background:var(--stc);min-width:4px}
.ph-legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ph-chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:14px;border:1px solid var(--line);background:#fff;font:500 12.5px var(--font);color:var(--text)}
.ph-chip b{font-weight:700;color:var(--stt)}
.ph-chip:hover{background:var(--stp);border-color:transparent}
.ph-chip.on{background:var(--stp);border-color:var(--stc)}
.ph-total{margin-left:auto;font-size:12.5px;color:var(--muted)}
.ph-group{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;box-shadow:inset 0 3px 0 var(--stc)}
.ph-head{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px 10px;border:none;background:#fff;text-align:left;font:inherit;border-bottom:1px solid var(--line)}
.ph-head .cr{width:15px;height:15px;color:var(--muted);transition:transform .15s}
.ph-group.collapsed .ph-head{border-bottom:none}
.ph-group.collapsed .ph-head .cr{transform:rotate(-90deg)}
.ph-group.collapsed .ph-body{display:none}
.ph-name{display:inline-flex;align-items:center;gap:8px;padding:4px 11px;border-radius:14px;background:var(--stp);color:var(--stt);font-weight:700;font-size:13px}
.ph-count{font-size:12.5px;color:var(--muted);font-weight:600}
.ph-body{border:none!important;border-radius:0!important;margin:0!important;box-shadow:none!important}
table.tl th{white-space:nowrap}
.page-actions .btn{white-space:nowrap}

/* ---------- v2.6: MOJ PROSTOR ---------- */
.pt-wrap{max-width:1180px}
.pt-top{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap}
.pt-qa{flex:1;min-width:280px}

.pt-tog{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer}

.pt-row{position:relative;display:flex;align-items:center;gap:11px;padding:9px 14px 9px 17px;border-top:1px solid #F0F3F8;cursor:pointer;transition:background .12s}

.pt-row:hover{background:#F8F9FC}
.pt-check{flex:none;width:21px;height:21px;border-radius:50%;border:2px solid #C3CBD8;background:#fff;display:inline-flex;align-items:center;justify-content:center;color:transparent;padding:0;transition:all .15s}
.pt-check svg{width:12px;height:12px}
.pt-check:hover{border-color:#16A34A;color:#16A34A}
.pt-check.on{background:#16A34A;border-color:#16A34A;color:#fff}
.pt-title{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt-note{margin-left:7px;color:var(--muted);font-size:12px}
.pt-row.done .pt-title{color:var(--muted);text-decoration:line-through}

@keyframes ptDone{0%{background:#ECFDF3}100%{opacity:0;transform:translateX(10px)}}
.pt-pri{display:inline-flex}
.pt-st{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:10px;background:#F1F4F9;color:var(--muted);white-space:nowrap}

.pt-empty-ico{width:52px;height:52px;border-radius:50%;background:#ECFDF3;color:#16A34A;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:6px}

.pt-board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.pt-col{background:#F1F4F8;border-radius:12px;padding:10px;min-height:220px;transition:background .12s,box-shadow .12s}

.pt-col-h .nav-add{color:var(--muted)}.pt-col-h .nav-add:hover{background:#fff;color:var(--text)}
.pt-card{background:#fff;border-radius:10px;padding:11px 12px 10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(20,33,58,.08),inset 0 3px 0 var(--ptc);cursor:grab}

.pt-card-m{display:flex;align-items:center;gap:8px;margin-top:6px}
.pt-col.s-done .pt-card-t{color:var(--muted);text-decoration:line-through}
.pt-col-empty{border:1.5px dashed #CBD3DF;border-radius:10px;padding:18px;text-align:center;font-size:12.5px;color:var(--muted)}

.lg-p{background:var(--blue)}.lg-w{border:1.5px solid #7C3AED;background:#fff}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:8px;overflow:hidden}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:15px;border:1px solid var(--line);background:#fff;font:500 13px var(--font);color:var(--text)}
.seg button:hover{border-color:#B9C3D3}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.seg button.on .flag{color:#fff}
.sw{display:flex;gap:9px;flex-wrap:wrap}
.sw button{width:26px;height:26px;border-radius:50%;border:none;background:var(--c);box-shadow:0 0 0 2px #fff,0 0 0 3px transparent;transition:box-shadow .12s}
.sw button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--c)}
.pe-due{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pe-due input{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:14px var(--font)}
.pe-grid textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:14px/1.5 var(--font);resize:vertical;width:100%}
.pe-priv{margin-top:14px}
.undo-toast{display:flex;align-items:center;gap:14px}
.undo-toast button{border:none;background:rgba(255,255,255,.18);color:#fff;font:600 12.5px var(--font);padding:5px 10px;border-radius:7px}
#ptDash .pt-row{border-top:1px solid #F0F3F8}
@media(max-width:760px){.pt-board{grid-template-columns:repeat(4,78vw)}.cal-day{min-height:72px}.cal-chip{font-size:10.5px}.pe-grid{grid-template-columns:1fr}.pt-stats span{min-width:68px}.cal-leg{display:none}}
@media(prefers-reduced-motion:reduce){.pt-row.completing{animation:none}}
</style>
